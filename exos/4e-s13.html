(function(){

var EX = [
 {id: 'n29a', lv: 1, n: 'N29', t: 'Écrire avec une puissance', d: '3 × 3 × 3 × 3 = 3⁴.', c: 'Donne l’exposant.', a: 'aⁿ = a × a × … × a (n facteurs égaux). L’exposant est le nombre de facteurs.',
  g: function(){ var b = pick([2, 3, 5, 7, 10, -2, -3, 4, 6]), n = rnd(3, 7), L = []; for (var i = 0; i < n; i++) L.push(b < 0 ? '(' + fr(b) + ')' : fr(b));

 {id: 'n29c', lv: 2, n: 'N29', t: 'Vrai ou faux ?', d: 'Les pièges des puissances.', c: 'L’égalité est-elle vraie ou fausse ?', a: 'Attention : 2³ = 8 (pas 6) ; −2² = −4 mais (−2)² = 4 ; a⁰ = 1.',

 {id: 'n29d', lv: 2, n: 'N29', t: 'Priorités avec des puissances', d: 'La puissance d’abord.', c: 'Calcule.', a: 'La puissance est prioritaire sur la multiplication et l’addition : 2 × 3² = 2 × 9 = 18.',
  g: function(){ var a = rnd(2, 6), b = rnd(2, 5), n = rnd(2, 3), c = rnz(-9, 9), t = rnd(0, 3), q, v, st;

EX.push(
 {id: 'n30a', lv: 1, n: 'N30', t: 'Puissances de 10', d: 'Écriture décimale.', c: 'Donne l’écriture décimale.', a: '10ⁿ (n positif) : 1 suivi de n zéros. 10⁻ⁿ : 0,0…01 avec le 1 au n-ième rang après la virgule.',
  g: function(){ var n = rnd(-6, 8); return {type: 'num', q: '10' + sup(n) + ' = ?', v: n >= 0 ? Math.pow(10, n) : cl(Math.pow(10, n)), steps: [n >= 0 ? '1 suivi de ' + n + ' zéro' + (n > 1 ? 's' : '') + ' : ' + strP10(n) + '.' : '10' + sup(n) + ' = 1 ÷ 10' + sup(-n) + ' = ' + strP10(n) + ' (le 1 est au ' + (-n) + 'e rang après la virgule).'], key: 'p' + n}; }},
 {id: 'n30b', lv: 2, n: 'N30', t: 'Produits et quotients', d: '10ᵃ × 10ᵇ, 10ᵃ ÷ 10ᵇ.', c: 'Écris le résultat sous la forme 10ⁿ : donne n.', a: '10ᵃ × 10ᵇ = 10ᵃ⁺ᵇ ; 10ᵃ ÷ 10ᵇ = 10ᵃ⁻ᵇ ; (10ᵃ)ᵇ = 10ᵃˣᵇ.',

 {id: 'n30c', lv: 2, n: 'N30', t: 'Les préfixes', d: 'kilo, méga, giga, milli, micro, nano.', c: 'Donne l’exposant n.', a: 'kilo = 10³, méga = 10⁶, giga = 10⁹, téra = 10¹² ; milli = 10⁻³, micro = 10⁻⁶, nano = 10⁻⁹.',
  g: function(){ var P = [['kilo', 'k', 3], ['méga', 'M', 6], ['giga', 'G', 9], ['téra', 'T', 12], ['milli', 'm', -3], ['micro', 'µ', -6], ['nano', 'n', -9], ['centi', 'c', -2]], p = pick(P), U = pick([['mètre', 'm'], ['gramme', 'g'], ['octet', 'o'], ['watt', 'W']]);

function sci(x){ var e = Math.floor(Math.log10(Math.abs(x)) + 1e-9), m = cl(x / Math.pow(10, e)); if (Math.abs(m) >= 10){ m = cl(m / 10); e++; } return [m, e]; }

// écriture décimale exacte (sans erreur d'arrondi) de m × 10^e, m décimal positif
function decS(m, e){ var t = String(m).split('.'), k = (t[1] || '').length, D = (t[0] + (t[1] || '')).replace(/^0+/, ''), p = e - k, r;
  if (p >= 0) r = D + '0'.repeat(p);
  else { var q = D.length + p; r = q > 0 ? D.slice(0, q) + ',' + D.slice(q) : '0,' + '0'.repeat(-q) + D; }
  var ip = r.split(','), a0 = ip[0], dp = ip[1]; if (a0.length > 4) a0 = a0.replace(/\B(?=(\d{3})+$)/g, ' ');
  if (dp && dp.length > 3) dp = dp.replace(/(\d{3})(?=\d)/g, '$1 ');
  return a0 + (dp ? ',' + dp : ''); }
function mant(){ var t = rnd(0, 2); return t === 0 ? rnd(1, 9) : t === 1 ? cl(rnd(11, 99) / 10) : cl(rnd(101, 999) / 100); }

function chkSci(m, e){ return function(vs){ var a = vs[0], n = vs[1];
  if (a !== undefined && n !== undefined && Math.abs(a * Math.pow(10, n) - m * Math.pow(10, e)) < 1e-9 * m * Math.pow(10, e) && (a < 1 || a >= 10))
    return 'Ton écriture est bien égale au nombre, mais ce n’est pas une notation scientifique : il faut un seul chiffre non nul avant la virgule (1 ≤ a < 10).';
  if (a !== undefined && (a < 1 || a >= 10)) return 'Le nombre a doit avoir un seul chiffre non nul avant la virgule (1 ≤ a < 10).';
  if (n === -e && e !== 0) return 'Attention au signe de l’exposant : un nombre plus grand que 10 a un exposant positif, un nombre plus petit que 1 un exposant négatif.';
  if (Math.abs(a - m) < 1e-9 && n !== e) return 'Le nombre a est juste ; recompte de combien de rangs la virgule s’est déplacée.';

 {id: 'n31a', lv: 1, nq: 5, n: 'N31', t: 'Notation scientifique ou non ?', d: 'Un seul chiffre non nul avant la virgule.', c: 'Cette écriture est-elle une notation scientifique ?', a: 'Notation scientifique : a × 10ⁿ, où a a un seul chiffre non nul avant la virgule (1 ≤ a < 10) et n est un nombre entier.',

 {id: 'n31c', lv: 1, nq: 5, n: 'N31', t: 'Revenir à l’écriture décimale', d: 'Décaler la virgule.', c: 'Donne l’écriture décimale.', a: 'Multiplier par 10ⁿ : la virgule se déplace de n rangs vers la droite si n est positif, vers la gauche si n est négatif.',

 {id: 'n31e', lv: 2, nq: 5, n: 'N31', t: 'Rendre l’écriture scientifique', d: '36 × 10⁹, 0,7 × 10⁵, 520 × 10⁻⁶…', c: 'Cette écriture n’est pas une notation scientifique. Écris le nombre en notation scientifique a × 10ⁿ.', a: 'Je reviens à l’écriture décimale du nombre, puis je l’écris en notation scientifique (un seul chiffre non nul avant la virgule).',
