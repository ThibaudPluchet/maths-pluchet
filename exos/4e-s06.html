(function(){

 {id: 'n13a', lv: 1, n: 'N13', t: 'Critères de divisibilité', d: 'Par 2, 3, 4, 5, 9 et 10.', c: 'Le nombre est-il divisible par le diviseur proposé ? Utilise un critère, sans poser la division.', a: 'Par 2 : chiffre des unités pair. Par 5 : 0 ou 5. Par 10 : 0. Par 3 (ou 9) : somme des chiffres multiple de 3 (ou 9). Par 4 : les deux derniers chiffres forment un multiple de 4.',

 {id: 'n13c', lv: 2, n: 'N13', t: 'Liste des diviseurs', d: 'Les trouver tous.', c: 'Combien ce nombre a-t-il de diviseurs ?', a: 'Cherche les diviseurs par paires : 36 = 1 × 36 = 2 × 18 = 3 × 12 = 4 × 9 = 6 × 6. On s’arrête quand les deux facteurs se rejoignent.',

 {id: 'n14b', lv: 2, n: 'N14', t: 'Décomposer en facteurs premiers', d: 'Choisir la bonne décomposition.', c: 'Quelle est la décomposition en produit de facteurs premiers ?', a: 'Divise par 2 tant que possible, puis par 3, 5, 7… Tous les facteurs doivent être premiers (9, 15, 21 ne le sont pas).',
  g: function(){ var n; do { n = rnd(24, 600); } while (isPrime(n) || fac(n).length < 3 || fac(n)[fac(n).length - 1] > 23); var F = fac(n), good = facTxt(F);

    return {type: 'ch', q: n + ' = ?', ch: ch, ans: ch.indexOf(good), steps: [div.join(' ; ') + '.', 'Donc ' + n + ' = ' + good + '.'], key: 'f' + n}; }},
 {id: 'n14c', lv: 2, n: 'N14', t: 'Le plus grand facteur premier', d: 'Décomposer pour le trouver.', c: 'Décompose le nombre et donne son plus grand facteur premier.', a: 'Divise successivement par les nombres premiers 2, 3, 5, 7, 11, 13… jusqu’à obtenir 1.',

    return {type: 'num', q: 'Plus grand facteur premier de ' + n + ' ?', v: F[F.length - 1], steps: [n + ' = ' + facTxt(F) + '.', 'Le plus grand facteur premier est ' + F[F.length - 1] + '.'], key: 'g' + n}; }},
 {id: 'n14d', lv: 3, n: 'N14', t: 'Retrouver le nombre', d: 'À partir de sa décomposition.', c: 'Calcule le nombre.', a: 'Calcule les puissances, puis multiplie en regroupant astucieusement (2 × 5 = 10).',
  g: function(){ var F = []; var k = rnd(3, 6); for (var i = 0; i < k; i++) F.push(pick([2, 2, 3, 3, 5, 7, 11])); var n = F.reduce(function(a, b){ return a * b; }, 1); if (n > 5000) return this.g();

);
