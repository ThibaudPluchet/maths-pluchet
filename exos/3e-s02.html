<script>
(function(){
'use strict';
var main = document.getElementById('main'), tomenu = document.getElementById('tomenu');
var N = 5, SQ = '²', RAC = '√';
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = rnd(0, i), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function rd(x, d){ var p = Math.pow(10, d); return Math.round(x * p + (x >= 0 ? 1e-9 : -1e-9)) / p; }
function cl(x){ return rd(x, 6); }                                         // nettoie les erreurs d'arrondi des flottants
function fr(x){ x = cl(x); var neg = x < 0, t = String(Math.abs(x)).split('.'), ip = t[0];
  if (ip.length > 4) ip = ip.replace(/\B(?=(\d{3})+$)/g, ' ');
  return (neg ? '−' : '') + ip + (t[1] ? ',' + t[1] : ''); }
function fn(x){ return fr(x); }
function sq(x){ return cl(x * x); }
function isInt(x){ return Math.abs(x - Math.round(x)) < 1e-9; }
function parseNum(s){ s = String(s || '').replace(/[≈~]/g, '').replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/[a-zA-Zµ²]+\.?$/, '').replace(/,/g, '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null; }
function nDec(s){ s = String(s || '').replace(/\s+/g, '').replace(/[a-zA-Z²]+$/, ''); var m = s.match(/[.,](\d+)$/); return m ? m[1].length : 0; }
function letters(){ var L = 'ABCDEFGHIJKLMNPRSTUVWXYZ'.split(''); shuffle(L); return L.slice(0, 3); }
function seg(p, q){ return '[' + [p, q].sort().join('') + ']'; }
function nm(p, q){ return [p, q].sort().join(''); }
var ARR = {0: 'à l’unité', 1: 'au dixième', 2: 'au centième'};

/* ---------- triangle rectangle : sommet de l'angle droit R, autres sommets P et Q ---------- */
function tri(){ var t = letters(), r = rnd(0, 2); var R = t[r], o = t.filter(function(_, i){ return i !== r; }); shuffle(o);
  return {name: t.join(''), R: R, P: o[0], Q: o[1]}; }
// figure SVG : RP = a, RQ = b (longueurs affichées : labels), "?" sur le côté cherché
function fig(T, a, b, lab){
  var ra = a, rb = b, rr = ra / rb; if (rr > 2.3) ra = 2.3 * rb; if (rr < 1 / 2.3) rb = 2.3 * ra;
  var th = Math.random() * 2 * Math.PI, fl = Math.random() < 0.5 ? -1 : 1;
  var ux = Math.cos(th), uy = Math.sin(th), vx = -Math.sin(th) * fl, vy = Math.cos(th) * fl;
  var P0 = [0, 0], P1 = [ra * ux, ra * uy], P2 = [rb * vx, rb * vy];
  var xs = [P0[0], P1[0], P2[0]], ys = [P0[1], P1[1], P2[1]];
  var W = 300, H = 210, pad = 40, mnx = Math.min.apply(0, xs), mxx = Math.max.apply(0, xs), mny = Math.min.apply(0, ys), mxy = Math.max.apply(0, ys);
  var k = Math.min((W - 2 * pad) / (mxx - mnx || 1), (H - 2 * pad) / (mxy - mny || 1));
  var ox = (W - k * (mxx - mnx)) / 2 - k * mnx, oy = (H - k * (mxy - mny)) / 2 - k * mny;
  function m(p){ return [ox + k * p[0], oy + k * p[1]]; }
  var A = m(P0), B = m(P1), C = m(P2), G = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
  function f(v){ return v.toFixed(1); }
  function out(p, d){ var dx = p[0] - G[0], dy = p[1] - G[1], l = Math.hypot(dx, dy) || 1; return [p[0] + dx / l * d, p[1] + dy / l * d]; }
  function lbl(p, t, cls){ return '<text x="' + f(p[0]) + '" y="' + f(p[1]) + '" class="' + (cls || 'pt') + '" text-anchor="middle" dominant-baseline="central">' + t + '</text>'; }
  function mid(p, q, t){ var M = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l;
    if ((M[0] + nx - G[0]) * nx + (M[1] + ny - G[1]) * ny < 0){ nx = -nx; ny = -ny; }
    var w = t.length * 4.3 + 6; return lbl([M[0] + nx * (14 + Math.abs(nx) * w * 0.6), M[1] + ny * 15], t, t === '?' ? 'qm' : 'ln'); }
  var s = 12, U = [(B[0] - A[0]) / Math.hypot(B[0] - A[0], B[1] - A[1]), (B[1] - A[1]) / Math.hypot(B[0] - A[0], B[1] - A[1])], V = [(C[0] - A[0]) / Math.hypot(C[0] - A[0], C[1] - A[1]), (C[1] - A[1]) / Math.hypot(C[0] - A[0], C[1] - A[1])];
  var sqp = [A, [A[0] + U[0] * s, A[1] + U[1] * s], [A[0] + U[0] * s + V[0] * s, A[1] + U[1] * s + V[1] * s], [A[0] + V[0] * s, A[1] + V[1] * s]];
  var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="fig" role="img" aria-label="Triangle ' + T.name + ' rectangle en ' + T.R + '">';
  h += '<polygon points="' + [A, B, C].map(function(p){ return f(p[0]) + ',' + f(p[1]); }).join(' ') + '" class="tr"/>';
  h += '<line x1="' + f(B[0]) + '" y1="' + f(B[1]) + '" x2="' + f(C[0]) + '" y2="' + f(C[1]) + '" class="hy"/>';
  h += '<polyline points="' + sqp.map(function(p){ return f(p[0]) + ',' + f(p[1]); }).join(' ') + '" class="ra"/>';
  h += lbl(out(A, 15), T.R) + lbl(out(B, 15), T.P) + lbl(out(C, 15), T.Q);
  if (lab.a) h += mid(A, B, lab.a); if (lab.b) h += mid(A, C, lab.b); if (lab.c) h += mid(B, C, lab.c);
  return h + '</svg>';

// triplets pythagoriciens (valeurs exactes), mis à l'échelle
var TRIP = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [6, 8, 10], [9, 12, 15], [20, 21, 29], [12, 16, 20], [15, 20, 25], [9, 40, 41]];
// en mm : longueurs entières seulement ; en cm, dm, m : décimaux possibles
function triple(u){ var t = pick(TRIP), k = pick(u === 'mm' ? [1, 2, 3, 10] : t[2] > 20 ? [1, 1, 0.5, 0.1] : [1, 1, 2, 0.5, 3, 10, 0.1]); return t.map(function(v){ return cl(v * k); }); }
function len(u){ return u === 'mm' ? rnd(3, 40) : Math.random() < 0.7 ? rnd(2, 15) : cl(rnd(15, 120) / 10); }
function unit(){ return pick(['cm', 'cm', 'cm', 'm', 'mm', 'dm']); }
function sqrtTxt(s){ return RAC + fn(s); }
// réponse numérique : v attendu (exact ou arrondi d décimales), x valeur exacte, pièges à reconnaître
function numQ(o){ o.type = 'num'; return o; }

/* ---------- vérification d'une réponse numérique ---------- */
function checkNum(Q, raw){
  var v = parseNum(raw); if (!String(raw || '').trim()) return {blank: true};
  if (v === null) return {why: 'Je n’arrive pas à lire ta réponse : écris seulement un nombre, par exemple 8,6.'};
  if (Q.d === undefined){ if (Math.abs(v - Q.v) < 1e-9) return {ok: true}; }
  else {
    if (Math.abs(v - Q.v) < 1e-9) return nDec(raw) > Q.d ? {why: 'Ta réponse a trop de chiffres après la virgule : arrondis ' + ARR[Q.d] + '.'} : {ok: true};
    if (Math.abs(v - Q.x) < Math.pow(10, -Q.d)) return {why: 'Presque : vérifie l’arrondi ' + ARR[Q.d] + '.'};
  }
  var tr = Q.traps || [];
  for (var i = 0; i < tr.length; i++) if (Math.abs(v - tr[i][0]) < (Q.d === undefined ? 1e-9 : Math.pow(10, -Q.d))) return {why: tr[i][1]};
  return {why: 'Ce n’est pas le bon résultat.'};
}

/* ---------- les exercices ---------- */
// calcul de l'hypoténuse ou d'un côté de l'angle droit, avec figure (fig = true) ou énoncé seul
function pyth(hyp, figure, opts){
  opts = opts || {};
  var T = tri(), u = unit(), a, b, c, exact = Math.random() < 0.5, d = 1;
  if (exact){ var t = triple(u); if (Math.random() < 0.5) t = [t[1], t[0], t[2]]; a = t[0]; b = t[1]; c = t[2]; }
  else if (hyp){ do { a = len(u); b = len(u); } while (isInt(Math.sqrt(sq(a) + sq(b))) || a === b && Math.random() < 0.7); c = Math.sqrt(sq(a) + sq(b)); }
  else { do { c = len(u); b = len(u); } while (b >= c || c - b < 0.8 || isInt(Math.sqrt(sq(c) - sq(b)))); a = Math.sqrt(sq(c) - sq(b)); }
  if (!exact) d = pick([1, 1, 1, 0, 2]);
  var RP = nm(T.R, T.P), RQ = nm(T.R, T.Q), PQ = nm(T.P, T.Q);
  var q = 'Le triangle ' + T.name + ' est rectangle en ' + T.R + '. ', lab = {}, ask, x, st = [], traps = [];
  st.push('Le triangle ' + T.name + ' est rectangle en ' + T.R + ', d’après le théorème de Pythagore :', PQ + SQ + ' = ' + RP + SQ + ' + ' + RQ + SQ);
  if (hyp){
    ask = PQ; x = Math.sqrt(sq(a) + sq(b)); lab = {a: fn(a) + ' ' + u, b: fn(b) + ' ' + u, c: '?'};
    q += figure ? 'Calcule ' + PQ : RP + ' = ' + fn(a) + ' ' + u + ' et ' + RQ + ' = ' + fn(b) + ' ' + u + '. Calcule ' + PQ;
    st.push(PQ + SQ + ' = ' + fn(a) + SQ + ' + ' + fn(b) + SQ, PQ + SQ + ' = ' + fn(sq(a)) + ' + ' + fn(sq(b)) + ' = ' + fn(sq(a) + sq(b)));
    traps = [[cl(a + b), 'On additionne les carrés des longueurs, pas les longueurs elles-mêmes.'], [cl(sq(a) + sq(b)), 'Tu as trouvé ' + PQ + SQ + ' : il reste à prendre la racine carrée.']];
    var s2 = cl(sq(a) + sq(b));
  } else {
    ask = RP; x = Math.sqrt(sq(c) - sq(b)); lab = {a: '?', b: fn(b) + ' ' + u, c: fn(c) + ' ' + u};
    q += figure ? 'Calcule ' + RP : PQ + ' = ' + fn(c) + ' ' + u + ' et ' + RQ + ' = ' + fn(b) + ' ' + u + '. Calcule ' + RP;
    st.push(fn(c) + SQ + ' = ' + RP + SQ + ' + ' + fn(b) + SQ, RP + SQ + ' = ' + fn(c) + SQ + ' − ' + fn(b) + SQ + ' = ' + fn(sq(c)) + ' − ' + fn(sq(b)) + ' = ' + fn(sq(c) - sq(b)));
    traps = [[Math.sqrt(sq(c) + sq(b)), RP + ' n’est pas l’hypoténuse : il faut soustraire les carrés, pas les additionner.'], [cl(c - b), 'On soustrait les carrés des longueurs, pas les longueurs elles-mêmes.'], [cl(sq(c) - sq(b)), 'Tu as trouvé ' + RP + SQ + ' : il reste à prendre la racine carrée.'], [cl(sq(c) + sq(b)), RP + ' n’est pas l’hypoténuse : il faut soustraire les carrés.']];
    var s2 = cl(sq(c) - sq(b));
  }
  var v = exact ? cl(x) : rd(x, d);
  if (exact) st.push(ask + ' = ' + sqrtTxt(s2) + ' = ' + fn(v) + ' ' + u);
  else st.push(ask + ' = ' + sqrtTxt(s2) + ' ≈ ' + fn(v) + ' ' + u + ' (' + ARR[d] + ')');
  q += exact ? '.' : ', arrondi ' + ARR[d] + '.';
  if (!figure && Math.random() < 0.5) q += ' (Fais d’abord une figure à main levée.)';
  return numQ({q: q, svg: figure ? fig(T, a, b, lab) : null, lab: ask + ' ' + (exact ? '=' : '≈'), unit: u, v: v, x: x, d: exact ? undefined : d, traps: traps, steps: st, key: q});
}
var EX = [
 {id: 'n04a', lv: 1, n: 'N04', t: 'Repérer l’hypoténuse', d: 'L’hypoténuse et l’égalité de Pythagore.',
  c: 'Choisis la bonne réponse.', a: 'L’hypoténuse est le côté en face de l’angle droit : c’est le seul côté qui ne touche pas le sommet de l’angle droit. Dans l’égalité, elle est seule d’un côté du signe =.',
  g: function(){ var T = tri(), RP = nm(T.R, T.P), RQ = nm(T.R, T.Q), PQ = nm(T.P, T.Q), kind = rnd(0, 2), fg = Math.random() < 0.6;
    var lab = {}, ch, ans, q, st;
    if (kind === 0){ q = 'Le triangle ' + T.name + ' est rectangle en ' + T.R + '. Quelle est son hypoténuse ?';
