<header class="wrap">

  <p class="kick">3e · Séquence 13 · Théorème de Pythagore (2)</p>
  <h1>S’entraîner</h1>
  <p class="sub">Des exercices classiques, différents à chaque série, corrigés tout de suite. Calculatrice autorisée.</p>

<script src="moteur.js"></script>
<script>
(function(){
'use strict';
var rnd = M.rnd, pick = M.pick, shuffle = M.shuffle, fr = M.fr, cl = M.cl, sq = M.sq, SQ = M.SQ;
var TRIP = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [6, 8, 10], [9, 12, 15], [20, 21, 29], [12, 16, 20], [9, 40, 41], [12, 35, 37]];
// trois longueurs : rectangle (triplet mis à l'échelle) ou presque
function three(){ var t = pick(TRIP), k = pick([1, 1, 2, 0.5, 0.1, 3, 10, 1.5]), s = t.map(function(v){ return cl(v * k); }), yes = Math.random() < 0.5;
  if (!yes){ var i = rnd(0, 2), dlt = k < 1 ? 0.1 : k >= 10 ? 1 : pick([1, -1]); s[i] = cl(s[i] + dlt * pick([1, -1])); if (s[i] <= 0) s[i] = cl(s[i] + 2 * Math.abs(dlt)); }
  var o = s.slice().sort(function(a, b){ return a - b; }); yes = Math.abs(sq(o[2]) - sq(o[0]) - sq(o[1])) < 1e-9; if (o[0] + o[1] <= o[2]) return three();
  return {s: s, o: o, yes: yes}; }
function tname(){ var L = M.letters(3); return L; }
function proof(L, s, o, yes, u){ var map = {}; [[L[0] + L[1], s[0]], [L[1] + L[2], s[1]], [L[0] + L[2], s[2]]].forEach(function(p){ map[p[0]] = p[1]; });
  var big = Object.keys(map).filter(function(k){ return map[k] === o[2]; })[0], others = Object.keys(map).filter(function(k){ return k !== big; }), R = L.filter(function(c){ return big.indexOf(c) < 0; })[0];
  return ['Le plus grand côté est [' + big + '].', big + SQ + ' = ' + fr(o[2]) + SQ + ' = ' + fr(sq(o[2])) + ' et ' + others[0] + SQ + ' + ' + others[1] + SQ + ' = ' + fr(map[others[0]]) + SQ + ' + ' + fr(map[others[1]]) + SQ + ' = ' + fr(sq(map[others[0]])) + ' + ' + fr(sq(map[others[1]])) + ' = ' + fr(cl(sq(map[others[0]]) + sq(map[others[1]]))) + '.',
    yes ? 'Les deux résultats sont égaux : d’après la réciproque du théorème de Pythagore, le triangle est rectangle en ' + R + '.' : 'Les deux résultats sont différents : d’après le théorème de Pythagore (contraposée), le triangle n’est pas rectangle.'].concat([R]); }
var EX = [
 {id: 'n20a', lv: 1, n: 'N20', t: 'Que faut-il comparer ?', d: 'Le plus grand côté d’abord.',
  c: 'Choisis la bonne réponse.', a: 'On calcule séparément le carré du plus grand côté, et la somme des carrés des deux autres. S’ils sont égaux, le triangle est rectangle (en face du plus grand côté).',
  g: function(){ var L = tname(), T = three(), s = T.s, names = [L[0] + L[1], L[1] + L[2], L[0] + L[2]], bi = s.indexOf(T.o[2]), o = names.filter(function(_, i){ return i !== bi; });
    var good = names[bi] + SQ + ' et ' + o[0] + SQ + ' + ' + o[1] + SQ, ch = shuffle([good, o[0] + SQ + ' et ' + names[bi] + SQ + ' + ' + o[1] + SQ, names[bi] + ' et ' + o[0] + ' + ' + o[1]]);
    var q = 'Dans le triangle ' + L.join('') + ', ' + names.map(function(n, i){ return n + ' = ' + fr(s[i]) + ' cm'; }).join(', ') + '. Pour savoir s’il est rectangle, que compare-t-on ?';
    return {type: 'ch', q: q, ch: ch, ans: ch.indexOf(good), steps: ['Le plus grand côté est [' + names[bi] + '] : on compare ' + good + '.'], key: q}; }},
 {id: 'n20b', lv: 2, n: 'N20', nq: 4, t: 'Rectangle ou pas ?', d: 'Calculer et conclure.',
  c: 'Le triangle est-il rectangle ? Fais le calcul au brouillon (calculatrice autorisée).', a: 'Exemple : 5² = 25 et 3² + 4² = 9 + 16 = 25, égaux : le triangle est rectangle. Si les deux résultats sont différents, il ne l’est pas.',
  g: function(){ var L = tname(), T = three(), u = pick(['cm', 'm', 'mm']), names = [L[0] + L[1], L[1] + L[2], L[0] + L[2]], q = 'Le triangle ' + L.join('') + ' a pour côtés ' + names.map(function(n, i){ return n + ' = ' + fr(T.s[i]) + ' ' + u; }).join(', ') + '. Est-il rectangle ?';
    var p = proof(L, T.s, T.o, T.yes, u); p.pop(); return {type: 'ch', q: q, ch: ['Oui', 'Non'], ans: T.yes ? 0 : 1, steps: p, key: q}; }},
 {id: 'n20c', lv: 2, n: 'N20', nq: 4, t: 'Rectangle en quel point ?', d: 'Le sommet de l’angle droit.',
  c: 'Le triangle est rectangle. Choisis le sommet de l’angle droit.', a: 'L’angle droit est en face du plus grand côté (l’hypoténuse) : c’est le sommet qui n’appartient pas au plus grand côté.',
  g: function(){ var L = tname(), t = pick(TRIP), k = pick([1, 2, 0.5, 3]), s = shuffle(t.map(function(v){ return cl(v * k); })), o = s.slice().sort(function(a, b){ return a - b; });
    var names = [L[0] + L[1], L[1] + L[2], L[0] + L[2]], p = proof(L, s, o, true, 'cm'), R = p.pop(), ch = L.slice().sort();
    return {type: 'ch', q: 'Le triangle ' + L.join('') + ' a pour côtés ' + names.map(function(n, i){ return n + ' = ' + fr(s[i]) + ' cm'; }).join(', ') + '. En quel sommet est-il rectangle ?', ch: ch, ans: ch.indexOf(R), steps: p, key: L.join('') + s.join()}; }},
 {id: 'n20d', lv: 2, n: 'N20', t: 'Vrai ou faux ?', d: 'Réciproque, contraposée, pièges.',
  c: 'Chaque affirmation est-elle vraie ou fausse ?', a: 'Théorème : si rectangle, alors égalité. Réciproque : si égalité, alors rectangle. Contraposée : si pas égalité, alors pas rectangle.',
  g: function(){ var L = tname(), A = L[0], B = L[1], C = L[2], T = [
      ['Si ' + B + C + SQ + ' = ' + A + B + SQ + ' + ' + A + C + SQ + ', alors le triangle ' + A + B + C + ' est rectangle en ' + A + '.', true, 'C’est la réciproque du théorème de Pythagore.'],
      ['Si ' + B + C + SQ + ' = ' + A + B + SQ + ' + ' + A + C + SQ + ', alors le triangle ' + A + B + C + ' est rectangle en ' + B + '.', false, 'L’angle droit est en face de [' + B + C + '], donc en ' + A + '.'],
      ['Un triangle de côtés 3, 4 et 5 est rectangle.', true, '5² = 25 = 3² + 4².'],
      ['Un triangle de côtés 4, 5 et 6 est rectangle.', false, '6² = 36 et 4² + 5² = 41 : différents.'],
      ['Pour prouver qu’un triangle est rectangle, on utilise le théorème de Pythagore.', false, 'On utilise sa réciproque ; le théorème sert à calculer une longueur dans un triangle déjà rectangle.'],
      ['Pour prouver qu’un triangle n’est pas rectangle, on utilise la contraposée du théorème de Pythagore.', true, 'Si l’égalité est fausse, le triangle n’est pas rectangle.'],
      ['Si on multiplie les trois côtés d’un triangle rectangle par 10, il reste rectangle.', true, 'Les carrés sont tous multipliés par 100 : l’égalité reste vraie.'],
      ['On peut comparer le carré de n’importe quel côté à la somme des carrés des deux autres.', false, 'Il faut prendre le plus grand côté.'],
      ['Un triangle de côtés 6, 8 et 10 est rectangle.', true, '10² = 100 = 6² + 8² = 36 + 64.'],
      ['Si ' + B + C + SQ + ' ≠ ' + A + B + SQ + ' + ' + A + C + SQ + ' avec [' + B + C + '] le plus grand côté, le triangle peut quand même être rectangle.', false, 'Non : s’il était rectangle, l’égalité serait vraie.'],
      ['Un triangle de côtés 0,3 ; 0,4 et 0,5 est rectangle.', true, '0,5² = 0,25 = 0,09 + 0,16.'],
      ['Un triangle de côtés 2, 3 et 4 est rectangle.', false, '4² = 16 et 2² + 3² = 13.']];
    var i = rnd(0, T.length - 1), p = T[i]; return {type: 'ch', q: p[0], ch: ['Vrai', 'Faux'], ans: p[1] ? 0 : 1, steps: [(p[1] ? 'Vrai. ' : 'Faux. ') + p[2]], key: 'vf' + i}; }},
 {id: 'n20e', lv: 3, n: 'N20', nq: 3, t: 'Problèmes', d: 'Équerres, murs, cadres…',
  c: 'Lis l’énoncé, repère le triangle et son plus grand côté, calcule, puis conclus.', a: 'Les maçons utilisent la « corde à 12 nœuds » : un triangle de côtés 3, 4, 5 (ou proportionnels) a un angle droit.',
  g: function(k){ if (k === undefined) k = rnd(0, 11); var T = three(), q, yes = T.yes, u = 'm', pre;
    var RG = [[0.5, 5], [10, 100], [20, 80], [10, 200], [2, 10], [10, 80], [1, 10], [2, 30], [2, 10], [3, 40], [2, 15], [40, 200]][k], mx = T.o[2];
    var fs = [0.1, 0.2, 0.5, 1, 2, 3, 4, 5, 10, 20, 50].filter(function(f){ var m = mx * f; return m >= RG[0] && m <= RG[1] && T.s.every(function(v){ return M.isInt(cl(v * f) * 10); }); });
    if (!fs.length) return this.g(k); var fk = pick(fs); T.s = T.s.map(function(v){ return cl(v * fk); }); T.o = T.o.map(function(v){ return cl(v * fk); }); var o = T.o;
    var ctx = [
      ['Un maçon vérifie qu’un mur est perpendiculaire au sol. Il marque un point à ' + fr(o[0]) + ' m du coin sur le sol, un autre à ' + fr(o[1]) + ' m du coin sur le mur, et mesure ' + fr(o[2]) + ' m entre ces deux points. Le mur est-il perpendiculaire au sol ?'],
      ['Un cadre rectangulaire mesure ' + fr(o[0]) + ' cm sur ' + fr(o[1]) + ' cm, et sa diagonale ' + fr(o[2]) + ' cm. Ses coins sont-ils bien droits ?'],
      ['Une étagère : le support vertical mesure ' + fr(o[0]) + ' cm, la tablette ' + fr(o[1]) + ' cm, et la barre de renfort qui relie leurs extrémités ' + fr(o[2]) + ' cm. La tablette est-elle perpendiculaire au support ?'],
      ['Un terrain triangulaire a des côtés de ' + T.s.map(fr).join(' m, ') + ' m. Le propriétaire affirme qu’il a un angle droit. A-t-il raison ?'],
      ['Une voile triangulaire a pour côtés ' + T.s.map(fr).join(' m, ') + ' m. Est-ce un triangle rectangle ?'],
      ['Un écran mesure ' + fr(o[0]) + ' pouces de haut, ' + fr(o[1]) + ' pouces de large et sa diagonale ' + fr(o[2]) + ' pouces. Est-il bien rectangulaire ?'],
      ['Une rampe : hauteur ' + fr(o[0]) + ' m, longueur au sol ' + fr(o[1]) + ' m, longueur de la rampe ' + fr(o[2]) + ' m. La hauteur est-elle verticale (perpendiculaire au sol) ?'],
      ['Sur un plan, trois villages sont à ' + T.s.map(fr).join(' km, ') + ' km les uns des autres. Forment-ils un triangle rectangle ?'],
      ['Un charpentier assemble trois poutres de ' + T.s.map(fr).join(' m, ') + ' m en triangle. Obtient-il un angle droit ?'],
      ['Avec une corde à nœuds, on forme un triangle de côtés ' + T.s.map(fr).join(', ') + ' unités. A-t-on un angle droit ?'],
      ['Un poteau est maintenu par un câble : le poteau mesure ' + fr(o[1]) + ' m, le câble ' + fr(o[2]) + ' m, et le câble est fixé au sol à ' + fr(o[0]) + ' m du pied du poteau. Le poteau est-il vertical (sol horizontal) ?'],
      ['Une table triangulaire a des bords de ' + T.s.map(fr).join(' cm, ') + ' cm. Peut-on la placer exactement dans le coin droit d’une pièce ?']][k][0];
    var st = ['Plus grand côté : ' + fr(o[2]) + '. ' + fr(o[2]) + SQ + ' = ' + fr(sq(o[2])) + ' et ' + fr(o[0]) + SQ + ' + ' + fr(o[1]) + SQ + ' = ' + fr(sq(o[0])) + ' + ' + fr(sq(o[1])) + ' = ' + fr(cl(sq(o[0]) + sq(o[1]))) + '.',
      yes ? 'Égalité : d’après la réciproque du théorème de Pythagore, il y a un angle droit.' : 'Pas d’égalité : d’après le théorème de Pythagore (contraposée), il n’y a pas d’angle droit.'];
    return {type: 'ch', q: ctx, ch: ['Oui', 'Non'], ans: yes ? 0 : 1, steps: st, key: 'k' + k}; }}
];
var NOTIONS = [{n: 'N20', t: 'Démontrer qu’un triangle est rectangle (réciproque de Pythagore)', r: 'on compare le carré du plus grand côté et la somme des carrés des deux autres : égaux → rectangle (réciproque) ; différents → pas rectangle (contraposée).'}];
M.start({key: '3e-s13', EX: EX, NOTIONS: NOTIONS});
})();
</script>
