<!doctype html>
<html lang="fr">

<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b2333; --muted:#596277; --line:#e2ded3;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e8eefc; --gridc:#e9e5da;
  --ok:#1e7a46; --oks:#e3f4ea; --ko:#b3261e; --kos:#fbe6e4; --mid:#b85c00; --mids:#fbeedd; --hi:#d6336c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#13161d; --card:#1b1f28; --ink:#eaedf3; --muted:#a3abbc; --line:#2b313e;
    --accent:#86a4ff; --accent-ink:#0f1320; --soft:#222a3e; --gridc:#1a1e27;
    --ok:#6fd49a; --oks:#173326; --ko:#ff8a80; --kos:#3a1f1d; --mid:#f0a050; --mids:#33261a; --hi:#ff7aa5; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px}
.top{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.top a,.top button{color:var(--accent);font-weight:700;font-size:15px;font-family:inherit;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.top a:hover,.top button:hover{text-decoration:underline}
.kick{color:var(--muted);font-weight:700;font-size:14px;margin:0}
h1{font:700 clamp(26px,6vw,38px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:2px 0 6px}
.sub{color:var(--muted);margin:0}
main{padding:14px 0 60px}
h2.cat{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);font:inherit;display:flex;gap:12px;align-items:flex-start}
.tile:hover{border-color:var(--accent);box-shadow:0 6px 20px -14px var(--accent)}
.tile .ic{font-size:26px;line-height:1}
.tile b{display:block;font:700 18px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:4px}
.tile .d{color:var(--muted);font-size:15px;display:block}
.tile .rec{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--ok)}
.tile.big{border:2px solid var(--accent);background:linear-gradient(135deg,var(--soft),var(--card))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph h2{font:700 22px/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
.pts{font-weight:700;color:var(--muted);font-size:15px;white-space:nowrap}
.pts.ok{color:var(--ok)} .pts.mid{color:var(--mid)} .pts.ko{color:var(--ko)}
.consigne{margin:0;color:var(--muted);font-size:15px}
.items{display:grid;gap:14px}
.items > *{min-width:0}
@media (min-width:700px){ .items.two{grid-template-columns:1fr 1fr} }
.item{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:6px}
.item.okI{border-color:var(--ok)} .item.koI{border-color:var(--ko)} .item.midI{border-color:var(--mid)}
.q{font:700 20px/1.35 "Bricolage Grotesque",system-ui,sans-serif}
.q .nm{color:var(--accent);margin-right:6px}
.ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ln .eq{font:700 20px "Bricolage Grotesque",sans-serif;width:1.1em;text-align:center}
.ln .tag{font-size:12px;color:var(--muted);font-weight:700;flex-basis:100%}
input.w{font:700 19px "Bricolage Grotesque",system-ui,sans-serif;flex:1 1 0;width:100%;min-width:0;max-width:340px;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.w.num{max-width:150px;flex:0 1 150px}
input.w:focus{outline:none;border-color:var(--accent)}
input.w.okF{border-color:var(--ok);background:var(--oks)} input.w.koF{border-color:var(--ko);background:var(--kos)}
.corr{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4}
.corr.ok{background:var(--oks)} .corr.mid{background:var(--mids)} .corr.ko{background:var(--kos)}
.cv{font-weight:700;font-size:16px}
.corr.ok .cv{color:var(--ok)} .corr.mid .cv{color:var(--mid)} .corr.ko .cv{color:var(--ko)}
.cw{margin:0;padding-left:20px;color:var(--ink)}
.cs{background:var(--card);border-radius:10px;padding:8px 12px;color:var(--ink)}
.cs .cl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.cs .sl{font:700 19px/1.55 "Bricolage Grotesque",system-ui,sans-serif;white-space:pre-wrap}
.cs .sl.hl{color:var(--ok)}
.ct{color:var(--ink)}
.ct b{color:var(--accent)}
.fill{line-height:2.4;font-size:18px}
select.s{font:700 16px inherit;font-family:inherit;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
select.s.okF{border-color:var(--ok);background:var(--oks)} select.s.koF{border-color:var(--ko);background:var(--kos)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{font:700 16px inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.res{border-radius:14px;padding:12px 16px;font-weight:700;text-align:center}
.res.ok{background:var(--oks);color:var(--ok)} .res.mid{background:var(--mids);color:var(--mid)} .res.ko{background:var(--kos);color:var(--ko)}
.res small{display:block;font-weight:400;color:var(--ink)}
/* planisphère */
.mapbox{margin:0 -6px;overflow-x:auto}
.mapbox.zoom svg.map{min-width:900px}
svg.map{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair;user-select:none}
svg.map .sea{fill:var(--soft)}
svg.map .gl{stroke:var(--line);stroke-width:1}
svg.map .axis{stroke:var(--accent);stroke-width:2}
svg.map .lab{font:700 19px "Atkinson Hyperlegible",sans-serif;fill:var(--muted)}
svg.map .lab2{font:italic 17px "Atkinson Hyperlegible",sans-serif;fill:var(--accent)}
svg.map .pt circle{fill:var(--ink)} svg.map .pt text{font:700 26px "Bricolage Grotesque",sans-serif;fill:var(--ink)}
svg.map .pt.mine circle{fill:var(--hi)} svg.map .pt.mine text{fill:var(--hi)}
svg.map .pt.good circle{fill:var(--ok)} svg.map .pt.good text{fill:var(--ok)}
svg.map .pt.bad circle{fill:var(--ko)} svg.map .pt.bad text{fill:var(--ko)}
svg.map .pt.sol circle{fill:none;stroke:var(--ok);stroke-width:3} svg.map .pt.sol text{fill:var(--ok)}
.coord{display:inline-flex;align-items:center;gap:3px;flex-wrap:nowrap;font:700 18px "Bricolage Grotesque",sans-serif}
.coord input.w.c{max-width:54px;flex:0 0 54px;padding:6px 6px}
.coord select.s{padding:5px 2px}
.row.left{justify-content:flex-start}
.btn.sel{background:var(--soft);border-color:var(--accent)}
/* barre de symboles */
.kbar{display:flex;gap:6px;flex-wrap:wrap;padding-left:calc(1.1em + 8px)}
.kbar button{font:700 20px "Bricolage Grotesque",sans-serif;min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
/* évaluation blanche */
.timerbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.timer{font:700 24px "Bricolage Grotesque",sans-serif}
.timer.low{color:var(--ko)}
.note{font:700 64px/1 "Bricolage Grotesque",sans-serif;text-align:center}
.bilan{display:grid;gap:8px}
.bl{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.bl b{font-size:16px}
.bl .btn{min-height:38px;padding:6px 12px;font-size:14px}
</style>

<body>
<header class="wrap">
  <div class="top"><a href="../" id="home">← Mes cours</a><button type="button" id="tomenu" hidden>← Menu de l’exerciseur</button></div>
  <p class="kick">3e · Évaluation commune E01 · N09, N10, N11</p>
  <h1>Préparer l’évaluation commune</h1>
  <p class="sub">Coordonnées terrestres, tester et résoudre des équations : les mêmes exercices et le même barème que l’évaluation. Calculatrice interdite !</p>
</header>
<main class="wrap" id="main"></main>
<div class="kbar" id="kbar" hidden></div>
<script>
(function(){
'use strict';
var main = document.getElementById('main'), tomenu = document.getElementById('tomenu'), kbar = document.getElementById('kbar');
var MINUS = '−', EPS = 1e-9;
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function eq(a, b){ return Math.abs(a - b) < EPS; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function num(n){ var s = String(Math.abs(Math.round(n * 100) / 100)).replace('.', ','); return s; }
function fmt(n){ return (n < -EPS ? MINUS : '') + num(n); }                    // −4 ; 9
function fmtS(n){ return (n < -EPS ? MINUS : '+') + num(n); }                  // −4 ; +9
function par(n){ return '(' + fmtS(n) + ')'; }
function pts(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
function plural(n, w){ return n + ' ' + w + (n > 1 ? 's' : ''); }

/* ---------- questions des vrais sujets : jamais reproduites ---------- */
// Empreintes (FNV-1a) des calculs des sujets d'évaluation de toutes les classes, produites par _source/exclu_e01.py.
// Seules les empreintes figurent ici : les nombres des sujets ne sont pas lisibles dans la page.
var EXCLU = ["03768ecd", "049715de", "07318222", "0c6f0d1d", "123b0edd", "1cbc2d89", "23e2c325", "29040a80", "35b1cb75", "35b338f4", "36d420e9", "3738747f", "38c732c0", "3ac72130", "3acdf377", "3e6ac4af", "3e6e33e8", "4111973a", "41999238", "43845738", "467d3160", "4a5d8957", "4bc85744", "4c7f7969", "4f5e4033", "4f9cf47b", "518f98db", "52c124c2", "555701ac", "57c99124", "5d8c9be2", "5e0994f0", "61489c37", "620ab3b3", "62722add", "63e1ae91", "64c08372", "653468cd", "66e9ca05", "679e820f", "686f41f1", "6d5c32f2", "7044402f", "7507bcac", "75174e80", "7853e12e", "7a33a202", "7a34097a", "7c6d0039", "81ac4fdd", "82c92096", "86006fe6", "868112f3", "87644cec", "878403f1", "8bc75a1d", "8cf9d129", "9036d6fb", "90e68a2b", "91685d2d", "91d0b303", "954e3d81", "9cbdf5f9", "a2c69989", "a3d201a2", "a98441ec", "ad4352fb", "add44ff7", "af024324", "b07530d9", "b2d00ab2", "b4c92e45", "ba436915", "bb3b9732", "bdd0d5d0", "bebc37da", "c20051fc", "c41603c6", "c4a3d59c", "c7a618ec", "c94c4fb9", "c960fd7e", "cd76e007", "cfd5c037", "d4ebce8b", "d6903610", "d9fe392d", "da17911b", "df051946", "e27a555d", "e2fa9fac", "e37e9985", "e52fd41d", "ea1b614e", "eb7b491d", "eb9a2970", "ebff2b05", "f272d254", "f3947a97", "f6bd7532"];
function fnv(s){ var h = 0x811c9dc5, b = unescape(encodeURIComponent(s)); for (var i = 0; i < b.length; i++){ h ^= b.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }
function excluded(key){ return EXCLU.indexOf(fnv(key)) > -1; }
function fresh(gen, keyOf){ var x, n = 0; do { x = gen(); } while (excluded(keyOf(x)) && ++n < 60); return x; }

/* ---------- lecture des réponses ---------- */
function norm(s){ return String(s || '').replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/\./g, ',').replace(/^=/, ''); }
function parseNum(s){
  s = norm(s).replace(/^\((.*)\)$/, '$1');
  if (!/^[+-]?\d+(,\d+)?$/.test(s)) return null; return parseFloat(s.replace(',', '.'));
}
// expression du type (−5) + (+12)  ou  −4 + 9 + 6 − 8  →  liste de termes {op, v, paren}
function parseExpr(s){
  s = norm(s); var i = 0, terms = [];
  function number(){ var m = /^\d+(,\d+)?/.exec(s.slice(i)); if (!m) return null; i += m[0].length; return parseFloat(m[0].replace(',', '.')); }
  while (i < s.length){
    var op = '+';
    if (terms.length){ if (s[i] !== '+' && s[i] !== '-') return null; op = s[i]; i++; }
    else if ((s[i] === '+' || s[i] === '-') && s[i + 1] === '('){ op = s[i]; i++; }
    var paren = false, sign = 1, v;
    if (s[i] === '('){
      paren = true; i++;
      if (s[i] === '+' || s[i] === '-'){ sign = s[i] === '-' ? -1 : 1; i++; }
      v = number(); if (v === null || s[i] !== ')') return null; i++;
    } else {
      if (!terms.length && (s[i] === '+' || s[i] === '-')){ sign = s[i] === '-' ? -1 : 1; i++; }
      v = number(); if (v === null) return null;
    }
    terms.push({op: op, v: sign * v, paren: paren, eff: (op === '-' ? -1 : 1) * sign * v});
  }
  return terms.length ? terms : null;
}
function sameList(a, b){ return a.length === b.length && a.every(function(x, k){ return eq(x, b[k]); }); }
function sameBag(a, b){ var x = a.slice().sort(function(p, q){ return p - q; }), y = b.slice().sort(function(p, q){ return p - q; }); return sameList(x, y); }
function effs(t){ return t.map(function(x){ return x.eff; }); }
function simpWrite(list){ return list.map(function(x, k){ return (k === 0 ? (x < 0 ? MINUS : '') : (x < 0 ? ' ' + MINUS + ' ' : ' + ')) + num(x); }).join(''); }

/* ---------- champs de saisie ---------- */
var lastInput = null;
function field(cls, ph){
  var i = el('input', 'w' + (cls ? ' ' + cls : '')); i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false; i.inputMode = 'text';
  if (ph) i.placeholder = ph;
  // barre de symboles ( ) + − , placée juste sous la ligne en cours de saisie
  i.addEventListener('focus', function(){ lastInput = i; var ln = i.parentNode; ln.parentNode.insertBefore(kbar, ln.nextSibling); kbar.hidden = false; });
  return i;
}
// le signe moins inséré est le tiret « - » de la touche 6 du clavier, pour que tout s'écrive avec le même symbole
['x', '=', '+', '-', '/', '(', ')', ','].forEach(function(k){
  var b = el('button', null, k); b.type = 'button'; if (k === '-') b.setAttribute('aria-label', 'moins');
  b.addEventListener('mousedown', function(e){ e.preventDefault(); });
  b.onclick = function(){
    if (!lastInput || lastInput.disabled) return;
    var a = lastInput.selectionStart || lastInput.value.length, z = lastInput.selectionEnd || a;
    lastInput.value = lastInput.value.slice(0, a) + k + lastInput.value.slice(z);
    lastInput.focus(); lastInput.setSelectionRange(a + 1, a + 1);
  };
  kbar.appendChild(b);
});
function mark(input, ok){ input.classList.remove('okF', 'koF'); input.classList.add(ok ? 'okF' : 'koF'); }
// Correction d'une question : verdict + ce qui ne va pas + correction rédigée ligne par ligne + rappel du cours
function corr(parent, got, max, o){
  o = o || {}; var full = eq(got, max), k = full ? 'ok' : got > 0 ? 'mid' : 'ko';
  var c = el('div', 'corr ' + k);
  c.appendChild(el('div', 'cv', (full ? '✓ Bravo ! ' : got > 0 ? 'Presque ! ' : '✗ ') + pts(got) + ' / ' + pts(max) + ' point' + (max > 1 ? 's' : '')));
  if (!full && o.why && o.why.length){ var ul = el('ul', 'cw'); o.why.forEach(function(w){ ul.appendChild(el('li', null, w)); }); c.appendChild(ul); }
  if (o.sol && (!full || o.always)){
    var s = el('div', 'cs'); s.appendChild(el('span', 'cl', o.solTitle || 'La bonne rédaction'));
    o.sol.forEach(function(l, i){ s.appendChild(el('div', 'sl' + (i === o.sol.length - 1 && !o.noHl ? ' hl' : ''), l)); });
    c.appendChild(s);
  }
  if (o.tip && !full){ var t = el('div', 'ct'); t.appendChild(el('b', null, '💡 À retenir : ')); t.appendChild(document.createTextNode(o.tip)); c.appendChild(t); }
  parent.appendChild(c); return c;
}
function itemState(item, got, max){ item.classList.add(eq(got, max) ? 'okI' : got > 0 ? 'midI' : 'koI'); }

/* ---------- outils : expressions du premier degré ---------- */
function normE(s){ return String(s || '').replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/,/g, '.').replace(/[×*·]/g, '').replace(/X/g, 'x'); }
// a·x + b  →  {a, b}   (« 12x », « 30+7x », « 7x+30 », « -x », « 2-3x »)
function parseLin(s){
  s = normE(s); if (!s) return null;
  if (!/^[+-]?(\d+(\.\d+)?x?|x)([+-](\d+(\.\d+)?x?|x))*$/.test(s)) return null;
  var a = 0, b = 0, re = /([+-]?)(\d+(?:\.\d+)?)?(x?)/g, m;
  while ((m = re.exec(s)) && m[0] !== ''){
    var k = m[1] === '-' ? -1 : 1, v = m[2] ? parseFloat(m[2]) : 1;
    if (m[3]) a += k * v; else if (m[2]) b += k * v;
  }
  return {a: a, b: b};
}
function parseEqn(s){ var p = normE(s).split('='); if (p.length !== 2) return null; var L = parseLin(p[0]), R = parseLin(p[1]); return L && R ? {L: L, R: R} : null; }
function solOf(E){ var k = E.L.a - E.R.a; return eq(k, 0) ? null : (E.R.b - E.L.b) / k; }
// nombre, fraction ou décimal : « -7/3 », « 7/-3 », « 2,5 »
function parseVal(s){
  s = normE(s).replace(/^x=/, '').replace(/^\((.*)\)$/, '$1');
  var m = /^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/.exec(s);
  if (m){ var d = parseFloat(m[2]); return eq(d, 0) ? null : parseFloat(m[1]) / d; }
  return /^[+-]?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
}
function coefX(a){ return a === 1 ? 'x' : a === -1 ? MINUS + 'x' : fmt(a) + 'x'; }
// écriture d'un membre a·x + b (constFirst : « 2 − 3x »)
function lin(a, b, constFirst){
  if (eq(a, 0)) return fmt(b);
  if (eq(b, 0)) return coefX(a);
  if (constFirst) return fmt(b) + (a < 0 ? ' ' + MINUS + ' ' + (a === -1 ? 'x' : num(-a) + 'x') : ' + ' + (a === 1 ? 'x' : num(a) + 'x'));
  return coefX(a) + (b < 0 ? ' ' + MINUS + ' ' + num(-b) : ' + ' + num(b));
}
function frac(p, q){ // fraction irréductible p/q avec le signe devant
  if (q < 0){ p = -p; q = -q; } var g = (function gcd(x, y){ return y ? gcd(y, x % y) : Math.abs(x); })(Math.abs(p), q);
  p /= g; q /= g; return q === 1 ? fmt(p) : (p < 0 ? MINUS : '') + Math.abs(p) + '/' + q;

  bar.appendChild(tm); bar.appendChild(bend); main.appendChild(bar);
  main.appendChild(el('p', 'consigne', 'Calculatrice interdite. Prends ton temps : il n’y a pas de limite. Rédige comme sur ta copie, une étape par ligne, puis touche « Rendre ma copie ».'));
  var parts = EX.map(function(x){ var inst = x.make(), P = exPanel(x, inst); main.appendChild(P.p); return {x: x, inst: inst, P: P}; });
  var done = false, t0 = Date.now();
  bend.onclick = function(){ finish(); };
  function finish(){
    if (done) return; done = true; kbar.hidden = true;
    var total = 0, bonus = 0, res = [];
    parts.forEach(function(o){
      var got = o.inst.check(); o.P.sc.textContent = pts(got) + ' / ' + pts(o.x.max); o.P.sc.className = 'pts ' + cls(got, o.x.max);
      if (o.x.extra){} else if (o.x.id === 'bonus') bonus = got; else total += got; res.push({x: o.x, got: got});
    });
    // phrases réponses du problème : comptées si le résultat est juste (elles s'écrivent sur la copie)
    var note = Math.min(20, total + bonus);
    note = Math.round(note * 4) / 4;
    var best = parseFloat((store('eval:e01:best') || '0').replace(',', '.'));
    if (note > best) store('eval:e01:best', pts(note));
    store('eval:e01:essais', String(essai));
    var hist = (store('eval:e01:notes') || '').split(';').filter(Boolean).concat([pts(note)]).slice(-6); store('eval:e01:notes', hist.join(';'));
    bar.remove();
    var sum = el('section', 'panel');
    sum.appendChild(el('div', 'note', pts(note) + '/20'));
    var used = Math.max(1, Math.round((Date.now() - t0) / 60000));
    sum.appendChild(el('p', 'consigne', '⏱️ Tu as mis ' + used + ' min' + (used > 30 ? ' : le jour J, tu auras 30 min, entraîne-toi à aller un peu plus vite.' : ' : le jour J, tu auras 30 min, c’est bon !')));
    sum.lastChild.style.textAlign = 'center';
    sum.appendChild(el('p', 'consigne', 'Sujet n° ' + essai + '. ' + (note > best && essai > 1 ? '🏆 Ta meilleure note !' : best ? 'Ta meilleure note : ' + pts(Math.max(best, note)) + '/20.' : '') + (hist.length > 1 ? ' Tes dernières notes : ' + hist.join(' → ') + '.' : '')));
    sum.lastChild.style.textAlign = 'center';
    var again = el('div', 'row'), ba = el('button', 'btn main', '🔁 Recommencer avec un nouveau sujet'); ba.type = 'button'; ba.onclick = function(){ blanc(); }; again.appendChild(ba); sum.appendChild(again);
    var bl = el('div', 'bilan');
    res.forEach(function(r){
      var line = el('div', 'bl'), left = el('span'); left.appendChild(el('b', null, r.x.n + ' · ' + r.x.t + ' : '));
      left.appendChild(el('span', 'pts ' + cls(r.got, r.x.max), pts(r.got) + '/' + pts(r.x.max) + (r.x.extra ? ' (non noté)' : '')));
      line.appendChild(left);
      if (!eq(r.got, r.x.max) && r.x.id !== 'bonus' && !r.x.extra){ var b = el('button', 'btn', 'À retravailler →'); b.type = 'button'; b.onclick = function(){ location.hash = r.x.id; }; line.appendChild(b); }
      bl.appendChild(line);
    });
    sum.appendChild(bl);
    sum.appendChild(el('p', 'consigne', 'La phrase de conclusion du problème est comptée quand le nombre est juste : sur ta vraie copie, pense à l’écrire ! Les corrections détaillées sont sous chaque exercice.'));
    var r2 = el('div', 'row'), b2 = el('button', 'btn', 'Menu'); b2.onclick = function(){ location.hash = ''; }; r2.appendChild(b2); sum.appendChild(r2);
    main.insertBefore(sum, main.firstChild);
    // en bas de la copie corrigée aussi : recommencer
    var foot = el('section', 'panel'); foot.appendChild(el('p', 'consigne', 'Tu as lu toutes les corrections ? Entraîne-toi encore : un nouveau sujet est tiré à chaque fois, tu peux recommencer autant de fois que tu veux.'));
    var fr = el('div', 'row'), fb1 = el('button', 'btn main', '🔁 Recommencer avec un nouveau sujet'), fb2 = el('button', 'btn', 'Menu');
    fb1.onclick = function(){ blanc(); }; fb2.onclick = function(){ location.hash = ''; }; fr.appendChild(fb1); fr.appendChild(fb2); foot.appendChild(fr); main.appendChild(foot);
    window.scrollTo(0, 0);
    stat('/exos/3e-e01-eval/blanc/note', 'Évaluation blanche E01 rendue');
  }
  window.scrollTo(0, 0);
}

function route(){
  var id = location.hash.slice(1);
  if (id === 'blanc') blanc(); else if (id) train(id); else menu();
}
tomenu.onclick = function(){ location.hash = ''; };
try { if (document.referrer && new URL(document.referrer).pathname.replace(/index\.html$/, '') === new URL('../', location.href).pathname) document.getElementById('home').href = document.referrer; } catch(e){}
window.addEventListener('hashchange', route);
route();
})();
</script>
<script src="../stats.js"></script>
