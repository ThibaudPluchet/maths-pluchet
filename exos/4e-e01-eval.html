<style>

<script>
(function(){
'use strict';
var main = document.getElementById('main'), tomenu = document.getElementById('tomenu'), kbar = document.getElementById('kbar');
var MINUS = '−', EPS = 1e-6, KEY = 'eval:4ee01:', PATH = '/exos/4e-e01-eval/';
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function eq(a, b){ return Math.abs(a - b) < EPS; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function num(n){ return String(Math.round(n * 1000) / 1000).replace('.', ','); }
function pts(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
function r1(x){ return Math.round(x * 10) / 10; }
function sq(x){ return Math.round(x * x * 10000) / 10000; }

/* ---------- questions des vrais sujets : jamais reproduites ---------- */
// Empreintes (FNV-1a) des questions des sujets d'évaluation de toutes les classes (A, B et PAP), produites par _source/exclu_4e_e01.py.
// Seules les empreintes figurent ici : les nombres et les noms de triangles des sujets ne sont pas lisibles dans la page.
var EXCLU = ["00cce1a4", "06a99362", "0a8826f4", "1142a676", "153f5dd9", "1884fd79", "18d2baae", "1e2aef23", "2436bcde", "2670487c", "2b831f88", "2c83211b", "2ed962fd", "4e03cf08", "4f0e9639", "5003d22e", "593c82ee", "5b550252", "5cc5af73", "5e55070b", "616aa75c", "618b9c09", "64b936bc", "66b939e2", "67b93b75", "69a272d8", "6a20a3d7", "6ab3062d", "6b8babc7", "6ba275fe", "6ee8b9a4", "70f1e8a8", "7c1f78a8", "7f1f7d61", "81c31ff6", "8627035e", "872704f1", "8a1cf333", "8e3fadeb", "8ff7220c", "a240b0e1", "a3412e03", "b018d3b8", "b118d54b", "b1e57755", "b8df20e8", "bc3806fd", "bc87944b", "bd3dc45d", "c1024218", "c302453e", "c5ba5828", "c66fed73", "c6ba59bb", "c9f4e74a", "ca4f27cb", "caf4e8dd", "cf4f2faa", "d826381b", "da3d9870", "e0800b58", "e3801011", "e623b2a6", "ec30bc14", "eff7e865", "f107d3a0", "f207d533", "f9a0ba09"];
function fnv(s){ var h = 0x811c9dc5, b = unescape(encodeURIComponent(s)); for (var i = 0; i < b.length; i++){ h ^= b.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }
function excluded(key){ return EXCLU.indexOf(fnv(key)) > -1; }
function fresh(gen, keyOf){ var x, n = 0; do { x = gen(); } while (excluded(keyOf(x)) && ++n < 80); return x; }

/* ---------- champs de saisie et barre de symboles ---------- */
var lastInput = null;
function field(cls, ph){
  var i = el('input', 'w' + (cls ? ' ' + cls : '')); i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false; i.autocapitalize = 'off';
  if (ph) i.placeholder = ph;
  i.addEventListener('focus', function(){ lastInput = i; var ln = i.parentNode; ln.parentNode.insertBefore(kbar, ln.nextSibling); kbar.hidden = false; });
  return i;
}
['²', '√', '=', '+', '-', '≈', ',', '[', ']'].forEach(function(k){
  var b = el('button', null, k); b.type = 'button'; if (k === '-') b.setAttribute('aria-label', 'moins');
  b.addEventListener('mousedown', function(e){ e.preventDefault(); });
  b.onclick = function(){
    if (!lastInput || lastInput.disabled) return;
    var a = lastInput.selectionStart == null ? lastInput.value.length : lastInput.selectionStart, z = lastInput.selectionEnd == null ? a : lastInput.selectionEnd;
    lastInput.value = lastInput.value.slice(0, a) + k + lastInput.value.slice(z);
    lastInput.focus(); lastInput.setSelectionRange(a + k.length, a + k.length);
  };
  kbar.appendChild(b);
});
function mark(input, ok){ input.classList.remove('okF', 'koF'); input.classList.add(ok ? 'okF' : 'koF'); }
function lock(list){ list.forEach(function(x){ x.disabled = true; }); }
function sel(opts, ph){ var s = el('select', 's'), o0 = el('option', null, ph || '…'); o0.value = ''; s.appendChild(o0); opts.forEach(function(o){ var op = el('option', null, o); op.value = o; s.appendChild(op); }); return s; }
// Correction d'une question : verdict + ce qui ne va pas + bonne rédaction ligne par ligne + rappel du cours
function corr(parent, got, max, o){
  o = o || {}; var full = eq(got, max), k = full ? 'ok' : got > 0 ? 'mid' : 'ko';
  var c = el('div', 'corr ' + k);
  c.appendChild(el('div', 'cv', (full ? '✓ Bravo ! ' : got > 0 ? 'Presque ! ' : '✗ ') + pts(got) + ' / ' + pts(max) + ' point' + (max > 1 ? 's' : '')));
  if (!full && o.why && o.why.length){ var ul = el('ul', 'cw'); o.why.forEach(function(w){ ul.appendChild(el('li', null, w)); }); c.appendChild(ul); }
  if (o.sol && (!full || o.always)){
    var s = el('div', 'cs'); s.appendChild(el('span', 'cl', o.solTitle || 'La bonne rédaction'));
    o.sol.forEach(function(l, i){ s.appendChild(el('div', 'sl' + (i === o.sol.length - 1 && !o.noHl ? ' hl' : ''), l)); });
    c.appendChild(s);
  }
  if (o.tip && !full){ var t = el('div', 'ct'); t.appendChild(el('b', null, '💡 À retenir : ')); t.appendChild(document.createTextNode(o.tip)); c.appendChild(t); }
  parent.appendChild(c); return c;
}
function itemState(item, got, max){ item.classList.add(eq(got, max) ? 'okI' : got > 0 ? 'midI' : 'koI'); }
function line(it, lab, ph, cls){ var ln = el('div', 'ln'); if (lab) ln.appendChild(el('span', 'lab', lab)); var f = field(cls || '', ph); ln.appendChild(f); it.appendChild(ln); return f; }

/* ---------- lecture des réponses ---------- */
// « AC2 = AB2 + BC2 », « AC^2=AB^2+BC^2 », « 10² = 6² + h² »  →  [{s: ±1, k: 'S:AC' | 'V:h' | 'N:10'}]
function normP(s){
  return String(s || '').replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/\^2|\*\*2/g, '²').replace(/\./g, ',')
    .replace(/([A-Za-z])([A-Za-z])2(?![\d,])/g, function(m, a, b){ return (a + b).toUpperCase() + '²'; }).replace(/\[|\]/g, '')
    .replace(/(^|[=+-])([a-z])2(?![\d,])/g, '$1$2²').replace(/racinede|racine|sqrt|rac/gi, '√');
}
function termKey(t){
  var m = /^([A-Za-z]{2})²$/.exec(t); if (m) return 'S:' + m[1].toUpperCase().split('').sort().join('');
  m = /^([a-z])²$/.exec(t); if (m) return 'V:' + m[1];
  m = /^\(?(\d+(?:,\d+)?)\)?²$/.exec(t); if (m) return 'N:' + parseFloat(m[1].replace(',', '.'));
  return null;
}
function side(str){
  if (!str) return null; var out = [], re = /([+-]?)([^+-]+)/g, m, used = 0;
  while ((m = re.exec(str))){ var k = termKey(m[2]); if (!k) return null; out.push({s: m[1] === '-' ? -1 : 1, k: k}); used += m[0].length; }
  return used === str.length && out.length ? out : null;
}
function parseEqP(s){ var p = normP(s).split('='); if (p.length !== 2) return null; var L = side(p[0]), R = side(p[1]); return L && R ? [L, R] : null; }
function seg(a, b){ return 'S:' + [a, b].sort().join(''); }
function nk(v){ return 'N:' + Math.round(v * 10000) / 10000; }
function bag(list){ return list.map(function(t){ return (t.s < 0 ? '-' : '+') + t.k; }).sort().join(' '); }
// une égalité « un terme = deux termes » (dans un sens ou dans l'autre)
function isPyth(E, hyp, a, b){
  if (!E) return false;
  function ok(L, R){ return L.length === 1 && L[0].s > 0 && L[0].k === hyp && bag(R) === bag([{s: 1, k: a}, {s: 1, k: b}]); }
  return ok(E[0], E[1]) || ok(E[1], E[0]);
}
function isDiff(E, x, H, L){
  if (!E) return false;
  function ok(A, B){ return A.length === 1 && A[0].s > 0 && A[0].k === x && bag(B) === bag([{s: 1, k: H}, {s: -1, k: L}]); }
  return ok(E[0], E[1]) || ok(E[1], E[0]);
}
// nombre seul (on enlève un éventuel « AC² = », « h = », « ≈ », l'unité)
function val(s){
  s = normP(s).replace(/^[A-Za-z]{1,2}²?(=|≈)/, '').replace(/^[=≈]/, '').replace(/(cm|m)²?$/, '');
  return /^\d+(,\d+)?$/.test(s) ? parseFloat(s.replace(',', '.')) : null;
}
function rootOf(s){ // « √65 », « √(65) »  →  65
  s = normP(s).replace(/^[A-Za-z]{1,2}=/, '').replace(/^=/, '');
  var m = /^√\(?(\d+(?:,\d+)?)\)?$/.exec(s); return m ? parseFloat(m[1].replace(',', '.')) : null;
}
function segOk(s, a, b){ s = String(s || '').replace(/[\s\[\]()]/g, '').toUpperCase(); return s.length === 2 && s.split('').sort().join('') === [a, b].sort().join(''); }

/* ---------- figures ---------- */
var NS = 'http://www.w3.org/2000/svg';
// Triangle rectangle en R (sommets P et Q au bout des côtés de l'angle droit) ; lab : étiquettes des côtés RP, RQ, PQ
function fig(o){
  var W = 300, H = 190, svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'fig'); svg.setAttribute('aria-hidden', 'true');
  function S(t, at, txt){ var e = document.createElementNS(NS, t); for (var a in at) e.setAttribute(a, at[a]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; }
  var hp = o.hp || rnd(3, 7), wq = o.wq || rnd(3, 7), r = Math.max(.45, Math.min(2.2, hp / wq)), bw = 140, bh = 115;
  var w = Math.min(bw, bh / r), h = w * r; if (h > bh){ h = bh; w = h / r; }
  var fx = o.fx || 1, fy = o.fy || 1, cx = W / 2, cy = H / 2 + 4;
  function P2(x, y){ return [cx + fx * (x - w / 2), cy - fy * (y - h / 2)]; }
  var R = P2(0, 0), P = P2(0, h), Q = P2(w, 0), G = [(R[0] + P[0] + Q[0]) / 3, (R[1] + P[1] + Q[1]) / 3];
  if (o.ground){ var g1 = P2(-25, 0), g2 = P2(w + 25, 0); S('line', {x1: g1[0], y1: g1[1], x2: g2[0], y2: g2[1], 'class': 'gd'}); }
  S('polygon', {points: [R, P, Q].map(function(p){ return p.join(','); }).join(' '), 'class': 'tri'});
  var k = 13, a1 = P2(0, k), a2 = P2(k, k), a3 = P2(k, 0); S('polyline', {points: [a1, a2, a3].map(function(p){ return p.join(','); }).join(' '), 'class': 'ra'});
  function out(p, d){ var vx = p[0] - G[0], vy = p[1] - G[1], n = Math.sqrt(vx * vx + vy * vy) || 1; return [p[0] + vx / n * d, p[1] + vy / n * d]; }
  if (o.names){ [[R, o.names[0]], [P, o.names[1]], [Q, o.names[2]]].forEach(function(v){ var q = out(v[0], 15); S('text', {x: q[0], y: q[1] + 6, 'text-anchor': 'middle', 'class': 'vx'}, v[1]); }); }
  function mid(p, q){ return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }

function byId(id){ return EX.filter(function(e){ return e.id === id; })[0]; }
function cls(got, max){ return eq(got, max) ? 'ok' : got >= max * .6 ? 'mid' : 'ko'; }
function stat(p, t){ if (window.stat) window.stat(p, t); }

function menu(){
  tomenu.hidden = true; kbar.hidden = true; main.innerHTML = '';
  var best = store(KEY + 'best');
  main.appendChild(el('h2', 'cat', 'Le jour J'));
  var g0 = el('div', 'grid'), t0 = el('button', 'tile big'); t0.type = 'button';
  t0.appendChild(el('span', 'ic', '📝'));
  var s0 = el('span'); s0.appendChild(el('b', null, 'Évaluation blanche')); s0.appendChild(el('span', 'd', 'Un sujet complet comme le jour J, noté sur 20 avec le vrai barème, sans limite de temps. Un nouveau sujet à chaque fois (jamais les questions de ton vrai sujet) : recommence autant de fois que tu veux !'));
  if (best) s0.appendChild(el('span', 'rec', 'Ta meilleure note : ' + best + '/20'));
  t0.appendChild(s0); t0.onclick = function(){ location.hash = 'blanc'; }; g0.appendChild(t0); main.appendChild(g0);
  main.appendChild(el('h2', 'cat', 'S’entraîner exercice par exercice'));
  var g = el('div', 'grid');
  EX.forEach(function(x){
    var b = el('button', 'tile'); b.type = 'button'; b.appendChild(el('span', 'ic', x.ic));
    var s = el('span'); s.appendChild(el('b', null, x.n + ' · ' + x.t)); s.appendChild(el('span', 'd', x.d + (x.extra ? ' (non noté)' : ' (' + pts(x.max) + ' pt' + (x.max > 1 ? 's' : '') + ')')));
    var rec = store(KEY + x.id); if (rec) s.appendChild(el('span', 'rec', 'Dernier essai : ' + rec + '/' + pts(x.max)));
    b.appendChild(s); b.onclick = function(){ location.hash = x.id; }; g.appendChild(b);
  });
  main.appendChild(g);
}

function exPanel(x, inst){
  var p = el('section', 'panel'), h = el('div', 'ph');
  h.appendChild(el('h2', null, x.ic + ' ' + x.n + ' · ' + x.t)); var sc = el('span', 'pts', pts(x.max) + ' pt' + (x.max > 1 ? 's' : '')); h.appendChild(sc);
  p.appendChild(h);
  var c = {cours: 'Le jour J, tu rédiges toi-même (0,5 point par élément juste).', egal: 'Pour chaque triangle : l’hypoténuse (0,5 point) et l’égalité (1 point). Pour les carrés, utilise la touche ² (ou écris AB2).',
    hyp: 'Une ligne par étape, comme sur ta copie (0,5 point chacune) : angle droit et hypoténuse, théorème, égalité, remplacement, calcul du carré, valeur exacte, arrondi, unité.',
    cote: 'Une ligne par étape (0,5 point chacune) : angle droit et hypoténuse, égalité, soustraction, remplacement, calcul du carré, valeur exacte, arrondi, unité.',
    erreur: 'a) l’explication : 1 point ; b) le calcul du carré et la longueur : 0,5 point chacun.',
    pb: 'Question 1 : une ligne par étape (0,5 point chacune). Question 2 : le calcul (1 point) et la phrase réponse (0,5 point).',
    bonus: 'Ce point s’ajoute à la note (sans dépasser 20).', var: 'Ces questions ne sont pas comptées dans la note sur 20 : elles servent à vérifier que tu as compris, au-delà des exercices types.'}[x.id];
  if (c) p.appendChild(el('p', 'consigne', c));
  p.appendChild(inst.box); if (inst.note) p.appendChild(el('p', 'consigne', inst.note));
  return {p: p, sc: sc};
}

function train(id){
  var x = byId(id); if (!x){ menu(); return; }
  stat(PATH + id, 'Préparer l’évaluation 4e E01 · ' + x.t);
  tomenu.hidden = false; main.innerHTML = '';
  var inst = x.make(), P = exPanel(x, inst); main.appendChild(P.p);
  var row = el('div', 'row'), bv = el('button', 'btn main', 'Corriger'); bv.type = 'button'; row.appendChild(bv); P.p.appendChild(row);
  bv.onclick = function(){
    var got = inst.check(); bv.remove(); kbar.hidden = true;
    P.sc.textContent = pts(got) + ' / ' + pts(x.max); P.sc.className = 'pts ' + cls(got, x.max);
    store(KEY + id, pts(got));
    var r = el('div', 'res ' + cls(got, x.max), pts(got) + ' / ' + pts(x.max) + (eq(got, x.max) ? ' : parfait !' : ''));
    r.appendChild(el('small', null, eq(got, x.max) ? 'Tu es prêt(e) pour cet exercice. Essaie l’évaluation blanche !' : 'Lis la correction sous chaque question, puis recommence : les nombres changent à chaque fois.'));
    P.p.appendChild(r);
    var r2 = el('div', 'row'), b1 = el('button', 'btn main', '🔁 Recommencer (nouveaux nombres)'), b2 = el('button', 'btn', 'Menu');
    b1.onclick = function(){ train(id); window.scrollTo(0, 0); }; b2.onclick = function(){ location.hash = ''; };
    r2.appendChild(b1); r2.appendChild(b2); P.p.appendChild(r2);
  };
  window.scrollTo(0, 0);
}

function blanc(){
  stat(PATH + 'blanc', 'Préparer l’évaluation 4e E01 · évaluation blanche');
  tomenu.hidden = false; main.innerHTML = '';
  var essai = parseInt(store(KEY + 'essais') || '0', 10) + 1;
  var bar = el('div', 'timerbar'), tm = el('span', 'timer', 'Sujet n° ' + essai), bend = el('button', 'btn main', 'Rendre ma copie'); bend.type = 'button';
  bar.appendChild(tm); bar.appendChild(bend); main.appendChild(bar);
  main.appendChild(el('p', 'consigne', 'Calculatrice autorisée. Prends ton temps : il n’y a pas de limite. Rédige comme sur ta copie, une étape par ligne, puis touche « Rendre ma copie ». Les figures ne sont pas en vraie grandeur.'));
  var parts = EX.map(function(x){ var inst = x.make(), P = exPanel(x, inst); main.appendChild(P.p); return {x: x, inst: inst, P: P}; });
  if (/[?&]test\b/.test(location.search)) window.__parts = parts;   // tests automatiques (copie parfaite)
  var done = false, t0 = Date.now();
  bend.onclick = function(){ finish(); };
  function finish(){
    if (done) return; done = true; kbar.hidden = true;
    var total = 0, bonus = 0, res = [];
    parts.forEach(function(o){
      var got = o.inst.check(); o.P.sc.textContent = pts(got) + ' / ' + pts(o.x.max); o.P.sc.className = 'pts ' + cls(got, o.x.max);
      if (o.x.extra){} else if (o.x.id === 'bonus') bonus = got; else total += got; res.push({x: o.x, got: got});
    });
    var note = Math.round(Math.min(20, total + bonus) * 4) / 4;
    var best = parseFloat((store(KEY + 'best') || '0').replace(',', '.'));
    if (note > best) store(KEY + 'best', pts(note));
    store(KEY + 'essais', String(essai));
    var hist = (store(KEY + 'notes') || '').split(';').filter(Boolean).concat([pts(note)]).slice(-6); store(KEY + 'notes', hist.join(';'));
    bar.remove();
    var sum = el('section', 'panel');
    sum.appendChild(el('div', 'note', pts(note) + '/20'));
    var used = Math.max(1, Math.round((Date.now() - t0) / 60000));
    sum.appendChild(el('p', 'consigne', '⏱️ Tu as mis ' + used + ' min' + (used > 35 ? ' : le jour J, tu auras 35 min, entraîne-toi à aller un peu plus vite.' : ' : le jour J, tu auras 35 min, c’est bon !')));
    sum.lastChild.style.textAlign = 'center';
    sum.appendChild(el('p', 'consigne', 'Sujet n° ' + essai + '. ' + (note > best && essai > 1 ? '🏆 Ta meilleure note !' : best ? 'Ta meilleure note : ' + pts(Math.max(best, note)) + '/20.' : '') + (hist.length > 1 ? ' Tes dernières notes : ' + hist.join(' → ') + '.' : '')));
    sum.lastChild.style.textAlign = 'center';
    var again = el('div', 'row'), ba = el('button', 'btn main', '🔁 Recommencer avec un nouveau sujet'); ba.type = 'button'; ba.onclick = function(){ blanc(); }; again.appendChild(ba); sum.appendChild(again);
    var bl = el('div', 'bilan');
    res.forEach(function(r){
      var ln = el('div', 'bl'), left = el('span'); left.appendChild(el('b', null, r.x.n + ' · ' + r.x.t + ' : '));
      left.appendChild(el('span', 'pts ' + cls(r.got, r.x.max), pts(r.got) + '/' + pts(r.x.max) + (r.x.extra ? ' (non noté)' : '')));
      ln.appendChild(left);
      if (!eq(r.got, r.x.max) && r.x.id !== 'bonus' && !r.x.extra){ var b = el('button', 'btn', 'À retravailler →'); b.type = 'button'; b.onclick = function(){ location.hash = r.x.id; }; ln.appendChild(b); }
      bl.appendChild(ln);
    });
    sum.appendChild(bl);
    sum.appendChild(el('p', 'consigne', 'Sur ta vraie copie, rédige chaque étape avec des phrases, comme dans la correction. Les corrections détaillées sont sous chaque exercice.'));
    var r2 = el('div', 'row'), b2 = el('button', 'btn', 'Menu'); b2.onclick = function(){ location.hash = ''; }; r2.appendChild(b2); sum.appendChild(r2);
    main.insertBefore(sum, main.firstChild);
    var foot = el('section', 'panel'); foot.appendChild(el('p', 'consigne', 'Tu as lu toutes les corrections ? Entraîne-toi encore : un nouveau sujet est tiré à chaque fois, tu peux recommencer autant de fois que tu veux.'));
    var fr = el('div', 'row'), fb1 = el('button', 'btn main', '🔁 Recommencer avec un nouveau sujet'), fb2 = el('button', 'btn', 'Menu');
    fb1.onclick = function(){ blanc(); }; fb2.onclick = function(){ location.hash = ''; }; fr.appendChild(fb1); fr.appendChild(fb2); foot.appendChild(fr); main.appendChild(foot);
    window.scrollTo(0, 0);
    stat(PATH + 'blanc/note', 'Évaluation blanche 4e E01 rendue');
  }
  window.scrollTo(0, 0);
}

function route(){
  var id = location.hash.slice(1);
  if (id === 'blanc') blanc(); else if (id) train(id); else menu();
}
tomenu.onclick = function(){ location.hash = ''; };
window.addEventListener('hashchange', route);
route();
})();
</script>
<script>
// « ← Retour » : revient à l'onglet Évaluations de la page de la classe
(function(){ var a = document.getElementById('home'); if (!a) return;
  a.textContent = '← Retour';
  var u = ''; try { u = localStorage.getItem('mp:retour') || ''; } catch(e){}
  if (u.indexOf(location.origin) !== 0) u = '../';
  var i = u.indexOf('#'), base = (i < 0 ? u : u.slice(0, i)).split('?')[0], hash = i < 0 ? '' : u.slice(i);
  a.href = base + '?vue=evals' + hash;
})();
</script>
