     case 5: q = 'Une roue a 4 secteurs égaux dont 1 gagnant. On la fait tourner deux fois. Probabilité de gagner au moins une fois ?'; n = 7; d = 16; st = ['Contraire : perdre deux fois, 3/4 × 3/4 = 9/16.', '1 ' + MINUS + ' 9/16 = 7/16.']; break;
     case 6: q = 'Dans un sac : 3 bonbons à la fraise et 2 au citron. Tom en prend deux, l’un après l’autre, sans remise. Probabilité qu’il ait deux bonbons à la fraise ?'; n = 6; d = 20; st = ['3/5 × 2/4 = 6/20.']; break;
     case 7: q = 'On lance une pièce trois fois. Probabilité d’obtenir exactement deux Pile ?'; n = 3; d = 8; st = ['PPF, PFP, FPP : 3 issues sur 8.']; break;
     case 8: q = 'On tire au hasard une carte parmi 4 cartes (1, 2, 3, 4), sans remise, puis une seconde, pour former un nombre à deux chiffres. Probabilité que ce nombre soit pair ?'; n = 6; d = 12; st = ['4 × 3 = 12 nombres ; le chiffre des unités doit être 2 ou 4 : 6 nombres.']; break;
     case 9: q = 'Deux amis choisissent chacun au hasard un jour de la semaine (7 jours). Probabilité qu’ils choisissent le même jour ?'; n = 7; d = 49; st = ['7 × 7 = 49 couples, dont 7 avec le même jour.']; break;
     case 10: q = 'On lance deux dés. Probabilité que les deux nombres soient pairs ?'; n = 9; d = 36; st = ['3/6 × 3/6 = 9/36.']; break;
     default: q = 'Une urne contient 2 boules blanches et 2 noires. On tire deux boules sans remise. Probabilité qu’elles soient de couleurs différentes ?'; n = 8; d = 12; st = ['B puis N : 2/4 × 2/3 = 4/12 ; N puis B : 4/12.', 'Total : 8/12.'];
    }
    st.push('P = ' + P(n, d) + '.');
    return {type: 'frac', dec: true, q: q, f: red(n, d), steps: st, key: 'k' + k}; }}
);
