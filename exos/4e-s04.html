(function(){

      st = ['Même unité d’abord : ' + hc + ' cm = ' + fn(hm) + ' m. La hauteur est verticale, le sol horizontal : la rampe est l’hypoténuse.', 'L' + SQ + ' = ' + fn(A) + SQ + ' + ' + fn(hm) + SQ + ' = ' + fn(sq(A)) + ' + ' + fn(sq(hm)) + ' = ' + fn(sq(A) + sq(hm))];

    return numQ({q: q, lab: ask + (d === undefined ? ' =' : ' ≈'), unit: u, v: v, x: x, d: d, traps: traps, steps: st, key: 'k' + k}); }}
];
