 {id: 'n48f', lv: 2, n: 'N48', t: 'Convertir avec les puissances de 10', d: 'Préfixes, aires et volumes.', c: 'Convertis et donne le résultat en notation scientifique.', a: 'Je remplace le préfixe par sa puissance de 10 (T = 10¹², G = 10⁹, M = 10⁶, k = 10³, m = 10⁻³, µ = 10⁻⁶, n = 10⁻⁹). Pour une aire, 1 km² = 10⁶ m² ; pour un volume, 1 m³ = 10⁶ cm³ (trois dimensions).',

     ['km²', 'm²', 6], ['m²', 'cm²', 4], ['m³', 'cm³', 6], ['dm³', 'm³', -3], ['cm³', 'm³', -6], ['ha', 'm²', 4]], u = pick(T);
    var a = pick([2, 3, 4, 5, 6, 7, 8, 9, 12, 15, 25, 36, 45, 60, 1.8, 2.5, 7.5, 0.5, 0.36]), R = norm(a, u[2]);

       if (u[0] === 'km²' && vs[1] === R[1] - 3 || u[0] === 'm³' && vs[1] === R[1] - 4 || u[0] === 'm²' && vs[1] === R[1] - 2) return 'Attention : ' + u[0] + ' n’est pas une unité de longueur, la conversion compte plusieurs dimensions.';

 {id: 'n48g', lv: 2, n: 'N48', t: 'Ordre de grandeur', d: 'Estimer avant de calculer.', c: 'Sans calculatrice, choisis l’ordre de grandeur du résultat.', a: 'J’arrondis chaque nombre à un seul chiffre (a × 10ⁿ avec a entier), je calcule de tête les nombres et les puissances de 10, puis je choisis la puissance de 10 la plus proche.',
  g: function(){ var m1 = cl(rnd(11, 98) / 10), e1 = rnz(-6, 8), m2 = cl(rnd(11, 98) / 10), e2 = rnz(-6, 8), op = Math.random() < 0.6 ? '×' : '÷';

 {id: 'n48c', lv: 3, n: 'N48', nq: 3, t: 'Problèmes', d: 'Astronomie, biologie, informatique…', c: 'Lis l’énoncé et calcule. Donne le résultat en notation scientifique (arrondi au centième si nécessaire).', a: 'Écris les données en notation scientifique, puis calcule : on multiplie (ou divise) les nombres décimaux entre eux et les puissances de 10 entre elles (10ᵃ × 10ᵇ = 10ᵃ⁺ᵇ, 10ᵃ ÷ 10ᵇ = 10ᵃ⁻ᵇ).',

     case 4: var c = rnd(2, 6); x = c * 3.7e13; q = 'Le corps humain compte environ 3,7 × 10¹³ cellules. Combien de cellules au total pour ' + c + ' personnes ?'; st = [c + ' × 3,7 × 10¹³ = ' + fr(cl(c * 3.7)) + ' × 10¹³.']; break;

    }
