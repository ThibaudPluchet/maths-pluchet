<script>
(function(){
'use strict';
var rnd = M.rnd, rnz = M.rnz, pick = M.pick, shuffle = M.shuffle, fr = M.fr, pf = M.pf, cl = M.cl, sq = M.sq, SQ = M.SQ, MINUS = M.MINUS, rd = M.rd;
function same(a, b){ return a[0] === b[0] && a[1] === b[1]; }
function inG(p){ return Math.abs(p[0]) <= 5 && Math.abs(p[1]) <= 5; }
// quadrillage de −5 à 5, points nommés et polygones
function grid(pts, polys){
  var u = 26, W = 11 * u + 20, o = 10 + 5.5 * u, s = '<svg viewBox="0 0 ' + W + ' ' + W + '" class="fig" role="img" aria-label="Figure sur quadrillage">', v;
  function X(x){ return o + x * u; } function Y(y){ return o - y * u; }
  for (v = -5; v <= 5; v++){ s += '<line class="gr" x1="' + X(v) + '" y1="' + Y(-5.4) + '" x2="' + X(v) + '" y2="' + Y(5.4) + '"/><line class="gr" x1="' + X(-5.4) + '" y1="' + Y(v) + '" x2="' + X(5.4) + '" y2="' + Y(v) + '"/>'; }
  (polys || []).forEach(function(P){ s += '<polygon points="' + P.p.map(function(q){ return X(q[0]) + ',' + Y(q[1]); }).join(' ') + '" style="fill:' + (P.fill || 'var(--soft)') + ';stroke:' + (P.stroke || 'var(--ink)') + ';stroke-width:2;fill-opacity:.7"/>';
    if (P.t){ var cx = P.p.reduce(function(a, q){ return a + q[0]; }, 0) / P.p.length, cy = P.p.reduce(function(a, q){ return a + q[1]; }, 0) / P.p.length; s += '<text x="' + X(cx) + '" y="' + Y(cy) + '" text-anchor="middle" dominant-baseline="central" style="font-size:14px">' + P.t + '</text>'; } });
  pts.forEach(function(p){ s += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="' + (p[3] ? 5 : 4) + '" style="fill:' + (p[3] ? 'var(--ink)' : 'var(--accent)') + '"/><text x="' + (X(p[0]) + 8) + '" y="' + (Y(p[1]) - 9) + '" style="font-size:15px">' + p[2] + '</text>'; });
  return s + '</svg>';
}
function H(p, o, k){ return [cl(o[0] + k * (p[0] - o[0])), cl(o[1] + k * (p[1] - o[1]))]; }
function inH(p){ return Math.abs(p[0]) <= 5 && Math.abs(p[1]) <= 5 && M.isInt(p[0] * 2) && M.isInt(p[1] * 2); }
function onG(p){ return inH(p) && M.isInt(p[0]) && M.isInt(p[1]); }
function kt(k){ return fr(k); }
function htxt(k){ return 'l’homothétie de centre O et de rapport ' + kt(k); }
function co(p){ return '(' + fr(p[0]) + ' ; ' + fr(p[1]) + ')'; }
var EX = [
 {id: 'n30a', lv: 1, n: 'N30', t: 'Agrandissement ou réduction ?', d: 'Le rôle de k.', c: 'Choisis la bonne réponse.', a: 'Si |k| > 1 (k plus grand que 1 ou plus petit que −1), c’est un agrandissement ; si 0 < |k| < 1, une réduction. Si k < 0, l’image est de l’autre côté du centre. k = −1 : symétrie centrale.',
  g: function(){ var k = pick([2, 3, 1.5, 4, 0.5, 0.25, 0.75, -2, -3, -0.5, -1.5, -0.25, -1]), t = rnd(0, 1), q, ch, ans, st;
    if (t === 0){ q = 'Une homothétie de rapport ' + kt(k) + ' est…'; ch = ['un agrandissement', 'une réduction', 'ni l’un ni l’autre']; ans = Math.abs(k) > 1 ? 0 : Math.abs(k) < 1 ? 1 : 2; st = ['|k| = ' + fr(Math.abs(k)) + (ans === 0 ? ' > 1 : agrandissement.' : ans === 1 ? ' < 1 : réduction.' : ' : les longueurs sont conservées (k = −1 : symétrie centrale).')]; }
    else { q = 'Par une homothétie de centre O et de rapport ' + kt(k) + ', le point A et son image A′ sont…'; ch = ['du même côté de O', 'de part et d’autre de O']; ans = k > 0 ? 0 : 1; st = [k > 0 ? 'k > 0 : A′ est sur la demi-droite [OA).' : 'k < 0 : A′ est de l’autre côté de O, sur la droite (OA).']; }
    return {type: 'ch', q: q, ch: ch, ans: ans, steps: st, key: k + '/' + t}; }},
 {id: 'n30b', lv: 2, n: 'N30', t: 'Lire le rapport sur un quadrillage', d: 'Comparer OA′ et OA.', c: 'A′ est l’image de A par une homothétie de centre O. Quel est son rapport k ?', a: 'Compte le déplacement de O vers A, puis de O vers A′ : k est le nombre par lequel on multiplie. Si A′ est de l’autre côté de O, k est négatif.',
  g: function(){ var k = pick([2, 3, 0.5, -1, -2, -0.5, 1.5, -1.5, 4, -3]), O = [rnd(-1, 1), rnd(-1, 1)], A, B, n = 0;
    do { A = [O[0] + rnz(-4, 4), O[1] + rnz(-4, 4)]; B = H(A, O, k); } while (!(onG(A) && onG(B)) && ++n < 200); if (n >= 200) return this.g();
    var d = [A[0] - O[0], A[1] - O[1]], d2 = [B[0] - O[0], B[1] - O[1]];
    return {type: 'num', q: 'Quel est le rapport de l’homothétie qui transforme A en A′ ?', svg: grid([[A[0], A[1], 'A'], [B[0], B[1], 'A′'], [O[0], O[1], 'O', 1]]), lab: 'k =', v: k, steps: ['De O à A : ' + fr(d[0]) + ' horizontalement, ' + fr(d[1]) + ' verticalement. De O à A′ : ' + fr(d2[0]) + ' et ' + fr(d2[1]) + '.', 'Les déplacements sont multipliés par ' + kt(k) + (k < 0 ? ' (A′ est de l’autre côté de O)' : '') + ' : k = ' + kt(k) + '.'], traps: [[-k, 'Regarde de quel côté de O se trouve A′ : le signe de k en dépend.'], [cl(1 / k), 'k = OA′ / OA, et non OA / OA′.']], key: A.join() + O.join() + k}; }},
 {id: 'n30c', lv: 2, n: 'N30', t: 'Longueurs et aires de l’image', d: 'Multiplier par |k| ou k².', c: 'Calcule.', a: 'Une homothétie de rapport k multiplie les longueurs par |k| (la valeur sans le signe) et les aires par k².',
  g: function(){ var k = pick([2, 3, 0.5, -2, -3, -0.5, 1.5, -1.5, 2.5]), w = Math.random() < 0.4, L = rnd(2, 20), u = 'cm', v = w ? cl(L * k * k) : cl(L * Math.abs(k));
    return {type: 'num', q: (w ? 'Une figure a une aire de ' + L + ' cm². ' : 'Un segment mesure ' + L + ' cm. ') + 'On lui applique une homothétie de rapport ' + kt(k) + '. ' + (w ? 'Aire de l’image ?' : 'Longueur de l’image ?'), v: v, unit: w ? 'cm²' : 'cm', steps: [w ? 'Les aires sont multipliées par k² = ' + fr(cl(k * k)) + ' : ' + L + ' × ' + fr(cl(k * k)) + ' = ' + fr(v) + ' cm².' : 'Les longueurs sont multipliées par |k| = ' + fr(Math.abs(k)) + ' : ' + L + ' × ' + fr(Math.abs(k)) + ' = ' + fr(v) + ' cm.'], traps: [[cl(L * k), 'Une longueur est toujours positive : on multiplie par |k|.'], [cl(L * Math.abs(k)), 'Pour une aire, on multiplie par k².']].filter(function(t){ return Math.abs(t[0] - v) > 1e-9; })}; }},
 {id: 'n30d', lv: 2, n: 'N30', t: 'Retrouver le rapport', d: 'À partir des mesures.', c: 'Donne le rapport k de l’homothétie de centre O.', a: 'k = OA′ ÷ OA (ou longueur de l’image ÷ longueur de départ), avec un signe − si A et A′ sont de part et d’autre de O.',
  g: function(){ var k = pick([2, 3, 0.5, -2, -3, -0.5, 1.5, -1.5, 2.5, 0.4, -4]), L = rnd(2, 15), t = rnd(0, 1), q;
    if (t === 0) q = 'OA = ' + L + ' cm et OA′ = ' + fr(cl(L * Math.abs(k))) + ' cm. A′ est ' + (k > 0 ? 'sur la demi-droite [OA)' : 'sur la droite (OA), de l’autre côté de O') + '.';
    else q = 'Un triangle de périmètre ' + L + ' cm a pour image un triangle de périmètre ' + fr(cl(L * Math.abs(k))) + ' cm ; l’image est ' + (k > 0 ? 'du même côté de O que la figure' : 'de l’autre côté de O (elle est « retournée »)') + '.';
    return {type: 'num', q: q, lab: 'k =', v: k, steps: [fr(cl(L * Math.abs(k))) + ' ÷ ' + L + ' = ' + fr(Math.abs(k)) + (k < 0 ? ' et l’image est de l’autre côté de O : k = ' + kt(k) + '.' : ', même côté : k = ' + kt(k) + '.')], traps: [[-k, 'Attention au signe : regarde de quel côté de O est l’image.'], [cl(1 / k), 'k = image ÷ départ.']], key: q}; }},
 {id: 'n30e', lv: 3, n: 'N30', nq: 3, t: 'Problèmes', d: 'Projecteurs, photos, ombres…', c: 'Lis l’énoncé et réponds.', a: 'Repère le centre de l’homothétie (la lampe, l’objectif…), puis calcule k = distance de l’image ÷ distance de l’objet (négatif si l’image est inversée de l’autre côté du centre).',
  g: function(k){ if (k === undefined) k = rnd(0, 11); var a = rnd(2, 6) * 10, K = pick([2, 3, 4, 5]), w = rnd(2, 9), q, v, u, st;
    switch (k % 6){
     case 0: q = 'Une lampe éclaire une figurine de ' + w + ' cm placée à ' + a + ' cm d’elle ; son ombre se forme sur un mur, parallèle, à ' + a * K + ' cm de la lampe. Hauteur de l’ombre ?'; v = w * K; u = 'cm'; st = ['Homothétie de centre la lampe, de rapport ' + a * K + ' ÷ ' + a + ' = ' + K + '.', w + ' × ' + K + ' = ' + v + ' cm.']; break;
     case 1: q = 'Sur une figure, A′ est l’image de A par une homothétie de centre O. OA = ' + w + ' cm, OA′ = ' + w * K + ' cm, et O est entre A et A′. Quel est le rapport ?'; v = -K; u = ''; st = [w * K + ' ÷ ' + w + ' = ' + K + ' ; O est entre A et A′ (image de l’autre côté) : k = ' + fr(-K) + '.']; break;
     case 2: q = 'Un rétroprojecteur transforme un dessin de ' + w + ' cm de large en une image de ' + w * K * 10 + ' cm, de même sens. Quel est le rapport ?'; v = K * 10; u = ''; st = [w * K * 10 + ' ÷ ' + w + ' = ' + v + ', image dans le même sens : k = ' + v + '.']; break;
     case 3: q = 'Par une homothétie de rapport ' + (K === 2 ? '−2' : String(K)) + ', un carré de ' + w + ' cm de côté a pour image un carré. Quelle est l’aire de l’image ?'; v = w * w * K * K; u = 'cm²'; st = ['Les aires sont multipliées par k² = ' + K * K + ' : ' + w * w + ' × ' + K * K + ' = ' + v + ' cm².']; break;
     case 4: q = 'Une photo de ' + (w + 5) + ' cm sur ' + (w + 10) + ' cm est réduite par une homothétie de rapport 0,5. Dimensions de l’image : quelle est sa longueur (le plus grand côté) ?'; v = cl((w + 10) / 2); u = 'cm'; st = [(w + 10) + ' × 0,5 = ' + fr(v) + ' cm.']; break;
     default: q = 'Le triangle A′B′C′ est l’image de ABC par une homothétie de centre O, avec OA = ' + w + ' cm et OA′ = ' + w * K + ' cm (même côté). Si BC = ' + a / 10 + ' cm, combien mesure B′C′ ?'; v = a / 10 * K; u = 'cm'; st = ['k = ' + w * K + ' ÷ ' + w + ' = ' + K + '.', 'B′C′ = ' + a / 10 + ' × ' + K + ' = ' + v + ' cm.'];
    }
    return {type: 'num', q: q, v: v, unit: u, steps: st, key: 'k' + k + q}; }}
];
EX.push(
 {id: 'n31a', lv: 1, n: 'N31', t: 'Image d’un point', d: 'Sur un quadrillage.', c: 'Choisis l’image du point A.', a: 'A′ est sur la droite (OA), avec OA′ = |k| × OA ; du même côté que A si k > 0, de l’autre côté si k < 0. Sur un quadrillage, on multiplie le déplacement de O vers A par k.',
  g: function(){ var k = pick([2, 3, -1, -2, 0.5, -0.5, 1.5]), O = [rnd(-1, 1), rnd(-1, 1)], A, B, n = 0;
    do { A = [O[0] + rnz(-3, 3), O[1] + rnz(-3, 3)]; B = H(A, O, k); } while (!(onG(A) && onG(B)) && ++n < 200); if (n >= 200) return this.g();
    var cands = [B, H(A, O, -k), H(A, O, 1 / k), H(A, O, k > 0 ? k + 1 : k - 1)].filter(function(p, i, arr){ return onG(p) && !same(p, A) && !same(p, O) && arr.findIndex(function(q){ return same(p, q); }) === i; });
    if (cands.length < 3) return this.g();
    var names = shuffle(['B', 'C', 'D', 'E'].slice(0, cands.length)), good = names[0], ch = names.slice().sort();
    return {type: 'ch', q: 'Quelle est l’image de A par ' + htxt(k) + ' ?', svg: grid(cands.map(function(p, i){ return [p[0], p[1], names[i]]; }).concat([[A[0], A[1], 'A'], [O[0], O[1], 'O', 1]])), ch: ch, ans: ch.indexOf(good), steps: ['De O à A : ' + fr(A[0] - O[0]) + ' horizontalement et ' + fr(A[1] - O[1]) + ' verticalement. On multiplie ces déplacements par ' + kt(k) + ' : on arrive en ' + good + '.'], key: A.join() + O.join() + k}; }},
 {id: 'n31b', lv: 2, n: 'N31', t: 'Image d’une figure', d: 'Retrouver la bonne image.', c: 'Quelle figure est l’image de la figure colorée par l’homothétie ?', a: 'Construis l’image de chaque sommet : multiplie par k le déplacement de O vers le sommet. Avec k < 0, la figure est « retournée » de l’autre côté de O.',
  g: function(){ var k = pick([2, -1, -2, 0.5, -0.5]), O = [0, 0], P, n = 0, im;
    do { var x = rnz(-2, 2) * (Math.abs(k) < 1 ? 2 : 1), y = rnz(-2, 2) * (Math.abs(k) < 1 ? 2 : 1); if (Math.abs(k) >= 2 && Math.abs(x) + Math.abs(y) < 2){ x = 99; y = 99; } P = [[x, y], [x + (Math.abs(k) < 1 ? 2 : 1), y], [x, y + (Math.abs(k) < 1 ? 4 : 2)]]; im = P.map(function(p){ return H(p, O, k); }); } while (!(P.concat(im).every(onG)) && ++n < 300);
    if (n >= 300) return this.g();
    var key = function(Q){ return Q.map(function(p){ return p.join(','); }).sort().join('|'); }, seen = [key(P)], W = [];
    [im, P.map(function(p){ return H(p, O, -k); }), P.map(function(p){ return H(p, O, Math.abs(k) >= 1 ? k / 2 : 2 * k); }), im.map(function(p){ return [-p[0], p[1]]; }), im.map(function(p){ return [p[0], -p[1]]; })].forEach(function(Q){ var kk = key(Q); if (W.length < 3 && Q.every(inH) && seen.indexOf(kk) < 0){ seen.push(kk); W.push(Q); } });
    if (W.length < 3) return this.g();
    var names = ['①', '②', '③'], ord = shuffle([0, 1, 2]), cols = ['#c2410c', '#1d8a5a', '#8a3ab9'];
    var polys = [{p: P, fill: 'var(--accent)'}].concat(ord.map(function(j, i){ return {p: W[j], fill: 'none', stroke: cols[i], t: names[i]}; }));
    return {type: 'ch', q: 'O est le centre du quadrillage. Homothétie de rapport ' + kt(k) + '.', svg: grid([[0, 0, 'O', 1]], polys), ch: names, ans: ord.indexOf(0), steps: ['L’image de chaque sommet est obtenue en multipliant ses coordonnées par ' + kt(k) + ' : c’est la figure ' + names[ord.indexOf(0)] + '.'], key: JSON.stringify(P) + k}; }},
 {id: 'n31c', lv: 2, n: 'N31', t: 'Avec des coordonnées', d: 'Centre à l’origine.', c: 'Donne les coordonnées de l’image.', a: 'Pour une homothétie de centre l’origine O et de rapport k, l’image de A(x ; y) est A′(kx ; ky).',
  g: function(){ var k = pick([2, 3, -1, -2, 0.5, -0.5, -3, 1.5]), A = [rnz(-6, 6), rnz(-6, 6)], B = H(A, [0, 0], k);
    var wrong = [[-B[0], -B[1]], [A[0] + k, A[1] + k], [B[0], -B[1]]], ch = shuffle([co(B)].concat(wrong.map(co)).filter(function(c, i, a){ return a.indexOf(c) === i; }));
    if (ch.length < 3) return this.g();
    return {type: 'ch', q: 'A' + co(A) + '. Image de A par ' + htxt(k) + ' (O origine du repère) ?', ch: ch, ans: ch.indexOf(co(B)), steps: ['A′(' + kt(k) + ' × ' + M.pf(A[0]) + ' ; ' + kt(k) + ' × ' + M.pf(A[1]) + ') = A′' + co(B) + '.'], key: A.join() + k}; }},
 {id: 'n31d', lv: 2, n: 'N31', nq: 4, t: 'Vrai ou faux ?', d: 'Propriétés de l’homothétie.', c: 'L’affirmation est-elle vraie ?', a: 'Une homothétie conserve les angles, l’alignement et le parallélisme ; elle multiplie les longueurs par |k| et les aires par k². Le centre est sa propre image.',
  g: function(k){ if (k === undefined) k = rnd(0, 11); var D = [
    ['Une homothétie conserve les mesures des angles.', 0, 'Oui : l’image a la même forme, les angles sont conservés.'],
    ['Une homothétie de rapport 3 multiplie les aires par 3.', 1, 'Les aires sont multipliées par 3² = 9.'],
    ['Une homothétie de rapport −2 multiplie les longueurs par 2.', 0, 'Les longueurs sont multipliées par |−2| = 2.'],
    ['L’homothétie de rapport −1 est la symétrie de centre O.', 0, 'A′ est de l’autre côté de O avec OA′ = OA : c’est la symétrie centrale.'],
    ['Le centre d’une homothétie est sa propre image.', 0, 'OO′ = k × 0 = 0 : O′ = O.'],
    ['Par une homothétie, l’image d’une droite est une droite parallèle (ou la même).', 0, 'Le parallélisme est conservé.'],
    ['Une homothétie de rapport 0,5 est un agrandissement.', 1, '0,5 < 1 : c’est une réduction.'],
    ['Si A′ est l’image de A, alors O, A et A′ sont alignés.', 0, 'A′ est toujours sur la droite (OA).'],
    ['Une homothétie de rapport −3 est une réduction.', 1, '|−3| = 3 > 1 : c’est un agrandissement.'],
    ['L’image d’un carré par une homothétie est un carré.', 0, 'Les angles et les rapports de longueurs sont conservés.'],
    ['Une homothétie de rapport 2 double le volume d’un solide.', 1, 'Les volumes sont multipliés par 2³ = 8.'],
    ['Une homothétie de rapport 1 laisse toutes les figures à leur place.', 0, 'Chaque point est sa propre image.']][k];
    return {type: 'ch', q: D[0], ch: ['Vrai', 'Faux'], ans: D[1], steps: [D[2]], key: 'k' + k}; }}
);
var NOTIONS = [
 {n: 'N30', t: 'Déterminer un rapport d’homothétie', r: 'k = OA′ ÷ OA, positif si A′ est du même côté que A, négatif sinon ; les longueurs sont multipliées par |k|, les aires par k².'},
 {n: 'N31', t: 'Construire l’image d’une figure par homothétie', r: 'A′ est sur (OA) avec OA′ = |k| × OA, du même côté si k > 0, de l’autre côté si k < 0.'}
];

M.start({key: '3e-s18', EX: EX, NOTIONS: NOTIONS});
})();
</script>
