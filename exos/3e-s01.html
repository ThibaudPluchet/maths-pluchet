<script>
(function(){
'use strict';
var main = document.getElementById('main'), tomenu = document.getElementById('tomenu'), kbar = document.getElementById('kbar');
var MINUS = '−', N = 5;

/* ---------- outils ---------- */
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function rnz(a, b){ var v; do { v = rnd(a, b); } while (v === 0); return v; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function n(v){ return (v < 0 ? MINUS : '') + Math.abs(v); }                 // −4 ; 9
function pn(v){ return v < 0 ? '(' + n(v) + ')' : n(v); }                    // (−4) ; 9
// monôme : coef c, degré d (0, 1 ou 2)
function mono(c, d){ var x = d === 0 ? '' : d === 1 ? 'x' : 'x²', a = Math.abs(c);
  return (c < 0 ? MINUS : '') + (d > 0 && a === 1 ? '' : a) + x; }
// polynôme {2: a, 1: b, 0: c} écrit réduit et ordonné
function poly(P){ var s = '', first = true;
  [2, 1, 0].forEach(function(d){ var c = P[d] || 0; if (!c) return;
    var m = mono(Math.abs(c), d); s += first ? (c < 0 ? MINUS : '') + m : (c < 0 ? ' ' + MINUS + ' ' : ' + ') + m; first = false; });
  return first ? '0' : s; }
// somme de termes [[c, d], …] écrite telle quelle (non réduite)
function terms(T){ return T.map(function(t, i){ var c = t[0], m = mono(Math.abs(c), t[1]);
  return i === 0 ? (c < 0 ? MINUS : '') + m : (c < 0 ? ' ' + MINUS + ' ' : ' + ') + m; }).join(''); }
function add(P, c, d){ P[d] = (P[d] || 0) + c; return P; }
function sumT(T){ var P = {}; T.forEach(function(t){ add(P, t[0], t[1]); }); return P; }
function sameP(A, B){ return [0, 1, 2, 3, 4].every(function(d){ return (A[d] || 0) === (B[d] || 0); }); }

/* ---------- lecture d'une réponse : somme de monômes ----------
   Renvoie {P, reduit, paren, fois} ou null si illisible. */
function parse(s){
  s = String(s || '').replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/,/g, '.').replace(/[×·*]/g, '*')
       .replace(/X/g, 'x').replace(/²/g, '^2').replace(/x2(?![\d.])/g, 'x^2');
  if (!s) return null;
  var paren = /[()]/.test(s); if (paren) return {paren: true};
  var fois = /\*/.test(s), P = {}, seen = {}, reduit = true, i = 0;
  var re = /([+-]?)([^+-]+)/g, m, pos = 0;
  while ((m = re.exec(s))){
    if (m.index !== pos) return null; pos = re.lastIndex;
    if (!m[1] && m.index > 0) return null;
    var t = m[2], tok = /(\d+(?:\.\d+)?)|(x)(?:\^(\d))?|(\*)/g, k, c = 1, d = 0, nNum = 0, nX = 0, p2 = 0;
    while ((k = tok.exec(t))){
      if (k.index !== p2) return null; p2 = tok.lastIndex;
      if (k[1]) { c *= parseFloat(k[1]); nNum++; }
      else if (k[2]) { d += k[3] ? parseInt(k[3], 10) : 1; nX++; }
    }
    if (p2 !== t.length || (!nNum && !nX)) return null;
    if (nNum > 1 || nX > 1) reduit = false;
    if (m[1] === '-') c = -c;
    if (seen[d]) reduit = false; seen[d] = 1;
    if (c === 0) reduit = false;
    add(P, c, d); i++;
  }
  if (pos !== s.length) return null;
  return {P: P, reduit: reduit && !fois, fois: fois};
}
function parseNum(s){ s = String(s || '').replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/,/g, '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null; }

// développement d'un facteur k·x^kd par (a x + b) : x parfois en 2e position, facteur parfois derrière la parenthèse
function dev(k, kd, ab){
  var inner = pick([true, false]) ? [[ab[0], 1], [ab[1], 0]] : [[ab[1], 0], [ab[0], 1]];
  var after = Math.random() < 0.4, F = mono(k, kd), Fp = k < 0 ? '(' + F + ')' : F;
  var tp = function(t){ var m = mono(t[0], t[1]); return t[0] < 0 ? '(' + m + ')' : m; };
  var q = after ? '(' + terms(inner) + ') × ' + Fp : (kd === 0 && k === -1 ? MINUS : F) + '(' + terms(inner) + ')';
  var T = inner.map(function(t){ return [k * t[0], t[1] + kd]; });
  var s1 = inner.map(function(t){ return after ? tp(t) + ' × ' + Fp : Fp + ' × ' + tp(t); }).join(' + ');
  return {q: q, P: sumT(T), key: q, steps: [s1, terms(T)]};
}
// facteur k (nombre) × parenthèse de 3 ou 4 termes dans le désordre ; avec 4 termes, il faut réduire à la fin
function devN(){
  var k = rnz(-9, 9); if (k === 1) k = -1; if (k === -1 && Math.random() < 0.7) k = pick([-2, -3, 2, 3]);
  var inner = [[rnz(-6, 6), 2], [rnz(-9, 9), 1], [rnz(-9, 9), 0]];
  if (Math.random() < 0.5) inner.push(pick([[rnz(-9, 9), 1], [rnz(-9, 9), 0]]));
  for (var i = inner.length - 1; i > 0; i--){ var j = rnd(0, i), t = inner[i]; inner[i] = inner[j]; inner[j] = t; }
  var after = Math.random() < 0.35, F = mono(k, 0), Fp = k < 0 ? '(' + F + ')' : F;
  var tp = function(t){ var m = mono(t[0], t[1]); return t[0] < 0 ? '(' + m + ')' : m; };
  var q = after ? '(' + terms(inner) + ') × ' + Fp : (k === -1 ? MINUS : F) + '(' + terms(inner) + ')';
  var T = inner.map(function(t){ return [k * t[0], t[1]]; }), P = sumT(T);
  var steps = [inner.map(function(t){ return after ? tp(t) + ' × ' + Fp : Fp + ' × ' + tp(t); }).join(' + '), terms(T)];
  if (inner.length > 3) steps.push(poly(P));
  return {q: q, P: P, key: q, steps: steps};
}
// somme de n termes (n entre a et b) de degrés pris dans D, dans le désordre, avec au moins un regroupement à faire
function sumGen(a, b, D, need){
  var n = rnd(a, b), T = [], i;
  for (i = 0; i < n; i++) T.push([rnz(-9, 9), i < D.length ? D[i] : pick(D)]);
  for (i = T.length - 1; i > 0; i--){ var j = rnd(0, i), t = T[i]; T[i] = T[j]; T[j] = t; }
  if (T[0][0] < 0 && Math.random() < 0.6) T[0][0] = -T[0][0];
  var P = sumT(T), cnt = {}; T.forEach(function(t){ cnt[t[1]] = (cnt[t[1]] || 0) + 1; });
  if (!P[need] || !D.some(function(d){ return cnt[d] > 1; })) return sumGen(a, b, D, need);
  var G = []; [2, 1, 0].forEach(function(d){ T.forEach(function(t){ if (t[1] === d) G.push(t); }); });
  var st = [terms(G), poly(P)]; if (st[0] === st[1]) st = [st[1]];
  return {q: terms(T), P: P, key: terms(T), steps: st};
}
// produit de 2 ou 3 facteurs (nombres ou termes en x), degré total au plus 2
function prodGen(){
  var n = pick([2, 2, 3]), F = [], deg = 0, i;
  for (i = 0; i < n; i++){ var d = deg < 2 && Math.random() < 0.55 ? 1 : 0, c = rnz(-9, 9);
    if (n === 3 && Math.abs(c) > 6) c = c > 0 ? rnd(2, 6) : -rnd(2, 6);
    if (d === 0 && Math.abs(c) === 1) c = c > 0 ? rnd(2, 9) : -rnd(2, 9);
    F.push([c, d]); deg += d; }
  if (!deg) { F[rnd(0, n - 1)][1] = 1; deg = 1; }
  var fx = function(t, k){ var m = mono(t[0], t[1]); return k > 0 && t[0] < 0 ? '(' + m + ')' : m; };
  var C = F.reduce(function(p, t){ return p * t[0]; }, 1);
  var s1 = F.map(function(t){ return pn(t[0]); }).join(' × ') + ' × ' + (deg === 2 ? 'x × x' : 'x');
  return {q: F.map(fx).join(' × '), P: sumT([[C, deg]]), key: F.map(fx).join(' × '), steps: [s1, mono(C, deg)]};
}
// expressions avec parenthèses de formats variés : termes isolés et groupes K(…) placés dans le désordre
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = rnd(0, i), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function grp(sq){ var D = sq && Math.random() < 0.3 ? [2, 1, 0] : [1, 0], n = rnd(2, D.length === 3 ? 3 : 2);
  if (D.length === 2 && Math.random() < 0.25) n = 3;
  var T = shuffle(D.slice()).slice(0, Math.min(n, D.length)).map(function(d){ return [rnz(-9, 9), d]; });
  if (T.length < n) T.push([rnz(-9, 9), 1]);
  return shuffle(T); }
function parenGen(mode){
  var B = [], i, nl;
  if (mode === 'plus'){ var ng = pick([1, 1, 2]); for (i = 0; i < ng; i++) B.push({K: 1, T: grp(true)}); nl = rnd(ng > 1 ? 0 : 1, 2); }
  else if (mode === 'moins'){ B.push({K: -1, T: grp(true)}); if (Math.random() < 0.4) B.push({K: pick([1, -1]), T: grp(false)}); nl = rnd(B.length > 1 ? 0 : 1, 2); }
  else { B.push({K: pick([1, -1]) * rnd(2, 7), T: grp(false)});
    var r = Math.random(); if (r < 0.45) B.push({K: pick([1, -1]) * rnd(2, 6), T: grp(false)}); else if (r < 0.8) B.push({K: pick([1, -1]), T: grp(false)});
    nl = rnd(B.length > 1 ? 0 : 1, 1); }
  for (i = 0; i < nl; i++) B.push({t: [rnz(-9, 9), pick([1, 0])]});
  shuffle(B);
  if (mode === 'moins' && B[0].K === -1 && B.length > 1 && Math.random() < 0.5) B.push(B.shift());   // le −( ) plus souvent au milieu ou à la fin
  var q = '', all = [], s1 = [], afterDone = false;
  B.forEach(function(b, k){
    if (b.t){ var m = mono(Math.abs(b.t[0]), b.t[1]); q += k === 0 ? (b.t[0] < 0 ? MINUS : '') + m : (b.t[0] < 0 ? ' ' + MINUS + ' ' : ' + ') + m; all.push(b.t); return; }
    var a = Math.abs(b.K), num = a === 1 ? '' : String(a), inn = '(' + terms(b.T) + ')';
    if (k === 0 && b.K > 1 && Math.random() < 0.3) { q += inn + ' × ' + a; afterDone = true; }
    else q += k === 0 ? (b.K < 0 ? MINUS : '') + num + inn : (b.K < 0 ? ' ' + MINUS + ' ' : ' + ') + num + inn;
    b.T.forEach(function(t){ all.push([b.K * t[0], t[1]]); });
  });
  var P = sumT(all); if (!P[2] && !P[1] && !P[0]) return parenGen(mode);
  var st = [terms(all), poly(P)]; if (st[0] === st[1]) st = [st[0]];
  return {q: q, P: P, key: q, steps: st};
}
/* ---------- exercices ----------
   chaque générateur renvoie {q, P (réponse attendue) | v (nombre) | vf (true/false), steps: [lignes], aide?} */
var EX = [
 // ===== N01 : simple distributivité =====
 {id: 'n01a', lv: 1, n: 'N01', t: 'Développer k(ax + b)', d: 'Coefficients positifs, pour démarrer.',
  c: 'Développe puis réduis chaque expression.', a: 'On multiplie le nombre par chaque terme de la parenthèse : k(a + b) = k × a + k × b, et (a + b) × k = a × k + b × k.',
  g: function(){ return dev(rnd(2, 9), 0, [rnd(1, 9), rnd(1, 9)]); }},
 {id: 'n01b', lv: 2, n: 'N01', t: 'Avec des nombres relatifs', d: 'Attention aux signes !',
  c: 'Développe puis réduis chaque expression.', a: 'Règle des signes : (−) × (+) = (−) et (−) × (−) = (+). Par exemple −3(x − 2) = −3x + 6 et (5 − 2x) × (−4) = −20 + 8x.',
  g: function(){ var k = rnz(-9, 9), a = rnz(-9, 9), b = rnz(-9, 9); if ((k > 0 && a > 0 && b > 0) || k === 1) k = -k;
    return dev(k, 0, [a, b]); }},
 {id: 'n01c', lv: 2, n: 'N01', t: 'Multiplier par un facteur en x', d: 'Le facteur contient x : on obtient des x².',
  c: 'Développe puis réduis chaque expression (x × x = x²).', a: 'x × x = x² et 3x × 2x = 6x². Par exemple x(2x + 5) = 2x² + 5x et (4 − x) × (−3x) = −12x + 3x².',
  g: function(){ return dev(pick([1, 1, -1, rnz(-6, 6)]), 1, [rnz(-7, 7), rnz(-9, 9)]); }},
 {id: 'n01d', lv: 1, n: 'N01', t: 'Calculer astucieusement', d: 'La distributivité en calcul mental.',
  c: 'Calcule de tête en utilisant la distributivité.', a: 'Par exemple 7 × 102 = 7 × (100 + 2) = 700 + 14 = 714, et 6 × 99 = 6 × (100 − 1) = 600 − 6 = 594.',
  g: function(){ var k = rnd(3, 9), base = pick([10, 100, 1000]), e = rnz(-3, 3), m = base + e;
    return {q: k + ' × ' + m, v: k * m,
      steps: [k + ' × (' + base + (e < 0 ? ' ' + MINUS + ' ' : ' + ') + Math.abs(e) + ')',
              k * base + (e < 0 ? ' ' + MINUS + ' ' : ' + ') + Math.abs(k * e), String(k * m)]}; }},
 {id: 'n01e', lv: 3, n: 'N01', t: 'Pour aller plus loin', d: '3 ou 4 termes dans la parenthèse.',
  c: 'Développe puis réduis chaque expression.', a: 'On multiplie le facteur par chaque terme de la parenthèse, sans en oublier, puis on regroupe les termes de même nature. Par exemple −2(x² − 3x + 4 + 5x) = −2x² + 6x − 8 − 10x = −2x² − 4x − 8.',
  g: devN},
 // ===== N02 : réduire =====
 {id: 'n02a', lv: 1, n: 'N02', t: 'Réduire une somme', d: 'Des x et des nombres.',
  c: 'Réduis chaque expression.', a: 'On regroupe les termes en x entre eux et les nombres entre eux : 5x + 3 − 2x + 4 = 3x + 7.',
  g: function(){ return sumGen(3, 6, [1, 0], 1); }},
 {id: 'n02b', lv: 2, n: 'N02', t: 'Réduire avec des x²', d: 'Ne pas mélanger x² et x !',
  c: 'Réduis puis ordonne chaque expression (x², puis x, puis le nombre).', a: 'x² et x ne s\'additionnent pas : 3x² + 2x reste 3x² + 2x. On regroupe les x² entre eux, les x entre eux, les nombres entre eux.',
  g: function(){ return sumGen(4, 7, [2, 1, 0], 2); }},
 {id: 'n02c', lv: 2, n: 'N02', t: 'Réduire un produit', d: '2 ou 3 facteurs : nombres × nombres, x × x.',
  c: 'Écris chaque produit le plus simplement possible.', a: 'On multiplie les nombres entre eux et les x entre eux : 3x × 4x = 12x² et 5 × 2x = 10x.',
  g: prodGen},
 {id: 'n02d', lv: 2, n: 'N02', t: 'Vrai ou faux ?', d: 'Les pièges classiques.',
  c: 'Pour chaque égalité, dis si elle est vraie pour toutes les valeurs de x.', a: 'x + x = 2x mais x × x = x². 3x + 2 ne se réduit pas : ce ne sont pas des termes de même nature.',
  g: function(){ var a = rnd(2, 9), b = rnd(2, 9), L = [
      [mono(a, 1) + ' + ' + mono(b, 1) + ' = ' + mono(a + b, 1), true, 'On ajoute les coefficients : ' + a + ' + ' + b + ' = ' + (a + b) + '.'],
      [mono(a, 1) + ' + ' + b + ' = ' + mono(a + b, 1), false, mono(a, 1) + ' et ' + b + ' ne sont pas de même nature : ' + mono(a, 1) + ' + ' + b + ' ne se réduit pas.'],
      ['x + x = x²', false, 'x + x = 2x (et x × x = x²).'],
      ['x × x = 2x', false, 'x × x = x² (et x + x = 2x).'],
      [mono(a, 1) + ' × ' + b + ' = ' + mono(a * b, 1), true, a + ' × ' + b + ' = ' + a * b + ', donc ' + mono(a, 1) + ' × ' + b + ' = ' + mono(a * b, 1) + '.'],
      [mono(a, 1) + ' × ' + mono(b, 1) + ' = ' + mono(a * b, 1), false, 'x × x = x², donc ' + mono(a, 1) + ' × ' + mono(b, 1) + ' = ' + mono(a * b, 2) + '.'],
      [mono(a, 2) + ' + ' + mono(b, 2) + ' = ' + mono(a + b, 2), true, 'Ce sont des termes en x² : ' + a + ' + ' + b + ' = ' + (a + b) + '.'],
      [mono(a, 2) + ' + ' + mono(b, 1) + ' = ' + mono(a + b, 3).replace('x²', 'x³'), false, 'x² et x ne sont pas de même nature : la somme ne se réduit pas.'],
      [mono(a, 1) + ' ' + MINUS + ' ' + mono(a, 1) + ' = 0', true, a + ' − ' + a + ' = 0, donc ' + mono(a, 1) + ' − ' + mono(a, 1) + ' = 0x = 0.'],
      ['2(x + ' + b + ') = 2x + ' + b, false, 'Le 2 multiplie les deux termes : 2(x + ' + b + ') = 2x + ' + 2 * b + '.']];
    var i = rnd(0, L.length - 1), p = L[i]; return {q: p[0], vf: p[1], steps: [p[2]], key: 'vf' + i}; }},
 // ===== N03 : parenthèses =====
 {id: 'n03a', lv: 1, n: 'N03', t: 'Parenthèses précédées de +', d: 'On les enlève sans rien changer.',
  c: 'Supprime les parenthèses puis réduis.', a: 'Des parenthèses précédées d\'un + (ou en début de calcul) s\'enlèvent sans changer les signes : 3x + (2x − 5) = 3x + 2x − 5 = 5x − 5.',
  g: function(){ return parenGen('plus'); }},
 {id: 'n03b', lv: 2, n: 'N03', t: 'Parenthèses précédées de −', d: 'On change tous les signes à l\'intérieur.',
  c: 'Supprime les parenthèses puis réduis.', a: 'Des parenthèses précédées d\'un − s\'enlèvent en changeant le signe de chaque terme : 5x − (2x − 3) = 5x − 2x + 3 = 3x + 3.',
  g: function(){ return parenGen('moins'); }},
 {id: 'n03c', lv: 3, n: 'N03', t: 'Développer et réduire', d: 'Tout ensemble : distributivité et parenthèses.',
  c: 'Développe, supprime les parenthèses puis réduis.', a: 'On développe d\'abord les produits, on supprime les parenthèses (attention au −), puis on réduit. Par exemple 3(x + 2) − 2(x − 1) = 3x + 6 − 2x + 2 = x + 8.',
  g: function(){ return parenGen('dev'); }}
];
var NOTIONS = [
  {n: 'N01', t: 'Développer grâce à la simple distributivité', r: 'k(a + b) = ka + kb et k(a − b) = ka − kb.'},
  {n: 'N02', t: 'Réduire une expression littérale', r: 'On regroupe les termes de même nature : les x², les x, les nombres.'},
  {n: 'N03', t: 'Supprimer les parenthèses précédées d’un + ou d’un −', r: '+(…) : on garde les signes ; −(…) : on change tous les signes.'}
];

/* ---------- affichage ---------- */
function best(id){ return parseInt(store('s01:' + id) || '0', 10) || 0; }
var LV = ['', 'Facile', 'Moyen', 'Difficile'];
function lvl(v){ var e = el('span', 'lvl l' + v); e.title = 'Difficulté : ' + LV[v];
  e.appendChild(el('span', 'st', '★★★'.slice(0, v) + '☆☆☆'.slice(0, 3 - v))); e.appendChild(document.createTextNode(' ' + LV[v])); return e; }
function menu(focus){
  main.textContent = ''; tomenu.hidden = true; kbar.hidden = true;
  NOTIONS.forEach(function(no){
    var sec = el('section', 'notion'); sec.id = no.n.toLowerCase();
    var h = el('h2'); h.appendChild(el('span', 'code', no.n)); h.appendChild(document.createTextNode(no.t)); sec.appendChild(h);
    sec.appendChild(el('p', 'rap', 'À retenir : ' + no.r));
    var g = el('div', 'grid');
    EX.filter(function(x){ return x.n === no.n; }).sort(function(a, b){ return a.lv - b.lv; }).forEach(function(x){
      var b = el('button', 'tile'); b.type = 'button';
      b.appendChild(lvl(x.lv)); b.appendChild(el('b', null, x.t)); b.appendChild(el('span', 'd', x.d));
      var r = best(x.id); if (r) b.appendChild(el('span', 'rec', 'Meilleur score : ' + r + ' / ' + N + (r === N ? ' ✓' : '')));
      b.onclick = function(){ location.hash = x.id; };
      g.appendChild(b);
    });
    sec.appendChild(g); main.appendChild(sec);
  });
  if (focus){ var t = document.getElementById(focus); if (t) t.scrollIntoView(); } else window.scrollTo(0, 0);
}
var lastInput = null;
function keybar(){
  kbar.textContent = '';
  [['x', 'x'], ['x²', 'x²'], [MINUS, '-'], ['+', '+'], ['⌫', null]].forEach(function(k){
    var b = el('button', null, k[0]); b.type = 'button';
    b.onmousedown = function(e){ e.preventDefault(); };
    b.onclick = function(){ var f = lastInput; if (!f || f.disabled) return;
      var s = f.selectionStart != null ? f.selectionStart : f.value.length, e2 = f.selectionEnd != null ? f.selectionEnd : s;
      if (k[1] === null){ if (s === e2 && s > 0) s--; f.value = f.value.slice(0, s) + f.value.slice(e2); f.setSelectionRange(s, s); }
      else { f.value = f.value.slice(0, s) + k[1] + f.value.slice(e2); f.setSelectionRange(s + k[1].length, s + k[1].length); }
      f.focus(); };
    kbar.appendChild(b);
  });
}
function run(x){
  main.textContent = ''; tomenu.hidden = false; window.scrollTo(0, 0);
  var p = el('section', 'panel'), ph = el('div', 'ph'), no = NOTIONS.filter(function(z){ return z.n === x.n; })[0];
  ph.appendChild(el('p', 'kick', x.n + ' · ' + no.t)); ph.appendChild(el('h2', null, x.t)); ph.appendChild(lvl(x.lv)); p.appendChild(ph);
  p.appendChild(el('p', 'consigne', x.c)); p.appendChild(el('p', 'aide', '💡 ' + x.a));
  var items = el('div', 'items'), qs = [], seen = {};
  for (var i = 0; i < N; i++){
    qs.push(item(i));
  }
  function item(i){
    var Q, k = 0; do { Q = x.g(); } while (seen[Q.key || Q.q] && ++k < 30); seen[Q.key || Q.q] = 1;
    var it = el('div', 'item'), q = el('div', 'q'); q.appendChild(el('span', 'nm', String.fromCharCode(65 + i) + ' =')); q.appendChild(document.createTextNode(Q.q));
    it.appendChild(q);
    if (Q.vf !== undefined){
      var vf = el('div', 'vf'); Q.btns = ['Vrai', 'Faux'].map(function(lab){ var b = el('button', null, lab); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
        b.onclick = function(){ if (Q.done) return; Q.btns.forEach(function(o){ o.setAttribute('aria-pressed', String(o === b)); }); Q.choice = lab === 'Vrai'; }; vf.appendChild(b); return b; });
      it.appendChild(vf);
    } else {
      var ln = el('div', 'ln'); ln.appendChild(el('span', 'eq', '='));
      var f = el('input', 'w'); f.type = 'text'; f.autocomplete = 'off'; f.setAttribute('autocapitalize', 'off'); f.spellcheck = false;
      f.inputMode = Q.v !== undefined ? 'decimal' : 'text'; f.placeholder = Q.v !== undefined ? 'résultat' : 'ta réponse';
      f.setAttribute('aria-label', 'Réponse ' + String.fromCharCode(65 + i));
      f.onfocus = function(){ lastInput = this; };
      f.onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); var all = main.querySelectorAll('input.w'), j = [].indexOf.call(all, this); if (all[j + 1]) all[j + 1].focus(); else check(); } };
      ln.appendChild(f); it.appendChild(ln); Q.f = f;
    }
    Q.it = it; items.appendChild(it); return Q;
  }
  p.appendChild(items);
  var row = el('div', 'row'), bc = el('button', 'btn main', 'Vérifier'), bn = el('button', 'btn', 'Nouvelle série');
  bc.type = bn.type = 'button'; row.appendChild(bc); row.appendChild(bn); p.appendChild(row);
  var res = el('div', 'res'); res.hidden = true; p.appendChild(res);
  main.appendChild(p);
  kbar.hidden = !qs.some(function(Q){ return Q.P; }); keybar();
  bn.onclick = function(){ run(x); };
  function check(){
    var score = 0;
    qs.forEach(function(Q){
      if (Q.done) { score += Q.ok ? 1 : 0; return; }
      var ok = false, why = '';
      if (Q.vf !== undefined){
        if (Q.choice === undefined) { why = 'Tu n’as pas répondu.'; }
        else ok = Q.choice === Q.vf;
        Q.btns.forEach(function(b){ b.classList.remove('okF', 'koF'); if (b.getAttribute('aria-pressed') === 'true') b.classList.add(ok ? 'okF' : 'koF'); });
      } else if (Q.v !== undefined){
        var v = parseNum(Q.f.value); ok = v === Q.v; if (!Q.f.value.trim()) why = 'Tu n’as pas répondu.';
      } else {
        var R = parse(Q.f.value);
        if (!Q.f.value.trim()) why = 'Tu n’as pas répondu.';
        else if (!R) why = 'Je n’arrive pas à lire ta réponse : écris par exemple 3x² ' + MINUS + ' 5x + 2.';
        else if (R.paren) why = 'Il reste des parenthèses : il faut les supprimer.';
        else if (!sameP(R.P, Q.P)) why = 'Ce n’est pas le bon résultat.';
        else if (!R.reduit) why = 'Le résultat est juste, mais il n’est pas réduit au maximum' + (R.fois ? ' (il reste un ×)' : '') + '.';
        else ok = true;
      }
      if (Q.f){ Q.f.classList.remove('okF', 'koF'); Q.f.classList.add(ok ? 'okF' : 'koF'); }
      Q.it.classList.remove('okI', 'koI'); Q.it.classList.add(ok ? 'okI' : 'koI');
      var old = Q.it.querySelector('.corr'); if (old) old.remove();
      var c = el('div', 'corr ' + (ok ? 'ok' : 'ko')); c.appendChild(el('span', 'cv', ok ? '✓ Bravo !' : '✗ ' + (why || 'Ce n’est pas ça.')));
      // correction : tout de suite pour Vrai/Faux ; sinon après 2 essais, ou sur demande (jamais sans réponse)
      var blank = why === 'Tu n’as pas répondu.';
      if (!ok && !blank) Q.tries = (Q.tries || 0) + 1;
      function showSol(){
        var cs = el('div', 'cs');
        if (Q.vf !== undefined) cs.appendChild(el('div', null, (Q.vf ? 'Vrai. ' : 'Faux. ') + Q.steps[0]));
        else cs.appendChild(el('div', 'sl', Q.steps.map(function(s, j){ return (j === 0 ? String.fromCharCode(65 + qs.indexOf(Q)) : ' ') + ' = ' + s; }).join('\n')));
        c.appendChild(cs);
      }
      if (Q.vf !== undefined ? !blank : (!ok && Q.tries >= 2)) showSol();
      else if (!ok && !blank){ var sb = el('button', 'btn', 'Voir la correction'); sb.type = 'button'; sb.style.alignSelf = 'flex-start'; sb.style.minHeight = '36px'; sb.style.padding = '6px 12px';
        sb.onclick = function(){ sb.remove(); showSol(); Q.tries = 2; }; c.appendChild(sb); c.appendChild(el('span', null, 'Essaie de corriger ta réponse, puis clique à nouveau sur « Vérifier ».')); }
      Q.it.appendChild(c);
      if (ok || (Q.vf !== undefined && !blank)) { Q.done = true; Q.ok = ok; if (Q.f) Q.f.disabled = ok; }
      score += ok ? 1 : 0;
    });
    res.hidden = false; res.className = 'res ' + (score === N ? 'ok' : score >= 3 ? 'mid' : 'ko');
    res.textContent = score + ' / ' + N + (score === N ? ' : parfait !' : '');
    res.appendChild(el('small', null, score === N ? 'Tu peux passer à l’exercice suivant ou faire une nouvelle série.' : 'Corrige les réponses en rouge puis clique à nouveau sur « Vérifier », ou lis la correction.'));
    if (score > best(x.id)) store('s01:' + x.id, String(score));
    res.scrollIntoView({block: 'nearest'});
  }
  bc.onclick = check;
}
function route(){
  var h = location.hash.slice(1), x = EX.filter(function(e){ return e.id === h; })[0];
  if (x) run(x); else menu(/^n0\d$/.test(h) ? h : null);
}
tomenu.onclick = function(){ var h = location.hash.slice(1); location.hash = h.slice(0, 3); };
window.addEventListener('hashchange', route);
route();
})();
</script>
