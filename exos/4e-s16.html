(function(){

// une expression d'un membre : {t: texte, f: valeur en x, s: calcul détaillé pour x}
function exA(a, b){ return {t: L(a, b), f: function(x){ return a * x + b; }, s: function(x){ var p = (a === 1 ? pf(x) : a === -1 ? MINUS + pf(x) : fr(a) + ' × ' + pf(x)); return p + (b ? sgn(b) : ''); }}; }
function exB(b, a){ return {t: fr(b) + (a > 0 ? ' + ' : ' ' + MINUS + ' ') + M.mono(Math.abs(a), 1), f: function(x){ return b + a * x; }, s: function(x){ return fr(b) + (a > 0 ? ' + ' : ' ' + MINUS + ' ') + (Math.abs(a) === 1 ? pf(x) : fr(Math.abs(a)) + ' × ' + pf(x)); }}; }
function exK(k, b){ return {t: (k === -1 ? MINUS : fr(k)) + '(x' + sgn(b) + ')', f: function(x){ return k * (x + b); }, s: function(x){ return fr(k) + ' × (' + fr(x) + sgn(b) + ') = ' + fr(k) + ' × ' + pf(cl(x + b)); }}; }

// fabrique un membre de droite qui vaut target en x (ou proche)
function rightFor(x, target, kind){

function leftAny(level){ var r = Math.random();
