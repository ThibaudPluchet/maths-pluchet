body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;

.kick{color:var(--muted);font-weight:700;font-size:14px;margin:0}

h2.cat{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}

<body>
<header class="wrap">
  <div class="top"><a href="../" id="home">← Mes cours</a><a href="4e-n01.html">🎮 Les 9 jeux</a><button type="button" id="tomenu" hidden>← Menu de l’exerciseur</button></div>
  <p class="kick">4e · Séquence 1 · N01</p>
  <h1>Préparer l’évaluation</h1>
  <p class="sub">Additionner et soustraire des nombres relatifs : les mêmes exercices et le même barème que l’évaluation. Calculatrice interdite !</p>
</header>
<main class="wrap" id="main"></main>
<div class="kbar" id="kbar" hidden></div>
<script>
(function(){
'use strict';
var main = document.getElementById('main'), tomenu = document.getElementById('tomenu'), kbar = document.getElementById('kbar');
var MINUS = '−', EPS = 1e-9;
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function eq(a, b){ return Math.abs(a - b) < EPS; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function num(n){ var s = String(Math.abs(Math.round(n * 100) / 100)).replace('.', ','); return s; }
function fmt(n){ return (n < -EPS ? MINUS : '') + num(n); }                    // −4 ; 9
function fmtS(n){ return (n < -EPS ? MINUS : '+') + num(n); }                  // −4 ; +9
function par(n){ return '(' + fmtS(n) + ')'; }
function pts(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
function plural(n, w){ return n + ' ' + w + (n > 1 ? 's' : ''); }

/* ---------- lecture des réponses ---------- */
function norm(s){ return String(s || '').replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/\./g, ',').replace(/^=/, ''); }
function parseNum(s){
  s = norm(s).replace(/^\((.*)\)$/, '$1');
  if (!/^[+-]?\d+(,\d+)?$/.test(s)) return null; return parseFloat(s.replace(',', '.'));
}
// expression du type (−5) + (+12)  ou  −4 + 9 + 6 − 8  →  liste de termes {op, v, paren}
function parseExpr(s){
  s = norm(s); var i = 0, terms = [];
  function number(){ var m = /^\d+(,\d+)?/.exec(s.slice(i)); if (!m) return null; i += m[0].length; return parseFloat(m[0].replace(',', '.')); }
  while (i < s.length){
    var op = '+';
    if (terms.length){ if (s[i] !== '+' && s[i] !== '-') return null; op = s[i]; i++; }
    else if ((s[i] === '+' || s[i] === '-') && s[i + 1] === '('){ op = s[i]; i++; }
    var paren = false, sign = 1, v;
    if (s[i] === '('){
      paren = true; i++;
      if (s[i] === '+' || s[i] === '-'){ sign = s[i] === '-' ? -1 : 1; i++; }
      v = number(); if (v === null || s[i] !== ')') return null; i++;
    } else {
      if (!terms.length && (s[i] === '+' || s[i] === '-')){ sign = s[i] === '-' ? -1 : 1; i++; }
      v = number(); if (v === null) return null;
    }
    terms.push({op: op, v: sign * v, paren: paren, eff: (op === '-' ? -1 : 1) * sign * v});
  }
  return terms.length ? terms : null;
}
function sameList(a, b){ return a.length === b.length && a.every(function(x, k){ return eq(x, b[k]); }); }
function sameBag(a, b){ var x = a.slice().sort(function(p, q){ return p - q; }), y = b.slice().sort(function(p, q){ return p - q; }); return sameList(x, y); }
function effs(t){ return t.map(function(x){ return x.eff; }); }
function simpWrite(list){ return list.map(function(x, k){ return (k === 0 ? (x < 0 ? MINUS : '') : (x < 0 ? ' ' + MINUS + ' ' : ' + ')) + num(x); }).join(''); }

/* ---------- champs de saisie ---------- */
var lastInput = null;
function field(cls, ph){
  var i = el('input', 'w' + (cls ? ' ' + cls : '')); i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false; i.inputMode = 'text';
  if (ph) i.placeholder = ph;
  // barre de symboles ( ) + − , placée juste sous la ligne en cours de saisie
  i.addEventListener('focus', function(){ lastInput = i; var ln = i.parentNode; ln.parentNode.insertBefore(kbar, ln.nextSibling); kbar.hidden = false; });
  return i;
}
// le signe moins inséré est le tiret « - » de la touche 6 du clavier, pour que tout s'écrive avec le même symbole
['(', ')', '+', '-', ','].forEach(function(k){
  var b = el('button', null, k); b.type = 'button'; if (k === '-') b.setAttribute('aria-label', 'moins');
  b.addEventListener('mousedown', function(e){ e.preventDefault(); });
  b.onclick = function(){
    if (!lastInput || lastInput.disabled) return;
    var a = lastInput.selectionStart || lastInput.value.length, z = lastInput.selectionEnd || a;
    lastInput.value = lastInput.value.slice(0, a) + k + lastInput.value.slice(z);
    lastInput.focus(); lastInput.setSelectionRange(a + 1, a + 1);
  };
  kbar.appendChild(b);
});
function mark(input, ok){ input.classList.remove('okF', 'koF'); input.classList.add(ok ? 'okF' : 'koF'); }
// Correction d'une question : verdict + ce qui ne va pas + correction rédigée ligne par ligne + rappel du cours
function corr(parent, got, max, o){
  o = o || {}; var full = eq(got, max), k = full ? 'ok' : got > 0 ? 'mid' : 'ko';
  var c = el('div', 'corr ' + k);
  c.appendChild(el('div', 'cv', (full ? '✓ Bravo ! ' : got > 0 ? 'Presque ! ' : '✗ ') + pts(got) + ' / ' + pts(max) + ' point' + (max > 1 ? 's' : '')));
  if (!full && o.why && o.why.length){ var ul = el('ul', 'cw'); o.why.forEach(function(w){ ul.appendChild(el('li', null, w)); }); c.appendChild(ul); }
  if (o.sol && (!full || o.always)){
    var s = el('div', 'cs'); s.appendChild(el('span', 'cl', o.solTitle || 'La bonne rédaction'));
    o.sol.forEach(function(l, i){ s.appendChild(el('div', 'sl' + (i === o.sol.length - 1 && !o.noHl ? ' hl' : ''), l)); });
    c.appendChild(s);
  }
  if (o.tip && !full){ var t = el('div', 'ct'); t.appendChild(el('b', null, '💡 À retenir : ')); t.appendChild(document.createTextNode(o.tip)); c.appendChild(t); }
  parent.appendChild(c); return c;
}
function itemState(item, got, max){ item.classList.add(eq(got, max) ? 'okI' : got > 0 ? 'midI' : 'koI'); }

/* ============ Exercice 1 : questions de cours ============ */
var COURS = [
  {t: ['Deux nombres opposés ont la même ', 0, ' et des signes ', 1, '.'], c: [['distance à zéro', 'valeur', 'partie entière'], ['contraires', 'identiques', 'positifs']]},
  {t: ['Soustraire un nombre, c’est ', 0, '.'], c: [['ajouter son opposé', 'soustraire son opposé', 'ajouter son inverse']]},
  {t: ['Pour tous nombres a et b :   a − b = ', 0], c: [['a + (−b)', 'a − (−b)', 'b − a']]},
  {t: ['Pour additionner deux nombres de même signe, on ', 0, ' leurs distances à zéro et on garde ', 1, '.'], c: [['additionne', 'soustrait', 'multiplie'], ['le signe commun', 'le signe +', 'le signe −']]},
  {t: ['Pour additionner deux nombres de signes contraires, on ', 0, ' leurs distances à zéro et on garde le signe de celui qui a la ', 1, '.'], c: [['soustrait', 'additionne', 'multiplie'], ['plus grande distance à zéro', 'plus petite distance à zéro', 'plus grande valeur']]}
];
function exCours(){
  var set = pick([[0, 1, 2], [3, 4, 2]]), max = 0, sels = [];
  var box = el('div', 'items');
  set.forEach(function(qi){
    var Q = COURS[qi], it = el('div', 'item'), p = el('div', 'fill');
    Q.t.forEach(function(part){
      if (typeof part === 'string'){ p.appendChild(document.createTextNode(part)); return; }
      var s = el('select', 's'), o0 = el('option', null, '…'); o0.value = ''; s.appendChild(o0);
      shuffle(Q.c[part].slice()).forEach(function(o){ var op = el('option', null, o); op.value = o; s.appendChild(op); });
      s.dataset.good = Q.c[part][0]; p.appendChild(s); sels.push({s: s, it: it, w: 1 / Q.c.length});
    });
    it.dataset.sent = Q.t.map(function(part){ return typeof part === 'string' ? part : Q.c[part][0]; }).join('');
    it.appendChild(p); box.appendChild(it);
  });
  max = 3;
  return {box: box, max: max, check: function(){
    var got = 0, byIt = new Map();
    sels.forEach(function(x){
      var ok = x.s.value === x.s.dataset.good; x.s.disabled = true; mark(x.s, ok); if (ok) got += x.w;
      var b = byIt.get(x.it) || {g: 0, m: 0, why: []}; b.m += x.w; if (ok) b.g += x.w; else b.why.push(x.s.value ? 'Il fallait « ' + x.s.dataset.good + ' » et non « ' + x.s.value + ' ».' : 'Case non remplie : il fallait « ' + x.s.dataset.good + ' ».'); byIt.set(x.it, b);
    });
    byIt.forEach(function(b, it){ itemState(it, b.g, b.m); corr(it, b.g, b.m, {why: b.why, sol: [it.dataset.sent], solTitle: 'La phrase complète', noHl: true}); });
    return got;
  }};
}

/* ============ Exercice 2 : additionner ============ */
function exAdd(){
  var a1 = rnd(3, 9), b1 = rnd(3, 9), a2 = rnd(3, 9), b2 = a2 + rnd(3, 6), d3 = rnd(2, 7) + .5, e3 = Math.ceil(d3) + rnd(1, 4), z = rnd(6, 15);
  var calcs = [[-a1, -b1], [a2, -b2], [-d3, e3], pick([[-z, z], [z, -z]])];
  var box = el('div', 'items two'), fs = [];
  calcs.forEach(function(c, k){
    var it = el('div', 'item'), r = c[0] + c[1];
    it.appendChild(el('div', 'q', String.fromCharCode(97 + k) + ')  ' + par(c[0]) + ' + ' + par(c[1])));
    var ln = el('div', 'ln'); ln.appendChild(el('span', 'eq', '=')); var f = field('num', 'résultat'); ln.appendChild(f); it.appendChild(ln);
    fs.push({f: f, it: it, c: c, r: r}); box.appendChild(it);
  });
  return {box: box, max: 4, check: function(){
    var got = 0;
    fs.forEach(function(x){
      var v = parseNum(x.f.value), g = 0, why;
      x.f.disabled = true;
      if (v !== null){
        if (eq(x.r, 0)) g = eq(v, 0) ? 1 : 0;
        else g = ((v < 0) === (x.r < 0) && !eq(v, 0) ? .5 : 0) + (eq(Math.abs(v), Math.abs(x.r)) ? .5 : 0);
      }
      got += g; mark(x.f, g === 1); itemState(x.it, g, 1);
      var same = (x.c[0] < 0) === (x.c[1] < 0), A = Math.abs(x.c[0]), B = Math.abs(x.c[1]), W = [];
      if (v === null) W.push(x.f.value.trim() ? 'Écris seulement le résultat (un nombre), par exemple -12 ou 4,5.' : 'Pas de réponse.');
      else if (!eq(v, x.r)){ if (!eq(Math.abs(v), Math.abs(x.r))) W.push('La distance à zéro est fausse : c’est ' + num(Math.abs(x.r)) + '.'); if (!eq(x.r, 0) && ((v < 0) !== (x.r < 0) || eq(v, 0))) W.push('Le signe est faux : le résultat est ' + (x.r < 0 ? 'négatif' : 'positif') + '.'); }
      var sol = eq(x.r, 0) ? [par(x.c[0]) + ' + ' + par(x.c[1]) + ' = 0'] : same ?
        [par(x.c[0]) + ' + ' + par(x.c[1]) + ' = ' + fmt(x.r), 'distances à zéro : ' + num(A) + ' + ' + num(B) + ' = ' + num(A + B) + ' ; signe ' + (x.r < 0 ? MINUS : '+')] :
        [par(x.c[0]) + ' + ' + par(x.c[1]) + ' = ' + fmt(x.r), 'distances à zéro : ' + num(Math.max(A, B)) + ' ' + MINUS + ' ' + num(Math.min(A, B)) + ' = ' + num(Math.abs(x.r)) + ' ; signe de ' + par(A > B ? x.c[0] : x.c[1])];
      if (sol.length > 1) sol = [sol[1], sol[0]];
      corr(x.it, g, 1, {why: W, sol: sol, tip: eq(x.r, 0) ? 'deux nombres opposés ont une somme égale à 0.' : same ? 'même signe → on additionne les distances à zéro et on garde le signe commun.' : 'signes contraires → on soustrait les distances à zéro et on garde le signe du nombre le plus éloigné de zéro.'});
    });
    return got;
  }};
}

/* ============ Exercice 3 : soustraire ============ */
function exSub(){
  var a = rnd(2, 6), b = a + rnd(4, 9), c = rnd(4, 9), d = c + rnd(5, 9), e = rnd(3, 8), f = rnd(4, 9), g = rnd(0, 3) + .5, h = rnd(1, 6) + .5;
  var calcs = [[a, b], [-c, -d], [-e, f], [g, -h]], box = el('div', 'items two'), fs = [];
  calcs.forEach(function(cc, k){
    var it = el('div', 'item'), L = 'ABCD'[k], r = cc[0] - cc[1];
    it.appendChild(el('div', 'q', L + ' = ' + par(cc[0]) + ' ' + MINUS + ' ' + par(cc[1])));
    var l1 = el('div', 'ln'), f1 = field('', 'addition de l’opposé'); l1.appendChild(el('span', 'eq', '=')); l1.appendChild(f1);
    var l2 = el('div', 'ln'), f2 = field('num', 'résultat'); l2.appendChild(el('span', 'eq', '=')); l2.appendChild(f2);

/* ============ Exercice 4 : simplifier puis calculer ============ */
function exSimp(){
  // E = (−a) + (+b) − (−c) − (+d)
  var Ev = [-rnd(2, 8), rnd(4, 12), -rnd(2, 9), rnd(5, 12)], Eops = ['+', '+', '-', '-'];
  var Eeff = Ev.map(function(v, k){ return Eops[k] === '-' ? -v : v; });
  // F = −a + b − c + d − e
  var Ff; do { Ff = [-rnd(5, 12), rnd(2, 8), -rnd(2, 7), rnd(2, 9), -rnd(1, 6)]; } while (eq(Ff.reduce(function(s, x){ return s + x; }, 0), 0));
  var box = el('div', 'items two'), parts = [];
  function block(name, display, eff, withSimp){
    var it = el('div', 'item'), P = eff.filter(function(x){ return x > 0; }).reduce(function(s, x){ return s + x; }, 0), N = -eff.filter(function(x){ return x < 0; }).reduce(function(s, x){ return s + x; }, 0), r = P - N;
    it.appendChild(el('div', 'q', name + ' = ' + display));
    var lines = [];
    (withSimp ? [['simplifiée', 'écriture simplifiée']] : []).concat([['regroupement', 'positifs puis négatifs'], ['différence', 'ex. 15 − 12'], ['résultat', 'résultat']]).forEach(function(L){
      var ln = el('div', 'ln'), f = field(L[0] === 'résultat' ? 'num' : '', L[1]); ln.appendChild(el('span', 'eq', '=')); ln.appendChild(f); it.appendChild(ln); lines.push({k: L[0], f: f});
    });
    parts.push({it: it, lines: lines, eff: eff, P: P, N: N, r: r, withSimp: withSimp, name: name, disp: display}); box.appendChild(it);
  }
  block('E', par(Ev[0]) + ' + ' + par(Ev[1]) + ' ' + MINUS + ' ' + par(Ev[2]) + ' ' + MINUS + ' ' + par(Ev[3]), Eeff, true);
  block('F', simpWrite(Ff), Ff, false);
  return {box: box, max: 5, check: function(){
    var got = 0;
    parts.forEach(function(x){
      var g = 0, max = x.withSimp ? 3 : 2, msgs = [];
      x.lines.forEach(function(L){
        var ok = false, t;
        L.f.disabled = true;
        if (L.k === 'simplifiée'){ t = parseExpr(L.f.value); ok = !!t && sameList(effs(t), x.eff) && t.every(function(y){ return !y.paren; }); if (ok) g += 1; else msgs.push('Ligne 1 (écriture simplifiée) fausse' + (t && t.some(function(y){ return y.paren; }) ? ' : il ne doit plus y avoir de parenthèses.' : '.')); }
        if (L.k === 'regroupement'){ t = parseExpr(L.f.value); var e = t && effs(t), k0 = e ? e.findIndex(function(y){ return y < 0; }) : -1;
          ok = !!t && sameBag(e, x.eff) && (k0 < 0 || e.slice(k0).every(function(y){ return y < 0; })) && t.every(function(y){ return !y.paren; });
          if (ok) g += 1; else msgs.push('Ligne ' + (x.withSimp ? 2 : 1) + ' (regroupement) fausse : on écrit d’abord tous les nombres positifs, puis tous les négatifs.'); }
        if (L.k === 'différence'){ t = parseExpr(L.f.value); ok = !!t && t.length === 2 && eq(t[0].eff, x.P) && eq(t[1].eff, -x.N); if (ok) g += .5; else msgs.push('Ligne ' + (x.withSimp ? 3 : 2) + ' (différence) fausse : on additionne les positifs, puis les distances à zéro des négatifs.'); }
        if (L.k === 'résultat'){ var v = parseNum(L.f.value); ok = v !== null && eq(v, x.r); if (ok) g += .5; else msgs.push('Dernière ligne : le résultat est faux.'); }
        mark(L.f, ok);
      });
      got += g; itemState(x.it, g, max);
      var pos = x.eff.filter(function(y){ return y > 0; }), neg = x.eff.filter(function(y){ return y < 0; });
      var sol = [x.name + ' = ' + x.disp].concat(x.withSimp ? ['   = ' + simpWrite(x.eff)] : []).concat(['   = ' + simpWrite(pos.concat(neg)), '   = ' + num(x.P) + ' ' + MINUS + ' ' + num(x.N), '   = ' + fmt(x.r)]);
      corr(x.it, g, max, {why: msgs, sol: sol, tip: (x.withSimp ? 'pour simplifier : + (+3) → + 3 ; + (' + MINUS + '3) → ' + MINUS + ' 3 ; ' + MINUS + ' (+3) → ' + MINUS + ' 3 ; ' + MINUS + ' (' + MINUS + '3) → + 3. ' : '') + 'Puis on regroupe les positifs (' + pos.map(num).join(' + ') + ' = ' + num(x.P) + ') et les négatifs (' + neg.map(function(y){ return num(-y); }).join(' + ') + ' = ' + num(x.N) + ').'});
    });
    return got;
  }};
}

var PLACES = ['Cany-Barville', 'Veulettes-sur-Mer', 'Fécamp', 'Yvetot', 'Saint-Valery-en-Caux', 'Étretat'];
function exPb(){
  var s, m1, m2, fin, q1, q2, v2, gap, ans1, ans2, unit;
  if (Math.random() < .5){
    unit = '°C'; s = -rnd(2, 6); m1 = rnd(7, 12); m2 = rnd(5, 13); fin = s + m1 - m2; v2 = fin - rnd(5, 10); gap = fin - v2;
    q1 = 'À ' + pick(PLACES) + ', un jour de ' + pick(['janvier', 'février', 'décembre']) + ' (températures imaginées), il fait ' + fmt(s) + ' °C à ' + rnd(6, 8) + ' h. La température monte de ' + m1 + ' °C jusqu’à midi, puis baisse de ' + m2 + ' °C jusqu’à minuit.';
    ans1 = {eff: [s, m1, -m2], txt: fmt(s) + ' + ' + m1 + ' ' + MINUS + ' ' + m2, sent: 'À minuit, il fait ' + fmt(fin) + ' °C.'};
    q2 = 'Le lendemain matin, il fait ' + fmt(v2) + ' °C. De combien de degrés la température a-t-elle baissé depuis minuit ?';
    ans2 = {a: fin, b: v2, r: gap, sent: 'La température a baissé de ' + num(gap) + ' °C.'};
  } else {
    unit = 'm'; s = -rnd(6, 14); m1 = rnd(10, 18); m2 = rnd(4, 9); fin = s - m1 + m2; v2 = fin - rnd(6, 14); gap = fin - v2;
    q1 = 'Au large de Fécamp, un robot sous-marin inspecte la fondation d’une éolienne (situation imaginée). Il se trouve à ' + fmt(s) + ' m (' + num(s) + ' m sous la surface). Il descend de ' + m1 + ' m, puis remonte de ' + m2 + ' m.';
    ans1 = {eff: [s, -m1, m2], txt: fmt(s) + ' ' + MINUS + ' ' + m1 + ' + ' + m2, sent: 'Le robot se trouve à ' + fmt(fin) + ' m.'};
    q2 = 'Le fond marin est à ' + fmt(v2) + ' m. De combien de mètres le robot doit-il encore descendre pour atteindre le fond ?';

  }

  box.appendChild(el('p', null, q1));
  it1.appendChild(el('div', 'q', '1. Écris un seul calcul donnant la ' + (unit === 'm' ? 'position finale du robot' : 'température à minuit') + ', puis effectue-le.'));
  var c1 = el('div', 'ln'), f1 = field('', 'un seul calcul'); c1.appendChild(el('span', 'tag', 'Calcul')); c1.appendChild(f1);
  var r1 = el('div', 'ln'), g1 = field('num', 'résultat'); r1.appendChild(el('span', 'tag', 'Résultat (' + unit + ')')); r1.appendChild(g1);
  it1.appendChild(c1); it1.appendChild(r1);
  it2.appendChild(el('div', 'q', '2. ' + q2));
  var c2 = el('div', 'ln'), f2 = field('', 'calcul'); c2.appendChild(el('span', 'tag', 'Calcul')); c2.appendChild(f2);
  var r2 = el('div', 'ln'), g2 = field('num', 'résultat'); r2.appendChild(el('span', 'tag', 'Résultat (' + unit + ')')); r2.appendChild(g2);
  it2.appendChild(c2); it2.appendChild(r2);
  box.appendChild(it1); box.appendChild(it2);
  return {box: box, max: 4, check: function(){
    var got = 0;
    // question 1 : calcul (1), résultat (0,5), phrase (0,5 : à écrire sur la copie, compté si le résultat est juste)
    var t = parseExpr(f1.value), okc = !!t && sameList(effs(t), ans1.eff), v = parseNum(g1.value), okr = v !== null && eq(v, fin);
    mark(f1, okc); mark(g1, okr); f1.disabled = g1.disabled = true;
    var p1 = (okc ? 1 : 0) + (okr ? 1 : 0); got += p1; itemState(it1, p1, 2);
    var W1 = []; if (!okc) W1.push('Le calcul ne correspond pas à la situation : on part de ' + fmt(s) + ', puis on ' + (unit === 'm' ? 'descend (' + MINUS + ') puis on remonte (+).' : 'monte (+) puis on baisse (' + MINUS + ').')); if (!okr) W1.push('Le résultat est faux.');
    corr(it1, p1, 2, {why: W1, always: true, sol: [ans1.txt + ' = ' + fmt(fin), '« ' + ans1.sent + ' »'], noHl: true, solTitle: 'La bonne rédaction (n’oublie pas la phrase sur ta copie)', tip: 'monter, gagner, déposer → + ; descendre, baisser, perdre → ' + MINUS + '.'});
    // question 2 : écart = a − b
    t = parseExpr(f2.value);

    if (!okc2 && t) okc2 = eq(effs(t).reduce(function(s, x){ return s + x; }, 0), gap) && t.length === 2 && sameBag(t.map(function(x){ return Math.abs(x.v); }), [Math.abs(ans2.a), Math.abs(ans2.b)]);

}

      if (!eq(r.got, r.x.max) && r.x.id !== 'bonus'){ var b = el('button', 'btn', 'À retravailler →'); b.type = 'button'; b.onclick = function(){ location.hash = r.x.id; }; line.appendChild(b); }
      bl.appendChild(line);
    });
    sum.appendChild(bl);
    sum.appendChild(el('p', 'consigne', 'Les phrases réponses du problème (0,5 pt chacune) sont comptées quand le résultat est juste : sur ta vraie copie, pense à les écrire ! Les corrections détaillées sont sous chaque exercice.'));
    var r2 = el('div', 'row'), b2 = el('button', 'btn', 'Menu'); b2.onclick = function(){ location.hash = ''; }; r2.appendChild(b2); sum.appendChild(r2);
    main.insertBefore(sum, main.firstChild);
    // en bas de la copie corrigée aussi : recommencer
    var foot = el('section', 'panel'); foot.appendChild(el('p', 'consigne', 'Tu as lu toutes les corrections ? Entraîne-toi encore : un nouveau sujet est tiré à chaque fois, tu peux recommencer autant de fois que tu veux.'));
    var fr = el('div', 'row'), fb1 = el('button', 'btn main', '🔁 Recommencer avec un nouveau sujet'), fb2 = el('button', 'btn', 'Menu');
    fb1.onclick = function(){ blanc(); }; fb2.onclick = function(){ location.hash = ''; }; fr.appendChild(fb1); fr.appendChild(fb2); foot.appendChild(fr); main.appendChild(foot);
    window.scrollTo(0, 0);
    stat('/exos/4e-n01-eval/blanc/note', 'Évaluation blanche N01 rendue');
  }
  window.scrollTo(0, 0);
}

function route(){
  var id = location.hash.slice(1);
  if (id === 'blanc') blanc(); else if (id) train(id); else menu();
}
tomenu.onclick = function(){ location.hash = ''; };
try { if (document.referrer && new URL(document.referrer).pathname.replace(/index\.html$/, '') === new URL('../', location.href).pathname) document.getElementById('home').href = document.referrer; } catch(e){}
window.addEventListener('hashchange', route);
route();
})();
