(function(){

 {id: 'n01b', lv: 1, n: 'N01', t: 'Soustraire un relatif', d: 'Ajouter l’opposé.', c: 'Calcule.', a: 'Soustraire un nombre, c’est ajouter son opposé : a − (−b) = a + b et a − (+b) = a − b.',

 {id: 'n01e', lv: 3, n: 'N01', nq: 3, t: 'Problèmes', d: 'Températures, altitudes, comptes…', c: 'Lis l’énoncé, écris le calcul, puis donne le résultat.', a: 'Monter, gagner, déposer : on ajoute. Descendre, perdre, payer : on soustrait. Un écart, c’est le plus grand moins le plus petit.',

    var i = rnd(0, L.length - 1), p = L[i]; return {type: 'ch', q: p[0], ch: ['Vrai', 'Faux'], ans: p[1] ? 0 : 1, steps: [(p[1] ? 'Vrai. ' : 'Faux. ') + p[2]], key: 'vf' + i}; }},
 {id: 'n03c', lv: 2, n: 'N03', t: 'Quotients décimaux', d: 'Résultat décimal.', c: 'Calcule (résultat exact).', a: 'Le signe d’abord, puis la division des distances à zéro, posée si besoin.',
  g: function(){ var b = pick([2, 4, 5, 8, 10, 20, 25]), x = cl(rnz(-99, 99) / pick([10, 100, 4, 2])); var a = cl(b * x); if (M.isInt(x) || Math.abs(a) > 300 || !M.isInt(a * 10)) return this.g();
    var sb = pick([1, -1]), B = b * sb, X = cl(x * sb);
    return {type: 'num', q: (a < 0 ? '(' + fr(a) + ')' : fr(a)) + ' ÷ ' + pf(B) + ' = ?', v: X, steps: [(a * B > 0 ? 'Même signe : positif.' : 'Signes contraires : négatif.'), fr(Math.abs(a)) + ' ÷ ' + Math.abs(B) + ' = ' + fr(Math.abs(X)) + ', donc ' + fr(X) + '.'], traps: [[-X, 'Attention au signe.']]}; }},
 {id: 'n03d', lv: 2, n: 'N03', t: 'Nombre manquant', d: 'Dividende ou diviseur.', c: 'Trouve le nombre manquant.', a: '? ÷ b = c donne ? = c × b. a ÷ ? = c donne ? = a ÷ c.',
  g: function(){ var b = rnz(-9, 9), c = rnz(-12, 12); if (Math.abs(b) < 2 || Math.abs(c) < 2) return this.g(); var a = b * c, t = Math.random() < 0.5;

 {id: 'n03e', lv: 3, n: 'N03', nq: 3, t: 'Moyennes de relatifs', d: 'Températures, scores, soldes.', c: 'Calcule la moyenne.', a: 'Moyenne = somme des valeurs ÷ nombre de valeurs. La somme peut être négative : la moyenne aussi.',
  g: function(){ var k = rnd(0, 11), n = pick([3, 4, 5, 6]), T = [], s;
    var ctx = ['températures relevées à 6 h (en °C)', 'températures de la semaine à Oslo (en °C)', 'scores d’un jeu (en points)', 'variations d’une action en bourse (en €)', 'soldes d’un compte en fin de mois (en €)', 'écarts au par d’un golfeur', 'altitudes de points sous-marins et côtiers (en m)', 'températures d’un congélateur (en °C)', 'variations d’effectif d’un club', 'gains et pertes d’une boutique (en centaines d’€)', 'températures minimales de janvier à Montréal (en °C)', 'écarts à la moyenne d’une classe (en points)'][k];
    do { T = []; for (var i = 0; i < n; i++) T.push(rnz(-15, 12)); s = T.reduce(function(a, b){ return a + b; }, 0); } while (!M.isInt(s * 10 / n) || s >= 0 && Math.random() < 0.7);

);
// N04 : enchaîner les opérations
function f2(m){ var v; do { v = rnz(-m, m); } while (Math.abs(v) < 2); return v; }
function E(){ var t = rnd(0, 7), a = rnz(-9, 9), b = f2(9), c = f2(9), d = f2(6), q, v, st;
  switch (t){
   case 0: q = fr(a) + ' + ' + pf(b) + ' × ' + pf(c); v = a + b * c; st = ['La multiplication est prioritaire : ' + pf(b) + ' × ' + pf(c) + ' = ' + fr(b * c) + '.', fr(a) + ' + ' + pf(b * c) + ' = ' + fr(v) + '.']; break;
   case 1: q = fr(a) + ' ' + MINUS + ' ' + pf(b) + ' × ' + pf(c); v = a - b * c; st = ['Je calcule d’abord le produit : ' + pf(b) + ' × ' + pf(c) + ' = ' + fr(b * c) + '.', fr(a) + ' ' + MINUS + ' ' + pf(b * c) + ' = ' + fr(v) + '.']; break;
   case 2: q = fr(b) + ' × ' + pf(c) + ' ' + MINUS + ' ' + pf(a); v = b * c - a; st = ['Produit d’abord : ' + fr(b) + ' × ' + pf(c) + ' = ' + fr(b * c) + '.', fr(b * c) + ' ' + MINUS + ' ' + pf(a) + ' = ' + fr(v) + '.']; break;
   case 3: q = '(' + fr(a) + ' + ' + pf(b) + ') × ' + pf(c); v = (a + b) * c; st = ['Parenthèses d’abord : ' + fr(a) + ' + ' + pf(b) + ' = ' + fr(a + b) + '.', pf(a + b) + ' × ' + pf(c) + ' = ' + fr(v) + '.']; break;
   case 4: q = fr(c) + ' × (' + fr(a) + ' ' + MINUS + ' ' + pf(b) + ')'; v = c * (a - b); st = ['Parenthèses d’abord : ' + fr(a) + ' ' + MINUS + ' ' + pf(b) + ' = ' + fr(a - b) + '.', fr(c) + ' × ' + pf(a - b) + ' = ' + fr(v) + '.']; break;
   case 5: var x = rnz(-8, 8); b = rnz(-6, 6); if (Math.abs(b) < 2) return E(); var p = b * x; q = fr(a) + ' ' + MINUS + ' ' + (p < 0 ? '(' + fr(p) + ')' : fr(p)) + ' ÷ ' + pf(b); v = a - x; st = ['La division est prioritaire : ' + fr(p) + ' ÷ ' + pf(b) + ' = ' + fr(x) + '.', fr(a) + ' ' + MINUS + ' ' + pf(x) + ' = ' + fr(v) + '.']; break;
   case 6: q = fr(a) + ' × ' + pf(b) + ' + ' + pf(c) + ' × ' + pf(d); v = a * b + c * d; if (!d) return E(); st = ['Les deux produits d’abord : ' + fr(a * b) + ' et ' + fr(c * d) + '.', fr(a * b) + ' + ' + pf(c * d) + ' = ' + fr(v) + '.']; break;
   default: q = fr(a) + ' ' + MINUS + ' ' + pf(b) + ' ' + MINUS + ' ' + pf(c) + ' × ' + pf(d); if (!d) return E(); v = a - b - c * d; st = ['Le produit d’abord : ' + pf(c) + ' × ' + pf(d) + ' = ' + fr(c * d) + '.', fr(a) + ' ' + MINUS + ' ' + pf(b) + ' ' + MINUS + ' ' + pf(c * d) + ' = ' + fr(a) + ' + ' + pf(-b) + ' + ' + pf(-c * d) + ' = ' + fr(v) + '.'];
  }
  return {q: q, v: v, st: st, t: t}; }
EX.push(
 {id: 'n04a', lv: 1, n: 'N04', t: 'Priorité de la multiplication', d: 'Deux opérations.', c: 'Calcule en respectant les priorités.', a: 'Sans parenthèses, on effectue d’abord les multiplications et les divisions, puis les additions et soustractions de gauche à droite.',
  g: function(){ var e; do { e = E(); } while ([0, 1, 2, 5].indexOf(e.t) < 0); return {type: 'num', q: e.q + ' = ?', v: e.v, steps: e.st}; }},
 {id: 'n04b', lv: 2, n: 'N04', t: 'Avec des parenthèses', d: 'Les parenthèses d’abord.', c: 'Calcule.', a: 'On commence par les calculs entre parenthèses.',
  g: function(){ var e; do { e = E(); } while ([3, 4].indexOf(e.t) < 0); return {type: 'num', q: e.q + ' = ?', v: e.v, steps: e.st}; }},
 {id: 'n04c', lv: 2, n: 'N04', t: 'Trois ou quatre opérations', d: 'Produits et sommes mêlés.', c: 'Calcule.', a: 'Repère les produits, calcule-les, puis termine par les additions et soustractions.',
  g: function(){ var e; do { e = E(); } while ([6, 7].indexOf(e.t) < 0); return {type: 'num', q: e.q + ' = ?', v: e.v, steps: e.st}; }},
 {id: 'n04d', lv: 3, n: 'N04', nq: 4, t: 'Avec un trait de fraction', d: 'Numérateur et dénominateur.', c: 'Calcule. Le trait de fraction joue le rôle de parenthèses.', a: 'Calcule séparément le numérateur et le dénominateur, puis divise.',
  g: function(){ var x = rnz(-9, 9), D = rnz(-8, 8); if (Math.abs(D) < 2) return this.g(); var N = x * D;
    var a = rnz(-9, 9), b = N - a, c = rnz(-9, 9), d = c - D, nt = Math.random() < 0.5; if (!b || !d) return this.g();

 {id: 'n04e', lv: 3, n: 'N04', nq: 4, t: 'Où est l’erreur ?', d: 'Priorités mal appliquées.', c: 'Un élève a fait ce calcul. Est-il juste ?', a: 'Vérifie l’ordre des opérations : multiplication avant addition, parenthèses avant tout.',
