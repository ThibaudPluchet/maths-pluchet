<script>
(function(){
'use strict';
var rnd = M.rnd, rnz = M.rnz, pick = M.pick, shuffle = M.shuffle, fr = M.fr, pf = M.pf, cl = M.cl, sq = M.sq, SQ = M.SQ, MINUS = M.MINUS, rd = M.rd;
var poly = M.poly, mono = M.mono, gcd = M.gcd, red = M.red, ftx = M.ftx, RAC = M.RAC;
function L(a, b){ return poly({1: a, 0: b}); }
function sol1(a, b){ var r = red(-b, a); return r; }                         // solution de ax + b = 0
function fs(f){ return ftx(f); }
function sset(A){ var u = []; A.forEach(function(f){ var s = fs(f); if (u.indexOf(s) < 0) u.push(s); }); u.sort(function(p, q){ return val(p) - val(q); }); return u.length === 1 ? 'x = ' + u[0] : 'x = ' + u[0] + ' ou x = ' + u[1]; }
function val(s){ s = s.replace(MINUS, '-'); if (s.indexOf(RAC) >= 0) return (s[0] === '-' ? -1 : 1) * Math.sqrt(+s.replace(/[^0-9]/g, '')); var p = s.split('/'); return p.length > 1 ? +p[0] / +p[1] : +p[0]; }
function chs(good, bads){ var all = [good]; bads.forEach(function(b){ if (all.indexOf(b) < 0) all.push(b); }); all = all.slice(0, 4); shuffle(all); return {ch: all, ans: all.indexOf(good)}; }
var EX = [
 {id: 'n32a', lv: 1, n: 'N32', t: 'Combien de solutions ?', d: 'x² = a selon le signe de a.', c: 'Combien l’équation a-t-elle de solutions ?', a: 'x² = a : si a > 0, deux solutions √a et −√a ; si a = 0, une seule (0) ; si a < 0, aucune (un carré n’est jamais négatif).',
  g: function(){ var t = rnd(0, 2), a = t === 0 ? pick([rnd(1, 15) * rnd(1, 15), rnd(2, 50)]) : t === 1 ? 0 : -rnd(1, 50), q = 'x² = ' + fr(a);
    if (Math.random() < 0.3 && t !== 1){ var b = rnd(1, 9); q = 'x² + ' + b + ' = ' + fr(a + b); }
    return {type: 'ch', q: q, ch: ['aucune', 'une seule', 'deux'], ans: t === 0 ? 2 : t === 1 ? 1 : 0, steps: [(q.indexOf('+') > 0 ? 'On se ramène à x² = ' + fr(a) + '. ' : '') + (t === 0 ? fr(a) + ' > 0 : deux solutions, √' + fr(a) + ' et −√' + fr(a) + '.' : t === 1 ? 'x² = 0 a une seule solution : x = 0.' : fr(a) + ' < 0 : un carré n’est jamais négatif, aucune solution.')], key: q}; }},
 {id: 'n32b', lv: 2, n: 'N32', t: 'Résoudre x² = a', d: 'Racines carrées.', c: 'Choisis les solutions de l’équation.', a: 'Si a > 0, x² = a a deux solutions : x = √a et x = −√a. Pense à te ramener d’abord à x² = a (on isole x²).',
  g: function(){ var r = rnd(1, 12), sq = Math.random() < 0.7, a = sq ? r * r : pick([2, 3, 5, 6, 7, 10, 11, 13, 15, 17]), t = rnd(0, 2), q, st = [];
    var R = sq ? String(r) : RAC + a, good = 'x = ' + MINUS + R + ' ou x = ' + R;
    if (t === 0){ q = 'x² = ' + a; }
    else if (t === 1){ var b = rnd(1, 20); q = 'x² ' + MINUS + ' ' + b + ' = ' + (a - b < 0 ? MINUS + (b - a) : a - b); st.push('x² = ' + a + ' (on ajoute ' + b + ').'); if (a - b === 0) return this.g(); }
    else { var k = rnd(2, 5); q = k + 'x² = ' + k * a; st.push('x² = ' + k * a + ' ÷ ' + k + ' = ' + a + '.'); }
    st.push(a + ' > 0 : deux solutions, ' + good + '.');
    var C = chs(good, ['x = ' + R, 'x = ' + MINUS + (sq ? a : a * a) + ' ou x = ' + (sq ? a : a * a), 'x = ' + fr(a / 2), 'pas de solution']);
    return {type: 'ch', q: q, ch: C.ch, ans: C.ans, steps: st, key: q}; }},
 {id: 'n32c', lv: 2, n: 'N32', t: 'Équation produit', d: '(ax + b)(cx + d) = 0.', c: 'Choisis les solutions de l’équation.', a: 'Un produit est nul si et seulement si l’un de ses facteurs est nul : on résout ax + b = 0, puis cx + d = 0.',
  g: function(){ var a = pick([1, 1, 2, 3, 4, 5]), b = rnz(-9, 9), c = pick([1, 1, 2, 3]), d = rnz(-9, 9); if (gcd(a, b) > 1 || gcd(c, d) > 1 || a * d === b * c) return this.g();
    var s1 = sol1(a, b), s2 = sol1(c, d), q = '(' + L(a, b) + ')(' + L(c, d) + ') = 0', good = sset([s1, s2]);
    var C = chs(good, [sset([[-s1[0], s1[1]], [-s2[0], s2[1]]]), sset([red(b, 1), red(d, 1)]), sset([[-b * a, 1], [-d * c, 1]]).replace(/^/, ''), 'x = ' + fs(s1)]);
    if (C.ch.length < 3) return this.g();
    return {type: 'ch', q: q, ch: C.ch, ans: C.ans, steps: ['Un produit est nul si l’un des facteurs est nul.', L(a, b) + ' = 0 donne x = ' + fs(s1) + ' ; ' + L(c, d) + ' = 0 donne x = ' + fs(s2) + '.', 'Solutions : ' + good + '.'], key: q}; }},
 {id: 'n32d', lv: 3, n: 'N32', nq: 4, t: 'Factoriser d’abord', d: 'Se ramener à une équation produit.', c: 'Choisis les solutions de l’équation.', a: 'Passe tout dans le membre de gauche, factorise (facteur commun ou a² − b²), puis utilise la règle du produit nul. Ne divise jamais par x : tu perdrais la solution 0.',
  g: function(){ var t = rnd(0, 2), q, f1, f2, st;
    if (t === 0){ var a = rnd(1, 5), b = rnz(-12, 12); if (gcd(a, b) > 1 && a > 1) return this.g(); q = poly({2: a, 1: b}) + ' = 0'; f1 = [0, 1]; f2 = red(-b, a); st = ['x(' + L(a, b) + ') = 0', 'x = 0 ou ' + L(a, b) + ' = 0, soit x = ' + fs(f2) + '.']; }
    else if (t === 1){ var m = pick([1, 1, 2, 3]), n = rnd(1, 9); q = poly({2: m * m, 0: -n * n}) + ' = 0'; f1 = red(-n, m); f2 = red(n, m); st = ['(' + L(m, n) + ')(' + L(m, -n) + ') = 0 (a² − b² = (a + b)(a − b))', 'x = ' + fs(f1) + ' ou x = ' + fs(f2) + '.']; }
    else { var p = rnz(-6, 6), A = [rnd(1, 3), rnz(-8, 8)], B = [rnd(1, 3), rnz(-8, 8)], S = [A[0] + B[0], A[1] + B[1]]; if (!S[1] || gcd(S[0], S[1]) > 1) return this.g(); q = '(x ' + (p < 0 ? MINUS + ' ' + (-p) : '+ ' + p) + ')(' + L(A[0], A[1]) + ') + (x ' + (p < 0 ? MINUS + ' ' + (-p) : '+ ' + p) + ')(' + L(B[0], B[1]) + ') = 0'; f1 = [-p, 1]; f2 = red(-S[1], S[0]); if (f1[0] * f2[1] === f2[0] * f1[1]) return this.g(); st = ['(x ' + (p < 0 ? MINUS + ' ' + (-p) : '+ ' + p) + ')(' + L(S[0], S[1]) + ') = 0', 'x = ' + fs(f1) + ' ou x = ' + fs(f2) + '.']; }
    var good = sset([f1, f2]), C = chs(good, ['x = ' + fs(f2), sset([[-f1[0], f1[1]], [-f2[0], f2[1]]]), 'x = ' + fs(f1), sset([f1, [f2[1], f2[0] || 1]])]);
    return {type: 'ch', q: q, ch: C.ch, ans: C.ans, steps: st, key: q}; }},
 {id: 'n32e', lv: 3, n: 'N32', nq: 3, t: 'Problèmes', d: 'Aires, nombres mystères…', c: 'Lis l’énoncé et réponds.', a: 'Écris une équation (souvent x² = a ou un produit nul), résous-la, puis garde seulement les solutions qui ont un sens (une longueur est positive).',
  g: function(k){ if (k === undefined) k = rnd(0, 11); var r = rnd(3, 15), q, v, u = '', st;
    switch (k % 6){
     case 0: q = 'Un carré a une aire de ' + r * r + ' cm². Quelle est la longueur de son côté ?'; v = r; u = 'cm'; st = ['c² = ' + r * r + ', c > 0 donc c = √' + r * r + ' = ' + r + ' cm.']; break;
     case 1: q = 'Un nombre positif a pour carré ' + r * r + '. Quel est ce nombre ?'; v = r; st = ['x² = ' + r * r + ' et x > 0 : x = ' + r + '.']; break;
     case 2: var s = rnd(2, 9); q = 'Le carré d’un nombre négatif, augmenté de ' + s + ', vaut ' + (r * r + s) + '. Quel est ce nombre ?'; v = -r; st = ['x² + ' + s + ' = ' + (r * r + s) + ' donc x² = ' + r * r + '.', 'x est négatif : x = ' + MINUS + r + '.']; break;
     case 3: q = 'Un disque a une aire de ' + r * r + 'π cm². Quel est son rayon ?'; v = r; u = 'cm'; st = ['π × r² = ' + r * r + 'π, donc r² = ' + r * r + ' et r = ' + r + ' cm.']; break;
     case 4: q = 'Un rectangle a une longueur double de sa largeur et une aire de ' + 2 * r * r + ' m². Quelle est sa largeur ?'; v = r; u = 'm'; st = ['x × 2x = ' + 2 * r * r + ', donc 2x² = ' + 2 * r * r + ', x² = ' + r * r + ' et x = ' + r + ' m (x > 0).']; break;
     default: var c = rnd(2, 9); q = 'Le produit d’un nombre non nul par lui-même diminué de ' + c + ' est nul : x(x ' + MINUS + ' ' + c + ') = 0. Quel est ce nombre ?'; v = c; st = ['x = 0 ou x ' + MINUS + ' ' + c + ' = 0 ; le nombre est non nul : x = ' + c + '.'];
    }
    return {type: 'num', q: q, v: v, unit: u, steps: st, traps: k % 6 === 2 ? [[r, 'Le nombre est négatif.']] : [[r * r * (k % 6 === 4 ? 2 : 1), 'C’est le carré (ou l’aire) : il faut prendre la racine carrée.']].filter(function(t){ return t[0] !== v; }), key: 'k' + k + r}; }}
];
var NOTIONS = [{n: 'N32', t: 'Résoudre une équation produit et une équation x² = a', r: 'AB = 0 ⇔ A = 0 ou B = 0 ; x² = a a deux solutions √a et −√a si a > 0, une seule (0) si a = 0, aucune si a < 0.'}];

M.start({key: '3e-s19', EX: EX, NOTIONS: NOTIONS});
})();
</script>
