    {id: 'q4', n: 'Exercice 3', t: 'Quatrième proportionnelle', ic: '🧮', max: 4, make: function(){ return exQ4(4); }},
    {id: 'pb11', train: 'pb', n: 'Exercice 4', t: 'Problème : un tarif proportionnel', ic: '🎟️', max: 5, make: exPb11},
    {id: 'pb11', train: 'pb', n: 'Exercice 5', t: 'Problème : un tarif proportionnel', ic: '🎟️', max: 5, make: exPb11},
    {id: 'var', train: 'var', n: 'Exercice 6', t: 'Pour comprendre', ic: '🧠', max: 2, make: function(){ return exVar(11); }}]},
  n12: {num: 12, t: 'Reconnaître la proportionnalité sur un graphique', ic: '📈', parts: [
    {id: 'cours', n: 'Exercice 1', t: 'Question de cours', ic: '📖', max: 1.5, make: function(){ return exCours(12); }},
    {id: 'graphes', n: 'Exercice 2', t: 'Proportionnel ou pas ?', ic: '📈', max: 4, make: function(){ return exGraphes(4); }},
    {id: 'lire', n: 'Exercice 3', t: 'Lire un graphique', ic: '👀', max: 3, make: exLire},
    {id: 'lire', n: 'Exercice 4', t: 'Lire un graphique', ic: '👀', max: 3, make: exLire},
    {id: 'pb12', train: 'pb', n: 'Exercice 5', t: 'Quel tarif est proportionnel ?', ic: '🎟️', max: 1, make: exPb12},
    {id: 'pb12', train: 'pb', n: 'Exercice 6', t: 'Quel tarif est proportionnel ?', ic: '🎟️', max: 1, make: exPb12},
    {id: 'var', train: 'var', n: 'Exercice 7', t: 'Pour comprendre', ic: '🧠', max: 2, make: function(){ return exVar(12); }}]}
};
function cls(got, max){ return eq(got, max) ? 'ok' : got >= max * .6 ? 'mid' : 'ko'; }
function stat(p, t){ if (window.stat) window.stat(p, t); }

function menu(){
  tomenu.hidden = true; kbar.hidden = true; main.innerHTML = '';
  var best = store(KEY + 'best');
  main.appendChild(el('h2', 'cat', 'Le jour J'));
  var g0 = el('div', 'grid'), t0 = el('button', 'tile big'); t0.type = 'button';
  t0.appendChild(el('span', 'ic', '📝'));
  var s0 = el('span'); s0.appendChild(el('b', null, 'Évaluation blanche')); s0.appendChild(el('span', 'd', 'Un sujet complet comme le jour J, noté sur 20 avec le vrai barème, sans limite de temps. Un nouveau sujet à chaque fois (jamais les questions de ton vrai sujet) : recommence autant de fois que tu veux !'));
  if (best) s0.appendChild(el('span', 'rec', 'Ta meilleure note : ' + best + '/20'));
  t0.appendChild(s0); t0.onclick = function(){ location.hash = 'blanc'; }; g0.appendChild(t0); main.appendChild(g0);
  // Les évaluations par notion sont proposées sur le site élèves (liens #n11, #n12), pas dans ce menu
  main.appendChild(el('h2', 'cat', 'S’entraîner exercice par exercice'));
  var g = el('div', 'grid');
  EX.forEach(function(x){
    var b = el('button', 'tile'); b.type = 'button'; b.appendChild(el('span', 'ic', x.ic));
    var s = el('span'); s.appendChild(el('b', null, x.n + ' · ' + x.t)); s.appendChild(el('span', 'd', x.d + (x.extra ? ' (non noté)' : ' (' + pts(x.max) + ' pt' + (x.max > 1 ? 's' : '') + ')')));
    var rec = store(KEY + x.id); if (rec) s.appendChild(el('span', 'rec', 'Dernier essai : ' + rec + '/' + pts(x.max)));
    b.appendChild(s); b.onclick = function(){ location.hash = x.id; }; g.appendChild(b);
  });
  main.appendChild(g);
}

function exPanel(x, inst){
  var p = el('section', 'panel'), h = el('div', 'ph');
  h.appendChild(el('h2', null, x.ic + ' ' + x.n + ' · ' + x.t)); var sc = el('span', 'pts', pts(x.max) + ' pt' + (x.max > 1 ? 's' : '')); h.appendChild(sc);
  p.appendChild(h);
  var c = {cours: 'Le jour J, tu rédiges toi-même (0,5 point par élément juste).', croix: 'Pour chaque tableau : les deux produits en croix avec leur résultat (0,5 point), la conclusion (0,5 point). Écris par exemple 3 × 7 = 21.',
    q4: 'Pour chaque tableau : le calcul (0,5 point), puis le nombre manquant (0,5 point). Écris les divisions avec ÷.', graphes: 'Pour chaque graphique : la réponse (0,5 point) et la justification (0,5 point).',
    lire: 'Chaque lecture : 0,5 point ; « coefficient de proportionnalité » : 0,5 point ; le calcul et son résultat : 0,5 point chacun.',
    pb: 'Écris les divisions avec ÷. Chaque réponse se termine par une phrase sur ta copie.', pb11: 'Écris les divisions avec ÷. Chaque réponse se termine par une phrase sur ta copie.', pb12: 'La réponse (0,5 point) et la justification (0,5 point).',
    bonus: 'Ce point s’ajoute à la note (sans dépasser 20).', var: x.counted ? 'Des questions posées autrement, pour vérifier que tu as compris (1 point chacune).' : 'Ces questions ne sont pas comptées dans la note sur 20 : elles servent à vérifier que tu as compris, au-delà des exercices types.'}[x.id];
  if (c) p.appendChild(el('p', 'consigne', c));
  p.appendChild(inst.box); if (inst.note) p.appendChild(el('p', 'consigne', inst.note));
  return {p: p, sc: sc};
}

function train(id){
  var x = byId(id); if (!x){ menu(); return; }
  stat(PATH + id, 'Préparer l’évaluation 4e E02 · ' + x.t);
  tomenu.hidden = false; main.innerHTML = '';
  var inst = x.make(), P = exPanel(x, inst); main.appendChild(P.p);
  if (/[?&]test\b/.test(location.search)) window.__parts = [{x: x, inst: inst, P: P}];
  var row = el('div', 'row'), bv = el('button', 'btn main', 'Corriger'); bv.type = 'button'; row.appendChild(bv); P.p.appendChild(row);
  bv.onclick = function(){
    var got = inst.check(); bv.remove(); kbar.hidden = true;
    P.sc.textContent = pts(got) + ' / ' + pts(x.max); P.sc.className = 'pts ' + cls(got, x.max);
    store(KEY + id, pts(got));
    var r = el('div', 'res ' + cls(got, x.max), pts(got) + ' / ' + pts(x.max) + (eq(got, x.max) ? ' : parfait !' : ''));
    r.appendChild(el('small', null, eq(got, x.max) ? 'Tu es prêt(e) pour cet exercice. Essaie l’évaluation blanche !' : 'Lis la correction sous chaque question, puis recommence : les nombres changent à chaque fois.'));
    P.p.appendChild(r);
    var r2 = el('div', 'row'), b1 = el('button', 'btn main', '🔁 Recommencer (nouveaux nombres)'), b2 = el('button', 'btn', 'Menu');
    b1.onclick = function(){ train(id); window.scrollTo(0, 0); }; b2.onclick = function(){ location.hash = ''; };
    r2.appendChild(b1); r2.appendChild(b2); P.p.appendChild(r2);
  };
  window.scrollTo(0, 0);
}

function blanc(mode){
  mode = mode || 'blanc';
  var N = NOT[mode], key = N ? KEY + mode + ':' : KEY, list = N ? N.parts.map(function(x){ var y = {}; for (var k in x) y[k] = x[k]; y.counted = true; return y; }) : EX;
  stat(PATH + mode, 'Préparer l’évaluation 4e E02 · ' + (N ? 'évaluation N' + N.num : 'évaluation blanche'));
  tomenu.hidden = false; main.innerHTML = '';
  if (N) main.appendChild(el('h2', 'cat', 'Évaluation N' + N.num + ' · ' + N.t + ' · 35 min'));
  var essai = parseInt(store(key + 'essais') || '0', 10) + 1;
  var bar = el('div', 'timerbar'), tm = el('span', 'timer', 'Sujet n° ' + essai), bend = el('button', 'btn main', 'Rendre ma copie'); bend.type = 'button';
  bar.appendChild(tm); bar.appendChild(bend); main.appendChild(bar);
  main.appendChild(el('p', 'consigne', 'Calculatrice autorisée. Prends ton temps : il n’y a pas de limite. Rédige comme sur ta copie, puis touche « Rendre ma copie ».'));
  var parts = list.map(function(x){ var inst = x.make(), P = exPanel(x, inst); main.appendChild(P.p); return {x: x, inst: inst, P: P}; });
  if (/[?&]test\b/.test(location.search)) window.__parts = parts;   // tests automatiques (copie parfaite)
  var done = false, t0 = Date.now();
  bend.onclick = function(){ finish(); };
  function finish(){
    if (done) return; done = true; kbar.hidden = true;
    var total = 0, bonus = 0, res = [];
    parts.forEach(function(o){
      var got = o.inst.check(); o.P.sc.textContent = pts(got) + ' / ' + pts(o.x.max); o.P.sc.className = 'pts ' + cls(got, o.x.max);
      if (o.x.extra){} else if (o.x.id === 'bonus') bonus = got; else total += got; res.push({x: o.x, got: got});
    });
    // le jour J, 1 point sur 20 récompense le soin de la copie : ici, les 19 autres points sont ramenés sur 20
    var maxN = list.reduce(function(s, x){ return s + (x.extra || x.id === 'bonus' ? 0 : x.max); }, 0);
    var note = Math.min(20, total / maxN * 20 + bonus);
    note = Math.round(note * 4) / 4;
    var best = parseFloat((store(key + 'best') || '0').replace(',', '.'));
    if (note > best) store(key + 'best', pts(note));
    store(key + 'essais', String(essai));
    var hist = (store(key + 'notes') || '').split(';').filter(Boolean).concat([pts(note)]).slice(-6); store(key + 'notes', hist.join(';'));
    bar.remove();
    var sum = el('section', 'panel');
    sum.appendChild(el('div', 'note', pts(note) + '/20'));
    var used = Math.max(1, Math.round((Date.now() - t0) / 60000));
    sum.appendChild(el('p', 'consigne', '⏱️ Tu as mis ' + used + ' min' + (used > 35 ? ' : le jour J, tu auras 35 min, entraîne-toi à aller un peu plus vite.' : ' : le jour J, tu auras 35 min, c’est bon !')));
    sum.lastChild.style.textAlign = 'center';
    sum.appendChild(el('p', 'consigne', 'Sujet n° ' + essai + '. ' + (note > best && essai > 1 ? '🏆 Ta meilleure note !' : best ? 'Ta meilleure note : ' + pts(Math.max(best, note)) + '/20.' : '') + (hist.length > 1 ? ' Tes dernières notes : ' + hist.join(' → ') + '.' : '')));
    sum.lastChild.style.textAlign = 'center';
    var again = el('div', 'row'), ba = el('button', 'btn main', '🔁 Recommencer avec un nouveau sujet'); ba.type = 'button'; ba.onclick = function(){ blanc(mode); }; again.appendChild(ba); sum.appendChild(again);
    var bl = el('div', 'bilan');
    res.forEach(function(r){
      var ln = el('div', 'bl'), left = el('span'); left.appendChild(el('b', null, r.x.n + ' · ' + r.x.t + ' : '));
      left.appendChild(el('span', 'pts ' + cls(r.got, r.x.max), pts(r.got) + '/' + pts(r.x.max) + (r.x.extra ? ' (non noté)' : '')));
      ln.appendChild(left);
      if (!eq(r.got, r.x.max) && r.x.id !== 'bonus' && !r.x.extra){ var b = el('button', 'btn', 'À retravailler →'); b.type = 'button'; b.onclick = function(){ location.hash = r.x.train || r.x.id; }; ln.appendChild(b); }
      bl.appendChild(ln);
    });
    sum.appendChild(bl);
    sum.appendChild(el('p', 'consigne', (N ? 'Note ramenée sur 20 : ' + pts(total) + ' points sur ' + pts(maxN) + '. ' : 'Le jour J, 1 point sur 20 récompense le soin de ta copie : ici, tes ' + pts(total) + ' points sur 19 sont ramenés sur 20. ') + 'Sur ta vraie copie, termine chaque réponse par une phrase. Les corrections détaillées sont sous chaque exercice.'));
    var r2 = el('div', 'row'), b2 = el('button', 'btn', 'Menu'); b2.onclick = function(){ location.hash = ''; }; r2.appendChild(b2); sum.appendChild(r2);
    main.insertBefore(sum, main.firstChild);
    var foot = el('section', 'panel'); foot.appendChild(el('p', 'consigne', 'Tu as lu toutes les corrections ? Entraîne-toi encore : un nouveau sujet est tiré à chaque fois, tu peux recommencer autant de fois que tu veux.'));
    var fr = el('div', 'row'), fb1 = el('button', 'btn main', '🔁 Recommencer avec un nouveau sujet'), fb2 = el('button', 'btn', 'Menu');
    fb1.onclick = function(){ blanc(mode); }; fb2.onclick = function(){ location.hash = ''; }; fr.appendChild(fb1); fr.appendChild(fb2); foot.appendChild(fr); main.appendChild(foot);
    window.scrollTo(0, 0);
    stat(PATH + mode + '/note', (N ? 'Évaluation N' + N.num : 'Évaluation blanche') + ' 4e E02 rendue');
  }
  window.scrollTo(0, 0);
}

function route(){
  var id = location.hash.slice(1);
  if (id === 'blanc' || NOT[id]) blanc(id); else if (id) train(id); else menu();
}
tomenu.onclick = function(){ location.hash = ''; };
try { if (document.referrer && new URL(document.referrer).pathname.replace(/index\.html$/, '') === new URL('../', location.href).pathname) document.getElementById('home').href = document.referrer; } catch(e){}
window.addEventListener('hashchange', route);
route();
})();
