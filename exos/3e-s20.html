<script src="moteur.js"></script>
<script>
(function(){
'use strict';
var rnd = M.rnd, rnz = M.rnz, pick = M.pick, shuffle = M.shuffle, fr = M.fr, pf = M.pf, cl = M.cl, sq = M.sq, SQ = M.SQ, MINUS = M.MINUS, rd = M.rd;
// figure de Thalès : A sommet commun, M sur (AB), N sur (AC), (MN) // (BC). k < 0 : papillon
function figTh(L, k){ var A = L[0], B = L[1], C = L[2], Mn = L[3], Nn = L[4];
  var th = Math.random() * 2 * Math.PI, al = (pick([1, -1])) * (0.45 + Math.random() * 0.6), lb = 1, lc = 0.7 + Math.random() * 0.6;
  var P = {}; P[A] = [0, 0]; P[B] = [lb * Math.cos(th), lb * Math.sin(th)]; P[C] = [lc * Math.cos(th + al), lc * Math.sin(th + al)];
  P[Mn] = [k * P[B][0], k * P[B][1]]; P[Nn] = [k * P[C][0], k * P[C][1]];
  var ks = Object.keys(P), xs = ks.map(function(n){ return P[n][0]; }), ys = ks.map(function(n){ return P[n][1]; });
  var W = 320, H = 220, pad = 30, mnx = Math.min.apply(0, xs), mxx = Math.max.apply(0, xs), mny = Math.min.apply(0, ys), mxy = Math.max.apply(0, ys);
  var s2 = Math.min((W - 2 * pad) / (mxx - mnx || 1), (H - 2 * pad) / (mxy - mny || 1)), ox = (W - s2 * (mxx - mnx)) / 2 - s2 * mnx, oy = (H - s2 * (mxy - mny)) / 2 - s2 * mny;
  function m(n){ return [ox + s2 * P[n][0], oy + s2 * P[n][1]]; }
  var G = [0, 0]; ks.forEach(function(n){ G[0] += m(n)[0] / ks.length; G[1] += m(n)[1] / ks.length; });
  function f(v){ return v.toFixed(1); }
  function seg(a, b, w){ var p = m(a), q = m(b); return '<line x1="' + f(p[0]) + '" y1="' + f(p[1]) + '" x2="' + f(q[0]) + '" y2="' + f(q[1]) + '" style="stroke:currentColor;stroke-width:' + (w || 1.7) + '"/>'; }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="fig" role="img" aria-label="Configuration de Thalès">';
  if (k > 0){ s += seg(A, k > 1 ? Mn : B) + seg(A, k > 1 ? Nn : C); } else { s += seg(Mn, B) + seg(Nn, C); }
  s += seg(B, C) + seg(Mn, Nn);
  ks.forEach(function(n){ var p = m(n), c = P[A], d = [p[0] - G[0], p[1] - G[1]], l = Math.hypot(d[0], d[1]) || 1;
    if (n === A){ var u = [(m(B)[0] + m(C)[0]) / 2 - p[0], (m(B)[1] + m(C)[1]) / 2 - p[1]], lu = Math.hypot(u[0], u[1]) || 1; d = k > 0 ? [-u[0], -u[1]] : [-u[1], u[0]]; l = lu; }
    s += '<circle cx="' + f(p[0]) + '" cy="' + f(p[1]) + '" r="2.4" style="fill:currentColor"/><text x="' + f(p[0] + d[0] / l * 14) + '" y="' + f(p[1] + d[1] / l * 14) + '" class="pt" text-anchor="middle" dominant-baseline="central">' + n + '</text>'; });
  return s + '</svg>'; }
function rec(){ var k, b, c; do { k = pick([0.25, 0.4, 0.5, 0.6, 0.75, 0.8, 1.5, 2, 2.5, 3, 1.2]); b = rnd(2, 15); c = rnd(2, 15); } while (b === c || !M.isInt(cl(k * b) * 10) || !M.isInt(cl(k * c) * 10));
  var par = Math.random() < 0.5, AM = cl(k * b), AN = cl(k * c);
  if (!par){ var dl = pick([-1, 1]) * pick([0.1, 0.2, 0.3, 0.5, 1]); AN = cl(AN + dl); if (AN <= 0 || (k < 1 ? AN >= c : AN <= c)) return rec(); }
  return {k: k, AB: b, AC: c, AM: AM, AN: AN, par: Math.abs(AM * c - AN * b) < 1e-9}; }
function recQ(pap){ var L = M.letters(5), D = rec(), u = pick(['cm', 'm', 'mm']);
  var A = L[0], B = L[1], C = L[2], Mn = L[3], Nn = L[4], kf = pap ? -D.k : D.k;
  if (pap && D.k > 1.5) return recQ(pap);
  var where = pap ? 'Les points ' + Mn + ', ' + A + ', ' + B + ' sont alignés, ainsi que ' + Nn + ', ' + A + ', ' + C + ', dans le même ordre' : (D.k < 1 ? Mn + ' ∈ [' + A + B + '] et ' + Nn + ' ∈ [' + A + C + ']' : B + ' ∈ [' + A + Mn + '] et ' + C + ' ∈ [' + A + Nn + ']');
  var q = where + '. ' + A + Mn + ' = ' + fr(D.AM) + ' ' + u + ', ' + A + B + ' = ' + fr(D.AB) + ' ' + u + ', ' + A + Nn + ' = ' + fr(D.AN) + ' ' + u + ', ' + A + C + ' = ' + fr(D.AC) + ' ' + u + '. Les droites (' + Mn + Nn + ') et (' + B + C + ') sont-elles parallèles ?';
  var p1 = cl(D.AM * D.AC), p2 = cl(D.AN * D.AB);
  var st = ['Je compare ' + A + Mn + '/' + A + B + ' et ' + A + Nn + '/' + A + C + ' avec les produits en croix : ' + fr(D.AM) + ' × ' + fr(D.AC) + ' = ' + fr(p1) + ' et ' + fr(D.AN) + ' × ' + fr(D.AB) + ' = ' + fr(p2) + '.'];
  if (D.par) st.push('Les produits sont égaux, donc ' + A + Mn + '/' + A + B + ' = ' + A + Nn + '/' + A + C + '. De plus les points sont alignés dans le même ordre. D’après la réciproque du théorème de Thalès, (' + Mn + Nn + ') // (' + B + C + ').');
  else st.push('Les produits sont différents, donc ' + A + Mn + '/' + A + B + ' ≠ ' + A + Nn + '/' + A + C + '. Si les droites étaient parallèles, ces rapports seraient égaux (théorème de Thalès) : les droites (' + Mn + Nn + ') et (' + B + C + ') ne sont pas parallèles.');
  return {type: 'ch', q: q, svg: figTh(L, kf), ch: ['Oui, elles sont parallèles', 'Non, elles ne sont pas parallèles'], ans: D.par ? 0 : 1, steps: st, key: q}; }
var EX = [
 {id: 'n33a', lv: 1, n: 'N33', t: 'Les rapports sont-ils égaux ?', d: 'Produits en croix.', c: 'Les deux quotients sont-ils égaux ?', a: 'a/b = c/d lorsque a × d = b × c (produits en croix). Tu peux aussi calculer chaque quotient.',
  g: function(){ var b = rnd(2, 15), k = pick([0.5, 0.4, 0.6, 0.75, 1.5, 2, 0.8, 2.5, 3]), d = rnd(2, 15), a = cl(k * b), c = cl(k * d), eq = Math.random() < 0.5;
    if (!eq) c = cl(c + pick([-1, 1]) * pick([0.1, 0.2, 0.5, 1])); if (c <= 0 || b === d) return this.g();
    var p1 = cl(a * d), p2 = cl(b * c), ok = Math.abs(p1 - p2) < 1e-9;
    return {type: 'ch', q: fr(a) + '/' + b + ' et ' + fr(c) + '/' + d, ch: ['Égaux', 'Pas égaux'], ans: ok ? 0 : 1, steps: [fr(a) + ' × ' + d + ' = ' + fr(p1) + ' et ' + b + ' × ' + fr(c) + ' = ' + fr(p2) + (ok ? ' : les produits en croix sont égaux, les quotients aussi.' : ' : les produits en croix sont différents, les quotients ne sont pas égaux.')]}; }},
 {id: 'n33b', lv: 2, n: 'N33', t: 'Parallèles ou pas ? (triangles emboîtés)', d: 'Réciproque du théorème de Thalès.', c: 'Réponds en t’appuyant sur un calcul. La figure n’est pas en vraie grandeur.', a: 'Compare les rapports AM/AB et AN/AC. S’ils sont égaux (et les points alignés dans le même ordre), les droites sont parallèles (réciproque de Thalès) ; sinon elles ne le sont pas.',
  g: function(){ return recQ(false); }},
 {id: 'n33c', lv: 2, n: 'N33', nq: 4, t: 'Parallèles ou pas ? (papillon)', d: 'Les droites se croisent.', c: 'Réponds en t’appuyant sur un calcul. La figure n’est pas en vraie grandeur.', a: 'Même méthode : compare les rapports, et vérifie que les points sont alignés dans le même ordre.',
  g: function(){ return recQ(true); }},
 {id: 'n33d', lv: 3, n: 'N33', nq: 3, t: 'Problèmes', d: 'Étagères, toits, ponts…', c: 'Lis l’énoncé et réponds en t’appuyant sur un calcul.', a: 'Repère les deux droites sécantes et les deux droites dont on se demande si elles sont parallèles, puis compare les rapports.',
  g: function(k){ if (k === undefined) k = rnd(0, 11); var S = [
    ['Un pupitre a deux pieds qui se croisent en O. Sur un pied, OA = ', ' cm et OB = ', ' cm ; sur l’autre, OC = ', ' cm et OD = ', ' cm, avec A et C en haut, B et D au sol. Le plateau [AC] est-il parallèle au sol [BD] ?', 'cm', 1],
    ['Sur le toit d’une maison, une poutre [MN] relie les deux pans : SM = ', ' m, SA = ', ' m, SN = ', ' m, SB = ', ' m, avec M ∈ [SA] et N ∈ [SB]. La poutre est-elle parallèle au plancher [AB] ?', 'm', 0],
    ['Dans un triangle de signalisation ABC, on trace un trait [MN] avec M ∈ [AB] et N ∈ [AC] : AM = ', ' cm, AB = ', ' cm, AN = ', ' cm, AC = ', ' cm. Le trait est-il parallèle à [BC] ?', 'cm', 0],
    ['Une table pliante a deux pieds qui se coupent en O : OA = ', ' cm, OB = ', ' cm, OC = ', ' cm, OD = ', ' cm (A, O, B alignés et C, O, D alignés, dans le même ordre). Le plateau (AC) est-il parallèle au sol (BD) ?', 'cm', 1]][k % 4];
    var D = rec(); if (S[6] === 0 && D.k > 1 || S[6] === 1 && D.k > 1.5) return this.g(k);
    var m = S[5] === 'm' ? 1 : 10, a = cl(D.AM * m), b = cl(D.AB * m), c = cl(D.AN * m), d = cl(D.AC * m);
    var p1 = cl(a * d), p2 = cl(c * b), par = Math.abs(p1 - p2) < 1e-9;
    var nm = S[6] === 1 ? ['OA', 'OB', 'OC', 'OD'] : (k % 4 === 1 ? ['SM', 'SA', 'SN', 'SB'] : ['AM', 'AB', 'AN', 'AC']);
    var q = S[0] + fr(a) + S[1] + fr(b) + S[2] + fr(c) + S[3] + fr(d) + S[4];
    return {type: 'ch', q: q, ch: ['Oui', 'Non'], ans: par ? 0 : 1, steps: ['Je compare ' + nm[0] + '/' + nm[1] + ' et ' + nm[2] + '/' + nm[3] + ' : ' + fr(a) + ' × ' + fr(d) + ' = ' + fr(p1) + ' et ' + fr(c) + ' × ' + fr(b) + ' = ' + fr(p2) + '.', par ? 'Les rapports sont égaux et les points sont alignés dans le même ordre : d’après la réciproque du théorème de Thalès, les droites sont parallèles.' : 'Les rapports ne sont pas égaux : d’après le théorème de Thalès, les droites ne sont pas parallèles.'], key: 'k' + k + q}; }}
];
EX.push(
 {id: 'n33e', lv: 2, n: 'N33', nq: 4, t: 'Quelle conclusion ?', d: 'Rédiger correctement.', c: 'Choisis la phrase de conclusion correcte.', a: 'Rapports égaux et points alignés dans le même ordre : réciproque de Thalès, les droites sont parallèles. Rapports différents : d’après le théorème de Thalès (sa contraposée), elles ne sont pas parallèles.',
  g: function(){ var L = M.letters(5), A = L[0], B = L[1], C = L[2], Mn = L[3], Nn = L[4], eq = Math.random() < 0.5;
    var q = A + Mn + '/' + A + B + (eq ? ' = ' : ' ≠ ') + A + Nn + '/' + A + C + ', et les points ' + A + ', ' + Mn + ', ' + B + ' et ' + A + ', ' + Nn + ', ' + C + ' sont alignés dans le même ordre.';
    var c1 = 'D’après la réciproque du théorème de Thalès, (' + Mn + Nn + ') // (' + B + C + ').', c2 = 'D’après le théorème de Thalès, (' + Mn + Nn + ') // (' + B + C + ').', c3 = 'Les droites (' + Mn + Nn + ') et (' + B + C + ') ne sont pas parallèles (sinon, d’après le théorème de Thalès, les rapports seraient égaux).', c4 = 'D’après la réciproque du théorème de Pythagore, (' + Mn + Nn + ') // (' + B + C + ').';
    var ch = shuffle([c1, c2, c3, c4]);
    return {type: 'ch', q: q, ch: ch, ans: ch.indexOf(eq ? c1 : c3), steps: [eq ? 'Pour démontrer que des droites sont parallèles, on utilise la réciproque du théorème de Thalès.' : 'Les rapports sont différents : les droites ne sont pas parallèles.'], key: L.join('') + eq}; }}
);
var NOTIONS = [{n: 'N33', t: 'Démontrer que deux droites sont parallèles (réciproque de Thalès)', r: 'si AM/AB = AN/AC et si les points sont alignés dans le même ordre, alors (MN) // (BC) ; si les rapports sont différents, les droites ne sont pas parallèles.'}];

M.start({key: '3e-s20', EX: EX, NOTIONS: NOTIONS});
})();
</script>
