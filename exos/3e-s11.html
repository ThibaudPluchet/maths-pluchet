<script src="moteur.js"></script>
<script>
(function(){
'use strict';
var rnd = M.rnd, rnz = M.rnz, pick = M.pick, shuffle = M.shuffle, fr = M.fr, cl = M.cl, rd = M.rd;
var SENS = {h: 'dans le sens des aiguilles d’une montre', a: 'dans le sens inverse des aiguilles d’une montre'};
function rot(p, o, ang, s){ var x = p[0] - o[0], y = p[1] - o[1], r;
  if (ang === 180) r = [-x, -y]; else if (ang === 90) r = s === 'a' ? [-y, x] : [y, -x]; else r = s === 'a' ? [y, -x] : [-y, x];   // 270 = 90 dans l’autre sens
  return [o[0] + r[0], o[1] + r[1]]; }
function same(a, b){ return a[0] === b[0] && a[1] === b[1]; }
function inG(p){ return Math.abs(p[0]) <= 5 && Math.abs(p[1]) <= 5; }
// quadrillage de −5 à 5, points nommés et polygones
function grid(pts, polys){
  var u = 26, W = 11 * u + 20, o = 10 + 5.5 * u, s = '<svg viewBox="0 0 ' + W + ' ' + W + '" class="fig" role="img" aria-label="Figure sur quadrillage">', v;
  function X(x){ return o + x * u; } function Y(y){ return o - y * u; }
  for (v = -5; v <= 5; v++){ s += '<line class="gr" x1="' + X(v) + '" y1="' + Y(-5.4) + '" x2="' + X(v) + '" y2="' + Y(5.4) + '"/><line class="gr" x1="' + X(-5.4) + '" y1="' + Y(v) + '" x2="' + X(5.4) + '" y2="' + Y(v) + '"/>'; }
  (polys || []).forEach(function(P){ s += '<polygon points="' + P.p.map(function(q){ return X(q[0]) + ',' + Y(q[1]); }).join(' ') + '" style="fill:' + (P.fill || 'var(--soft)') + ';stroke:' + (P.stroke || 'var(--ink)') + ';stroke-width:2;fill-opacity:.7"/>';
    if (P.t){ var cx = P.p.reduce(function(a, q){ return a + q[0]; }, 0) / P.p.length, cy = P.p.reduce(function(a, q){ return a + q[1]; }, 0) / P.p.length; s += '<text x="' + X(cx) + '" y="' + Y(cy) + '" text-anchor="middle" dominant-baseline="central" style="font-size:14px">' + P.t + '</text>'; } });
  pts.forEach(function(p){ s += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="' + (p[3] ? 5 : 4) + '" style="fill:' + (p[3] ? 'var(--ink)' : 'var(--accent)') + '"/><text x="' + (X(p[0]) + 8) + '" y="' + (Y(p[1]) - 9) + '" style="font-size:15px">' + p[2] + '</text>'; });
  return s + '</svg>';
}
function rq(){ var ang = pick([90, 90, 180, 270]), s = pick(['h', 'a']); return {ang: ang === 270 ? 90 : ang, s: ang === 270 ? (s === 'h' ? 'a' : 'h') : s}; }
function rtxt(o, R){ return 'la rotation de centre ' + o + ' et d’angle ' + R.ang + '°' + (R.ang === 180 ? '' : ' ' + SENS[R.s]); }
var EX = [
 {id: 'n17a', lv: 1, n: 'N17', t: 'Image d’un point', d: 'Sur un quadrillage.',
  c: 'Choisis l’image du point par la rotation.', a: 'L’image A′ de A par la rotation de centre O et d’angle 90° vérifie OA′ = OA et l’angle AOA′ = 90°, en tournant dans le sens indiqué. Sur un quadrillage, le déplacement « 2 à droite, 1 en haut » devient « 1 à gauche, 2 en haut » (90° sens inverse des aiguilles d’une montre).',
  g: function(){ var O = [rnd(-1, 1), rnd(-1, 1)], A, R = rq(), B, tries = 0;
    do { A = [rnz(-4, 4), rnz(-4, 4)]; B = rot(A, O, R.ang, R.s); } while ((!inG(B) || same(A, O)) && ++tries < 50);
    var cands = [B, rot(A, O, 90, R.s === 'h' ? 'a' : 'h'), rot(A, O, 180), [2 * O[0] - A[0], A[1]], [A[0], 2 * O[1] - A[1]]].filter(function(p, i, arr){ return inG(p) && !same(p, A) && arr.findIndex(function(q){ return same(p, q); }) === i; }).slice(0, 4);
    var names = shuffle(['B', 'C', 'D', 'E'].slice(0, cands.length)), good = names[0];
    var pts = cands.map(function(p, i){ return [p[0], p[1], names[i]]; }).concat([[A[0], A[1], 'A'], [O[0], O[1], 'O', 1]]);
    var ch = names.slice().sort();
    return {type: 'ch', q: 'Quelle est l’image du point A par ' + rtxt('O', R) + ' ?', svg: grid(pts), ch: ch, ans: ch.indexOf(good), key: A.join() + O.join() + R.ang + R.s,
      steps: ['On tourne le segment [OA] de ' + R.ang + '° autour de O' + (R.ang === 180 ? ' (c’est la symétrie de centre O)' : ' ' + SENS[R.s]) + ' : on arrive en ' + good + ', avec O' + good + ' = OA.']}; }},
 {id: 'n17b', lv: 2, n: 'N17', t: 'Image d’une figure', d: 'Retrouver la bonne image.',
  c: 'Choisis la figure image par la rotation (la figure de départ est en couleur, O est le centre).', a: 'Fais tourner un sommet après l’autre autour de O. L’image a la même forme et les mêmes dimensions que la figure de départ : seule son orientation change.',
  g: function(){ var O = [0, 0], R = rq(), F, img, tries = 0;
    var key = function(P){ return P.map(function(p){ return p.join(); }).sort().join('|'); }, cands;
    function box(P){ var xs = P.map(function(p){ return p[0]; }), ys = P.map(function(p){ return p[1]; }); return [Math.min.apply(0, xs), Math.max.apply(0, xs), Math.min.apply(0, ys), Math.max.apply(0, ys)]; }
    function apart(P, Q){ var a = box(P), b = box(Q); return a[1] <= b[0] || b[1] <= a[0] || a[3] <= b[2] || b[3] <= a[2]; }
    do { var b0 = [rnd(1, 3) * pick([1, -1]), rnd(1, 3) * pick([1, -1])], sx = b0[0] > 0 ? 1 : -1, sy = b0[1] > 0 ? 1 : -1;
      F = [b0, [b0[0] + sx * pick([2, 3]), b0[1]], [b0[0], b0[1] + sy * pick([1, 2, 3])]]; img = F.map(function(p){ return rot(p, O, R.ang, R.s); });
      var others = shuffle([F.map(function(p){ return rot(p, O, 90, R.s === 'h' ? 'a' : 'h'); }), F.map(function(p){ return [-p[0], p[1]]; }), F.map(function(p){ return [p[0], -p[1]]; }), F.map(function(p){ return rot(p, O, 180); })]);
      cands = [img];
      others.forEach(function(P){ if (P.every(inG) && cands.concat([F]).every(function(c){ return key(c) !== key(P) && apart(c, P); }) && cands.length < 3) cands.push(P); });
    } while ((!F.concat(img).every(inG) || !apart(F, img) || cands.length < 3) && ++tries < 200);
    var nums = shuffle(['1', '2', '3'].slice(0, cands.length)), polys = [{p: F, fill: 'var(--accent)', stroke: 'var(--accent)'}].concat(cands.map(function(P, i){ return {p: P, t: nums[i]}; }));
    var ch = nums.slice().sort();
    return {type: 'ch', q: 'Quelle figure est l’image de la figure colorée par ' + rtxt('O', R) + ' ?', svg: grid([[0, 0, 'O', 1]], polys), ch: ch.map(function(n){ return 'Figure ' + n; }), ans: ch.indexOf(nums[0]), key: key(F) + R.ang + R.s,
      steps: ['Chaque sommet tourne de ' + R.ang + '° autour de O' + (R.ang === 180 ? '' : ' ' + SENS[R.s]) + ' : on obtient la figure ' + nums[0] + '.']}; }},
 {id: 'n17c', lv: 2, n: 'N17', t: 'Quelle rotation ?', d: 'Retrouver l’angle et le sens.',
  c: 'Le point B est l’image de A par une rotation de centre O. Choisis cette rotation.', a: 'Mesure l’angle AOB (90° = quart de tour, 180° = demi-tour) et regarde dans quel sens on tourne pour aller de A à B.',
  g: function(){ var O = [rnd(-1, 1), rnd(-1, 1)], R = rq(), A, B, t = 0; do { A = [rnz(-4, 4), rnz(-4, 4)]; B = rot(A, O, R.ang, R.s); } while ((!inG(B) || same(A, O)) && ++t < 50);
    var opts = ['90° dans le sens des aiguilles d’une montre', '90° dans le sens inverse des aiguilles d’une montre', '180°', '45° dans le sens des aiguilles d’une montre'], good = R.ang === 180 ? opts[2] : opts[R.s === 'h' ? 0 : 1];
    var ch = shuffle(opts.slice());
    return {type: 'ch', q: 'Quelle rotation de centre O transforme A en B ?', svg: grid([[A[0], A[1], 'A'], [B[0], B[1], 'B'], [O[0], O[1], 'O', 1]]), ch: ch, ans: ch.indexOf(good), key: A.join() + O.join() + R.ang + R.s,
      steps: ['L’angle AOB mesure ' + R.ang + '°' + (R.ang === 180 ? ' (A, O, B alignés : demi-tour).' : ', et on tourne ' + SENS[R.s] + '.')]}; }},
 {id: 'n17d', lv: 2, n: 'N17', t: 'Avec des coordonnées', d: 'Rotation de centre l’origine.',
  c: 'Choisis les coordonnées de l’image.', a: 'Autour de l’origine O : un quart de tour dans le sens inverse des aiguilles d’une montre envoie (x ; y) sur (−y ; x) ; dans le sens des aiguilles, sur (y ; −x) ; un demi-tour sur (−x ; −y).',
  g: function(){ var A = [rnz(-6, 6), rnz(-6, 6)], R = rq(), B = rot(A, [0, 0], R.ang, R.s), c = function(p){ return '(' + fr(p[0]) + ' ; ' + fr(p[1]) + ')'; };
    var all = [B, rot(A, [0, 0], 90, R.s === 'h' ? 'a' : 'h'), [-A[0], A[1]], [A[0], -A[1]], [A[1], A[0]], rot(A, [0, 0], 180)], ch = [];
    all.forEach(function(p){ if (ch.indexOf(c(p)) < 0 && ch.length < 4) ch.push(c(p)); }); ch = shuffle(ch);
    return {type: 'ch', q: 'Dans un repère d’origine O, A a pour coordonnées ' + c(A) + '. Quelles sont les coordonnées de l’image de A par ' + rtxt('O', R) + ' ?', ch: ch, ans: ch.indexOf(c(B)), key: c(A) + R.ang + R.s,
      steps: [R.ang === 180 ? '(x ; y) devient (−x ; −y) : ' + c(B) + '.' : R.s === 'a' ? '(x ; y) devient (−y ; x) : ' + c(B) + '.' : '(x ; y) devient (y ; −x) : ' + c(B) + '.']}; }},
 {id: 'n17e', lv: 2, n: 'N17', t: 'Vrai ou faux ?', d: 'Les propriétés de la rotation.',
  c: 'Chaque affirmation est-elle vraie ou fausse ?', a: 'Une rotation conserve les longueurs, les angles, les aires et l’alignement. Le centre est le seul point qui ne bouge pas (sauf pour un angle de 0° ou 360°).',
  g: function(){ var L = [
      ['Une rotation conserve les longueurs.', true, 'La figure tourne sans être déformée.'],
      ['Une rotation conserve les aires.', true, 'La figure image est superposable à la figure de départ.'],
      ['Une rotation peut agrandir une figure.', false, 'Elle conserve les longueurs : c’est un agrandissement qui change les dimensions.'],
      ['La rotation de centre O et d’angle 180° est la symétrie de centre O.', true, 'Un demi-tour autour de O, c’est la symétrie centrale de centre O.'],
      ['Par une rotation de centre O, le point O a pour image lui-même.', true, 'Le centre ne bouge pas.'],
      ['Par une rotation, l’image d’une droite est un cercle.', false, 'L’image d’une droite est une droite (l’alignement est conservé).'],
      ['Une rotation de 90° dans le sens des aiguilles d’une montre est la même que 270° dans le sens inverse.', true, 'Un quart de tour dans un sens = trois quarts de tour dans l’autre.'],
      ['Si A′ est l’image de A par une rotation de centre O, alors OA′ = OA.', true, 'A et A′ sont sur un même cercle de centre O.'],
      ['Une rotation conserve les angles.', true, 'Les angles de la figure image sont égaux à ceux de la figure de départ.'],
      ['La rotation de centre O et d’angle 90° est une symétrie axiale.', false, 'Une symétrie axiale retourne la figure ; une rotation la fait tourner.'],
      ['Pour définir une rotation, il suffit de donner son centre.', false, 'Il faut aussi l’angle et le sens.'],
      ['Si A′ est l’image de A par la rotation de centre O d’angle 60°, alors l’angle AOA′ mesure 60°.', true, 'C’est la définition de l’angle de la rotation.']];
    var i = rnd(0, L.length - 1), p = L[i]; return {type: 'ch', q: p[0], ch: ['Vrai', 'Faux'], ans: p[1] ? 0 : 1, steps: [(p[1] ? 'Vrai. ' : 'Faux. ') + p[2]], key: 'vf' + i}; }},
 {id: 'n17f', lv: 3, n: 'N17', nq: 3, t: 'Problèmes', d: 'Horloges, roues, rosaces.',
  c: 'Lis l’énoncé et calcule l’angle (ou la grandeur) demandé.', a: 'Un tour complet fait 360°. Une figure qui revient à l’identique en tournant n fois fait des rotations de 360° / n.',
  g: function(k){ if (k === undefined) k = rnd(0, 11); var a, n, v, q, st;
    function out(lab, u){ return {type: 'num', q: q, lab: lab, unit: u === undefined ? '°' : u, v: v, x: v, steps: st, key: 'k' + k}; }
    if (k === 0){ n = rnd(1, 11) * 5; v = n * 6; q = 'En ' + n + ' minutes, de quel angle tourne la grande aiguille d’une horloge ?'; st = ['En 60 min : 360°, donc 6° par minute.', n + ' × 6 = ' + v + '°']; return out('angle ='); }
    if (k === 1){ n = rnd(1, 11); v = n * 30; q = 'En ' + n + ' heure' + (n > 1 ? 's' : '') + ', de quel angle tourne la petite aiguille d’une horloge ?'; st = ['En 12 h : 360°, donc 30° par heure.', n + ' × 30 = ' + v + '°']; return out('angle ='); }
    if (k === 2){ n = pick([4, 5, 6, 8, 9, 10, 12, 15, 18, 20, 24, 36]); v = 360 / n; q = 'Une grande roue a ' + n + ' nacelles régulièrement réparties. Quel est l’angle de la plus petite rotation qui amène une nacelle à la place de la suivante ?'; st = ['360 ÷ ' + n + ' = ' + fr(v) + '°']; return out('angle ='); }
    if (k === 3){ n = pick([3, 4, 5, 6, 8, 10, 12]); v = 360 / n; q = 'Une rosace a ' + n + ' pétales identiques régulièrement disposés. Quel est l’angle de la plus petite rotation qui la laisse inchangée ?'; st = ['360 ÷ ' + n + ' = ' + fr(v) + '°']; return out('angle ='); }
    if (k === 4){ a = pick([30, 36, 40, 45, 60, 72, 90, 120]); v = 360 / a; q = 'Un motif est reproduit par des rotations successives de ' + a + '° autour d’un même centre, jusqu’à revenir au départ. Combien de motifs obtient-on en tout ?'; st = ['360 ÷ ' + a + ' = ' + v + ' motifs']; return out('nombre =', 'motifs'); }
    if (k === 5){ n = pick([3, 4, 5, 6]); v = 360 / n; q = 'Les pales d’une éolienne : il y en a ' + n + ', identiques et régulièrement réparties. De quel angle faut-il tourner pour qu’une pale prenne la place de la suivante ?'; st = ['360 ÷ ' + n + ' = ' + fr(v) + '°']; return out('angle ='); }
    if (k === 6){ var h = rnd(1, 11), m = pick([0, 0, 30]); var aH = h * 30 + m * 0.5, aM = m * 6; v = Math.abs(aH - aM); if (v > 180) v = 360 - v;
      q = 'Quel est le plus petit angle formé par les deux aiguilles d’une horloge à ' + h + ' h ' + (m ? m : '00') + ' ?'; st = ['Petite aiguille : ' + h + ' × 30 + ' + m + ' × 0,5 = ' + fr(aH) + '° depuis midi ; grande aiguille : ' + aM + '°.', 'Écart : ' + fr(v) + '°']; return out('angle ='); }
    if (k === 7){ n = rnd(2, 6); v = n * 90; q = 'Une figure subit ' + n + ' quarts de tour successifs autour du même centre, dans le même sens. De quel angle a-t-elle tourné en tout ?'; st = [n + ' × 90 = ' + v + '°' + (v >= 360 ? ' (' + (v % 360) + '° de plus qu’un nombre entier de tours)' : '')]; return out('angle ='); }
    if (k === 8){ a = pick([20, 24, 30, 36, 40, 45, 60]); n = 360 / a; v = n; q = 'Un manège fait tourner chaque cheval de ' + a + '° entre deux arrêts. Combien d’arrêts faut-il pour faire un tour complet ?'; st = ['360 ÷ ' + a + ' = ' + n]; return out('arrêts =', ''); }
    if (k === 9){ n = rnd(1, 5) * 10; v = n * 6; q = 'L’aiguille des secondes tourne pendant ' + n + ' secondes. De quel angle a-t-elle tourné ?'; st = ['60 s pour 360°, donc 6° par seconde.', n + ' × 6 = ' + v + '°']; return out('angle ='); }
    if (k === 10){ a = pick([90, 120, 135, 150, 210, 240, 270]); v = 360 - a; q = 'Une rotation de ' + a + '° dans le sens des aiguilles d’une montre équivaut à une rotation de combien de degrés dans le sens inverse ?'; st = ['360 − ' + a + ' = ' + v + '°']; return out('angle ='); }
    n = pick([5, 6, 8, 10, 12]); v = 360 / n; q = 'Un enjoliveur de roue a ' + n + ' rayons identiques. Quelle est la plus petite rotation (en degrés) qui le laisse inchangé ?'; st = ['360 ÷ ' + n + ' = ' + fr(v) + '°']; return out('angle ='); }}
];
var NOTIONS = [{n: 'N17', t: 'Caractériser et construire la rotation d’une figure', r: 'une rotation est définie par un centre, un angle et un sens ; elle conserve les longueurs, les angles, les aires et l’alignement.'}];
M.start({key: '3e-s11', EX: EX, NOTIONS: NOTIONS});
})();
</script>
