<script>
(function(){
'use strict';
var rnd = M.rnd, rnz = M.rnz, pick = M.pick, shuffle = M.shuffle, fr = M.fr, pf = M.pf, cl = M.cl, sq = M.sq, SQ = M.SQ, MINUS = M.MINUS, rd = M.rd;

function irr(m){ var d, n; m = m || 9; do { d = rnd(2, m); n = rnd(1, m + 3); } while (gcd(n, d) !== 1 || n === d); return [n, d]; }
function sg(f){ return Math.random() < 0.5 ? [-f[0], f[1]] : f; }

 {id: 'n42a', lv: 1, n: 'N42', t: 'Multiplier deux fractions', d: 'Numérateurs entre eux, dénominateurs entre eux.', c: 'Calcule et donne le résultat sous forme irréductible.', a: 'a/b × c/d = (a × c)/(b × d) : on multiplie les numérateurs entre eux et les dénominateurs entre eux, puis on simplifie.',
  g: function(){ var a = irr(7), b = irr(7), n = a[0] * b[0], d = a[1] * b[1], r = red(n, d); if (r[1] === 1) return this.g();

 {id: 'n42b', lv: 2, n: 'N42', t: 'Simplifier avant de multiplier', d: 'Avec des signes et un entier.', c: 'Calcule et donne le résultat sous forme irréductible.', a: 'Décompose les numérateurs et les dénominateurs pour simplifier avant d’effectuer. Règle des signes comme pour les nombres relatifs. Un entier n s’écrit n/1.',
  g: function(){ var t = rnd(0, 2), a, b, q, n, d, st;

 {id: 'n42c', lv: 1, n: 'N42', t: 'L’inverse d’un nombre', d: 'Le nombre qui multiplié donne 1.', c: 'Donne l’inverse du nombre.', a: 'L’inverse de a/b est b/a ; l’inverse d’un entier n est 1/n. Un nombre et son inverse ont le même signe.',

 {id: 'n42d', lv: 2, n: 'N42', t: 'Diviser par une fraction', d: 'Multiplier par l’inverse.', c: 'Calcule et donne le résultat sous forme irréductible.', a: 'Diviser par un nombre non nul, c’est multiplier par son inverse : a/b ÷ c/d = a/b × d/c.',

 {id: 'n42e', lv: 2, n: 'N42', nq: 4, t: 'Vrai ou faux ?', d: 'Règles de calcul.', c: 'L’égalité est-elle vraie ?', a: 'Vérifie en effectuant le calcul correctement. Attention : on n’additionne jamais les dénominateurs, et diviser revient à multiplier par l’inverse.',

];

 {id: 'n43a', lv: 2, n: 'N43', t: 'Priorités opératoires', d: 'Une addition et une multiplication.', c: 'Calcule et donne le résultat sous forme irréductible.', a: 'La multiplication (ou la division) est prioritaire sur l’addition et la soustraction.',
  g: function(){ var a = irr(6), b = irr(5), c = irr(5), op = pick(['+', MINUS]), o2 = pick(['×', '÷']), sw = Math.random() < 0.5;

 {id: 'n43b', lv: 3, n: 'N43', nq: 4, t: 'Avec des parenthèses', d: 'Calcul en plusieurs étapes.', c: 'Calcule et donne le résultat sous forme irréductible.', a: 'On effectue d’abord les calculs entre parenthèses, puis les multiplications et divisions, enfin les additions et soustractions.',

);
var PB = [

 {id: 'n44a', lv: 1, n: 'N44', t: 'Prendre une fraction d’une quantité', d: 'Les 3/4 de 60.', c: 'Calcule.', a: 'Prendre a/b d’une quantité, c’est la multiplier par a/b : on divise par b puis on multiplie par a.',
  g: function(k){ if (k === undefined) k = rnd(0, 5); var f = irr(8); if (f[0] >= f[1] || f[0] < 2) return this.g(k); var Q = f[1] * rnd(2, k === 2 || k === 5 ? 60 : 15), v = Q / f[1] * f[0], P = PB[k];

 {id: 'n44b', lv: 2, n: 'N44', nq: 4, t: 'Fraction d’une fraction', d: 'Les 2/3 des 3/5.', c: 'Lis l’énoncé et donne la réponse sous forme de fraction irréductible.', a: 'Prendre une fraction d’une fraction revient à les multiplier.',

 {id: 'n44c', lv: 3, n: 'N44', nq: 3, t: 'Problèmes en plusieurs étapes', d: 'Partages successifs.', c: 'Lis l’énoncé et calcule.', a: 'Calcule étape par étape : ce qui reste correspond à 1 moins la fraction utilisée. Une fraction « du reste » se multiplie par la fraction restante.',
