function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
var main = document.getElementById('main');

  sec.appendChild(h); sec.appendChild(el('p', 'theme', e.theme));
  if (!e.seances){ sec.appendChild(el('p', 'bientot', 'En préparation : les ressources arriveront avant l’été.')); }
  else e.seances.forEach(function(s){
    var d = el('div', 'seance'); d.appendChild(el('h3', null, s.t));
    var g = el('div', 'res');
    s.r.forEach(function(r){
      if (!r.u){ g.appendChild(el('span', 'soon', r.t)); return; }
      var a = el('a', r.type, (r.type === 'video' ? '▶ ' : r.type === 'exo' ? '✎ ' : '◆ ') + r.t);

      g.appendChild(a);
    });
    d.appendChild(g); sec.appendChild(d);
  });
  if (e.corrige){
    var cd = el('div', 'seance'); cd.appendChild(el('h3', null, 'Corrigé de l’étape'));
    var cg = el('div', 'res'), ca = el('a', 'corr', '✔ Corrigé de l’étape ' + e.n + ' (PDF)');
    ca.href = e.corrige; ca.target = '_blank'; ca.rel = 'noopener';
    ca.onclick = function(){ if (window.stat) stat('vacances 4e · corrigé étape ' + e.n, 'Corrigé étape ' + e.n + ' (cahier de vacances)', true); };
    cg.appendChild(ca); cd.appendChild(cg);
    cd.appendChild(el('p', 'bientot', 'Cherche d’abord seul, puis vérifie tes réponses ici.'));
    sec.appendChild(cd);
  }

});

// ----- Vérification du mot de passe de Lupin -----
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function norm(t){ return (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z]/g, ''); }
function sha(t){
  if (!(window.crypto && crypto.subtle)) return Promise.reject();
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); });
}
function badge(h){ if (!h.querySelector('.valide')) h.appendChild(el('span', 'valide', '✔ Étape validée')); }
function formMdp(e, h){
  var f = el('form', 'mdp'), id = 'mdp' + e.n;
  var lab = el('label', null, '🔑 Ton mot de passe de l’étape ' + e.n + ' : tape-le pour vérifier'); lab.htmlFor = id;
  var inp = el('input'); inp.id = id; inp.autocomplete = 'off'; inp.spellcheck = false; inp.maxLength = 20; inp.placeholder = '• • • • •';
  var bt = el('button', null, 'Vérifier'); bt.type = 'submit';
  var msg = el('p', 'msg'); msg.setAttribute('role', 'status');
  f.appendChild(lab); f.appendChild(inp); f.appendChild(bt); f.appendChild(msg);
  if (store('mp:vac4e' + e.n) === '1') badge(h);
  var det = el('div', 'det');
  f.appendChild(det);
  f.onsubmit = function(ev){
    ev.preventDefault();
    var t = norm(inp.value), L = e.mdp.lettres;
    det.textContent = '';
    if (!t){ msg.className = 'msg ko'; msg.textContent = 'Tape d’abord ton mot de passe !'; return; }
    Promise.all(L.map(function(x, i){ return t[i] ? sha('etape' + e.n + ':' + (i + 1) + ':' + t[i]) : Promise.resolve(''); })).then(function(H){
      var ok = H.map(function(x, i){ return x.slice(0, 16) === L[i]; });
      ok.forEach(function(b, i){
        var c = el('span', b ? 'bon' : 'faux');
        c.appendChild(el('b', null, t[i] || '?'));
        c.appendChild(document.createTextNode((b ? '✔ ' : '✘ ') + e.mdp.src[i]));
        det.appendChild(c);
      });
      var nb = ok.filter(Boolean).length;
      if (nb === L.length && t.length === L.length){
        msg.className = 'msg ok'; msg.textContent = 'Bravo, c’est le bon mot de passe ! L’étape ' + e.n + ' est validée. Rendez-vous à l’étape suivante.';
        store('mp:vac4e' + e.n, '1'); badge(h);
        if (window.stat) stat('vacances 4e · étape ' + e.n + ' validée', 'Cahier de vacances : étape ' + e.n + ' validée', true);
      } else {
        var faux = e.mdp.src.filter(function(x, i){ return !ok[i]; });
        msg.className = 'msg ko';
        msg.textContent = (t.length > L.length ? 'Ton mot est trop long : le mot de passe a ' + L.length + ' lettres. ' : '') +
          nb + ' lettre' + (nb > 1 ? 's' : '') + ' sur ' + L.length + ' correcte' + (nb > 1 ? 's' : '') + '. ' +
          (faux.length ? 'Reprends : ' + faux.join(', ') + '.' : '');
      }
    }, function(){ msg.className = 'msg ko'; msg.textContent = 'Vérification impossible sur ce navigateur.'; });
  };
  return f;
}
function cible(){
  var m = location.hash.match(/^#etape(\d)/);
  document.querySelectorAll('.etape').forEach(function(s){ s.classList.remove('cible'); });
  if (m){ var s = document.getElementById('etape' + m[1]); if (s){ s.classList.add('cible'); s.scrollIntoView(); } }
}
window.addEventListener('hashchange', cible); cible();
if (window.stat) stat('/cahier-vacances-4e' + location.hash, 'Cahier de vacances ' + location.hash);
})();
