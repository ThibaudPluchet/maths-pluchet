<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automatismes – M. Pluchet</title>
<meta name="description" content="S'entraîner aux automatismes de la partie 1 du brevet de mathématiques, sans calculatrice.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f5bd3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b2333; --muted:#596277; --line:#e2ded3;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e8eefc; --new:#d6336c; --gridc:#e9e5da;
  --ok:#1e7a46; --oks:#e3f4ea; --ko:#b3261e; --kos:#fbe6e4; --mid:#b85c00; --mids:#fbeedd;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#13161d; --card:#1b1f28; --ink:#eaedf3; --muted:#a3abbc; --line:#2b313e;
    --accent:#86a4ff; --accent-ink:#0f1320; --soft:#222a3e; --new:#ff7aa5; --gridc:#1a1e27;
    --ok:#6fd49a; --oks:#173326; --ko:#ff8a80; --kos:#3a1f1d; --mid:#f0a050; --mids:#33261a; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
header.wrap{padding-top:22px;padding-bottom:12px}
.back{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:10px;font-size:15px}
.back:hover{text-decoration:underline}
h1{font:700 clamp(30px,7vw,42px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:15px}
.picker{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.picker-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lvl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (min-width:600px){ .lvl + .lvl{margin-left:6px;padding-left:12px;border-left:1px solid var(--line)} }
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font:700 16px "Atkinson Hyperlegible",sans-serif;cursor:pointer;min-height:44px;min-width:60px}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main.wrap{padding-top:22px;padding-bottom:56px;display:flex;flex-direction:column;gap:20px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 15px "Atkinson Hyperlegible",sans-serif;padding:9px 14px;border-radius:9px;cursor:pointer;min-height:42px}
.tabs button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.kicker{font:700 13px "Atkinson Hyperlegible",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.kicker::before{content:"✦ ";color:var(--accent)}
h2{font:700 clamp(21px,5vw,26px)/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:14px}
.intro{color:var(--muted);margin:0;font-size:15px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font:700 16px "Atkinson Hyperlegible",sans-serif;cursor:pointer;min-height:46px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:700;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
/* thèmes */
.themes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.theme{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);min-height:62px}
.theme b{display:block;font:700 15px/1.2 "Bricolage Grotesque",system-ui,sans-serif}
.theme span{font-size:13px;color:var(--muted)}
.theme.on{border:2px solid var(--accent);background:var(--soft)}
.theme.off{opacity:.55}
/* liste des automatismes */
.skills{display:flex;flex-direction:column;gap:6px}
.skill{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;min-height:56px}
.skill:hover{border-color:var(--accent)}
.skill .t{flex:1;min-width:0}
.skill .t b{display:block;font-size:16px;line-height:1.25}
.skill .t span{font-size:13.5px;color:var(--muted)}
.skill.locked{cursor:default;opacity:.55}
.skill.locked:hover{border-color:var(--line)}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.y{background:var(--ok)} .dots i.n{background:var(--ko)}
.chip{font:700 12px "Atkinson Hyperlegible",sans-serif;border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none}
.chip.new{background:var(--soft);color:var(--muted)} .chip.weak{background:var(--kos);color:var(--ko)}
.chip.prog{background:var(--mids);color:var(--mid)} .chip.ok{background:var(--oks);color:var(--ok)}
details.more{margin-top:6px} details.more summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:700;padding:6px 0}
/* question */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-weight:700;color:var(--muted);font-size:15px}
.score b{color:var(--ok)}
.qcard{background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:20px;box-shadow:0 6px 24px -14px var(--accent)}
.qnum{font:700 13px "Atkinson Hyperlegible",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px}
.q{font-size:clamp(19px,4.6vw,23px);line-height:1.6;margin:0 0 16px}
.q i,.corr i,.meth i,.feedback i{font-family:"Times New Roman",Georgia,serif;font-size:1.08em}
.nw{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .12em;font-size:.95em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
sup{font-size:.68em;line-height:0}
.nlist{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px}
.nlist span{background:var(--soft);border-radius:10px;padding:4px 12px;display:inline-flex;align-items:center;min-height:44px}
.blank{color:var(--accent)}
svg.droite{display:block;width:100%;max-width:560px;height:auto;margin-top:10px;color:var(--ink)}
svg.droite .dl{font:700 17px "Atkinson Hyperlegible",sans-serif;fill:var(--ink)}
svg.droite .dA{font:italic 700 19px Georgia,serif;fill:var(--accent)}
svg.droite .dp{fill:var(--accent)}
.answer{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer .lab{font-size:20px;font-weight:700}
.answer input{font:700 20px "Atkinson Hyperlegible",sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:48px;width:min(260px,100%)}
.answer input:focus{border-color:var(--accent);outline:none}
.answer input.sm{width:110px}
.answer input.exp{width:72px;font-size:16px;min-height:38px;align-self:flex-start;margin-top:-10px}
.answer .ten{font-size:20px;font-weight:700}
.answer.done input{background:transparent}
.frin{display:inline-flex;flex-direction:column;align-items:center;gap:5px}
.frin[hidden]{display:none}
.frin input{width:120px;text-align:center;min-height:44px;padding:6px 10px}
.frin .bar{display:block;width:136px;height:3px;border-radius:2px;background:var(--ink)}
.answer input[hidden]{display:none}
.keys .fbtn{display:inline-flex;align-items:center;gap:6px;font-size:15px;padding:0 12px}
.keys .fbtn .fr{font-size:11px;line-height:1}
.keys .fbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.syms{display:flex;gap:8px}
.syms button{width:58px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 24px "Atkinson Hyperlegible",sans-serif;cursor:pointer}
.syms button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.keys button{min-width:44px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px "Atkinson Hyperlegible",sans-serif;cursor:pointer;padding:0 10px}
.keys button i{font-family:"Times New Roman",Georgia,serif}
.err{color:var(--ko);font-size:15px;font-weight:700;margin:8px 0 0;min-height:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:17px}
.feedback.ok{background:var(--oks)} .feedback.ko{background:var(--kos)}
.feedback .v{font:700 18px "Atkinson Hyperlegible",sans-serif;margin:0 0 6px}
.feedback.ok .v{color:var(--ok)} .feedback.ko .v{color:var(--ko)}
.feedback p{margin:6px 0 0}
.meth{color:var(--ink)}
.meth b:first-child{color:var(--muted)}
/* épreuve */
.exambar{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin:-10px 0 0}
.exambar .row{justify-content:space-between}
.timer{font:700 24px "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ko)}
.eq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.eq .q{font-size:clamp(18px,4.4vw,21px);margin-bottom:12px}
.eq.ok{border-left:6px solid var(--ok)} .eq.ko{border-left:6px solid var(--ko)}
.res{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big{font:700 54px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--accent)}
.mine{font-size:15px;color:var(--muted);margin-top:8px}
.mine b{color:var(--ink)}
/* mode classe */
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opts label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.opts select{font:700 16px "Atkinson Hyperlegible",sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.checks{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:6px}
.checks label{display:flex;gap:10px;align-items:center;font-size:15px;padding:6px 4px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.proj{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:30px 30px}
.proj[hidden]{display:none}
.ptop{display:flex;align-items:center;gap:12px;padding:14px 22px;flex-wrap:wrap}
.ptop .pn{font:700 clamp(18px,2.2vw,28px) "Bricolage Grotesque",system-ui,sans-serif;flex:1}
.ptop .pt{font:700 clamp(24px,3.2vw,44px) "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.pbar{height:8px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--accent);width:0}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2vh 6vw;overflow:auto}
.proj{--ps:1}
.pq{font-size:calc(clamp(26px,4.2vw,64px) * var(--ps));line-height:1.45;max-width:1500px}
.pq svg.droite{max-width:min(92vw,calc(1100px * var(--ps)))}
.pq svg.droite .dl{font-size:17px}
.pq .nlist span{min-height:0;padding:.1em .5em}
.pans{margin-top:4vh;font-size:calc(clamp(24px,3.6vw,54px) * var(--ps));color:var(--ok);font-weight:700}
.pmeth{margin-top:2vh;font-size:calc(clamp(17px,2vw,30px) * var(--ps));color:var(--muted);max-width:1500px;line-height:1.5}
.pend{text-align:center}
.pend h2{font-size:clamp(34px,5vw,72px)}
.pall{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(calc(420px * var(--ps)),1fr));font-size:calc(clamp(16px,1.5vw,24px) * var(--ps))}
.pall .eq .q{font-size:inherit}
.pall .corr{color:var(--ok);font-weight:700}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:48px;height:48px;font:700 18px "Atkinson Hyperlegible",sans-serif;cursor:pointer;padding:0 14px}
.icon:hover{border-color:var(--accent)}
.fsz{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:3px}
.fsz .icon{border:0;height:40px;min-width:44px;padding:0 8px}
.fsz .icon .s{font-size:14px}
.fsz .icon .b{font-size:22px}
.fsz .pc{font:700 14px "Atkinson Hyperlegible",sans-serif;color:var(--muted);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
footer.wrap{color:var(--muted);font-size:14px;padding-top:18px;padding-bottom:40px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="wrap">
  <a class="back" id="back" href="index.html">← Mes documents</a>
  <h1>Automatismes</h1>
  <p class="sub">Brevet, partie 1 · 20 minutes · sans calculatrice · réponses courtes, sans justification</p>
</header>
<nav class="picker" id="pickwrap" aria-label="Classe"><div class="wrap picker-row" id="picker"></div></nav>
<main class="wrap" id="main"><div class="empty">Chargement…</div></main>
<footer class="wrap">Questions tirées au hasard à partir de la liste officielle des automatismes du brevet. Ta progression est enregistrée sur cet appareil uniquement.</footer>
<div class="proj" id="proj" hidden></div>
<script src="auto-gen.js"></script>
<script>
(function(){
'use strict';
var A = window.AUTO, main = document.getElementById('main'), picker = document.getElementById('picker'), proj = document.getElementById('proj');
var D = {classes:{'4e':['4e3','4e4','4e5'], '3e':['3eB','3eD','3eE']}, niveaux:{}};
var EXAM_N = 9, EXAM_MIN = 20;

function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function html(tag, cls, h){ var e = el(tag, cls); e.innerHTML = h; return e; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function levelOf(c){ for (var l in D.classes) if (D.classes[l].indexOf(c) > -1) return l; return ''; }
function find(c){ c = (c || '').toLowerCase(); for (var l in D.classes) for (var i = 0; i < D.classes[l].length; i++) if (D.classes[l][i].toLowerCase() === c) return D.classes[l][i]; return ''; }

var hashCls = decodeURIComponent(location.hash.slice(1)).split('/')[0];
var locked = '', cls = '', view = 'train', seenOnly = store('auto:vu') !== '0', tags = {};
document.getElementById('back').href = 'index.html' + location.hash;
window.addEventListener('hashchange', function(){ location.reload(); });

/* ---------- automatismes disponibles pour la classe ---------- */
function lv(){ return levelOf(cls) || '3e'; }
function ctx(all){ return {lv: lv(), has: function(t){ return all || !seenOnly || !!tags[t]; }}; }
function computeTags(){
  var titles = [];
  (D.niveaux[lv()] || []).forEach(function(s){ s.notions.forEach(function(n){ if (!n.cls || n.cls.indexOf(cls) > -1) titles.push(n.titre); }); });
  tags = A.tagsFrom(lv(), titles);
}
function allGens(){ var r = []; A.THEMES.forEach(function(t){ r = r.concat(t.gens); }); return r; }
function available(g){ return !seenOnly || g.req.every(function(t){ return tags[t]; }); }
function availGens(){ return allGens().filter(available); }
function genById(id){ return allGens().filter(function(g){ return g.id === id; })[0]; }
function make(g){ var q = g.gen(ctx()); q.gid = g.id; q.titre = g.titre; return q; }

/* ---------- progression (sur cet appareil) ---------- */
function progKey(){ return 'auto:prog:' + (cls || 'libre'); }
function loadProg(){ try { return JSON.parse(store(progKey()) || '{}') || {}; } catch(e){ return {}; } }
function record(id, ok){ var p = loadProg(); (p[id] = p[id] || []).push(ok ? 1 : 0); if (p[id].length > 10) p[id] = p[id].slice(-10); store(progKey(), JSON.stringify(p)); }
function status(id, p){
  var h = (p || loadProg())[id] || [], last = h.slice(-5), okn = last.reduce(function(s, x){ return s + x; }, 0);
  if (!h.length) return {k:'new', t:'Pas encore tenté', h:last};
  if (h.length >= 4 && okn >= last.length - 1) return {k:'ok', t:'Acquis', h:last};
  if (okn / last.length < 0.6) return {k:'weak', t:'À revoir', h:last};
  return {k:'prog', t:'En progrès', h:last};
}
function dots(h){ var d = el('span','dots'); d.setAttribute('aria-hidden','true'); for (var i = 0; i < 5; i++){ var x = el('i'); if (i < h.length) x.className = h[i] ? 'y' : 'n'; d.appendChild(x); } return d; }

/* ---------- sélecteur de classe (adresse sans #) ---------- */
function buildPicker(){
  if (locked){ document.getElementById('pickwrap').hidden = true; return; }
  Object.keys(D.classes).forEach(function(l){
    if (!D.classes[l].length) return;
    var g = el('div','lvl');
    D.classes[l].forEach(function(c){
      var b = el('button','pill',c); b.dataset.c = c;
      b.onclick = function(){ cls = c; store('classe', c); computeTags(); stopAll(); render(); };
      g.appendChild(b);
    });
    picker.appendChild(g);
  });
}

/* ---------- zone de réponse ---------- */
function insertAt(inp, txt){
  var s = inp.selectionStart == null ? inp.value.length : inp.selectionStart, e = inp.selectionEnd == null ? s : inp.selectionEnd;
  inp.value = inp.value.slice(0, s) + txt + inp.value.slice(e); inp.focus(); inp.setSelectionRange(s + txt.length, s + txt.length);
}
function textInput(cls2, label){ var i = el('input', cls2 || ''); i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false; i.setAttribute('autocapitalize','off'); i.setAttribute('autocorrect','off'); i.setAttribute('aria-label', label || 'Ta réponse'); return i; }
function answerBox(q, onEnter){
  var box = el('div'), row = el('div','answer'), a = q.ans, get, inputs = [], symVal = '', fmode = false, fracOK = false, setFrac, fbtn;
  box.appendChild(row);
  if (q.pre) row.appendChild(html('span','lab', q.pre));
  if (a.k === 'sym'){
    var sy = el('div','syms'); sy.setAttribute('role','group'); sy.setAttribute('aria-label','Symbole');
    ['<','=','>'].forEach(function(s){
      var b = el('button', null, s); b.type = 'button'; b.setAttribute('aria-pressed','false');
      b.onclick = function(){ symVal = s; [].forEach.call(sy.children, function(x){ x.setAttribute('aria-pressed', x === b); }); };
      sy.appendChild(b); inputs.push(b);
    });
    row.appendChild(sy); get = function(){ return symVal; };
  } else if (a.k === 'sci'){
    var m = textInput('sm','Nombre décimal'), e = textInput('exp','Exposant');
    row.appendChild(m); row.appendChild(el('span','ten','× 10')); row.appendChild(e);
    inputs.push(m, e); get = function(){ return [m.value, e.value]; };
  } else if (a.k === 'pow'){
    var p = textInput('exp','Exposant'); row.appendChild(el('span','ten','10')); row.appendChild(p);
    inputs.push(p); get = function(){ return p.value; };
  } else {
    var t = textInput(a.k === 'fn' ? 'sm' : ''); row.appendChild(t); inputs.push(t); get = function(){ return t.value; };
    // réponse numérique : saisie possible sous forme de fraction (numérateur au-dessus du trait, dénominateur en dessous)
    if (a.k === 'num' && a.form !== 'int'){

  inputs.forEach(function(i){ if (i.tagName === 'INPUT') i.addEventListener('keydown', function(ev){ if (ev.key === 'Enter'){ ev.preventDefault(); ev.stopPropagation(); onEnter && onEnter(); } }); });
  if (a.form === 'frac' && fracOK) setTimeout(function(){ setFrac(true); if (matchMedia('(pointer:coarse)').matches) document.activeElement.blur(); }, 0);
  var err = el('p','err'); err.setAttribute('role','alert'); box.appendChild(err);

    focus: function(){ var i = inputs.filter(function(x){ return x.tagName === 'INPUT' && !x.hidden && !(x.parentNode && x.parentNode.hidden); })[0]; if (i && !matchMedia('(pointer:coarse)').matches) i.focus(); },

function shown(q, raw){

/* ---------- S'entraîner : questions une à une ---------- */
function practice(opt){
  stopAll(); main.innerHTML = '';
  var done = 0, good = 0, lastId = null;
  function nextGen(){
    var av = availGens();
    if (opt.mode === 'one') return genById(opt.id);
    var p = loadProg(), pool = [];
    av.forEach(function(g){
      var w = opt.mode === 'weak' ? {weak:6, prog:3, new:1, ok:0.3}[status(g.id, p).k] : 1;
      if (g.id === lastId && av.length > 1) w = 0;
      pool.push([g, w]);
    });
    var tot = pool.reduce(function(s, x){ return s + x[1]; }, 0), r = Math.random() * tot;
    for (var i = 0; i < pool.length; i++){ r -= pool[i][1]; if (r <= 0) return pool[i][0]; }
    return pool[pool.length - 1][0];
  }
  var top = el('div','qtop'), back = el('button','btn','← Automatismes'), sc = html('span','score','');
  back.onclick = function(){ render(); };
  top.appendChild(back); top.appendChild(sc); main.appendChild(top);
  var holder = el('div'); main.appendChild(holder);
  function upd(){ sc.innerHTML = done ? '<b>' + good + '</b> juste' + (good > 1 ? 's' : '') + ' sur ' + done : ''; }
  function ask(){
    var g = nextGen(); lastId = g.id;
    var q = make(g), card = el('section','qcard'), answered = false;
    card.appendChild(html('p','qnum', opt.mode === 'one' ? 'Question ' + (done + 1) : g.titre));
    if (opt.mode === 'one') card.insertBefore(html('h2', null, g.titre), card.firstChild);
    card.appendChild(html('div','q', q.html));
    var ab = answerBox(q, act); card.appendChild(ab.el);
    var acts = el('div','actions'), ok = el('button','btn primary','Valider'), skip = el('button','btn','Je ne sais pas');
    acts.appendChild(ok); acts.appendChild(skip); card.appendChild(acts);
    holder.innerHTML = ''; holder.appendChild(card); ab.focus();
    function finish(res){
      answered = true; done++; if (res.ok) good++; record(g.id, res.ok); upd();
      ab.disable(); skip.remove(); ok.textContent = 'Question suivante →';
      card.appendChild(feedback(q, res)); ok.focus();
    }
    function act(){
      if (answered){ ask(); return; }
      var res = A.check(q.ans, ab.get());
      if (res.invalid){ ab.err.textContent = res.msg; return; }
      ab.err.textContent = ''; finish(res);
    }
    ok.onclick = act;
    skip.onclick = function(){ if (!answered) finish({ok:false, skip:true}); };
    card.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' && answered && ev.target.tagName !== 'BUTTON'){ ev.preventDefault(); ask(); } });
  }
  upd(); ask();
}

/* ---------- Épreuve blanche ---------- */
function pickSeries(gens, n){
  var out = [], bag = [];
  while (out.length < n && gens.length){
    if (!bag.length) bag = A.shuffle(gens);
    out.push(bag.pop());
  }
  return out;
}

    proj.appendChild(tb.el);
    var body = el('div','pbody'); body.appendChild(html('div','pq', qs[i].html));
    body.appendChild(html('div','pans', '→ ' + qs[i].corr)); body.appendChild(html('div','pmeth', qs[i].meth));
    proj.appendChild(body);
  }
  function showAll(){
    phase = 'all'; proj.innerHTML = '';
    var tb = topbar('Toutes les réponses', false);
    tb.el.appendChild(btn('Une par une', function(){ i = 0; showC(); })); tb.el.appendChild(btn('✕', quit, 'Quitter'));
    proj.appendChild(tb.el);
    var body = el('div','pbody'); body.style.justifyContent = 'flex-start';
    var g = el('div','pall');
    qs.forEach(function(q, k){ var c = el('div','eq'); c.appendChild(el('p','qnum','Question ' + (k + 1))); c.appendChild(html('div','q', q.html)); c.appendChild(html('div','corr', '→ ' + q.corr)); g.appendChild(c); });
    body.appendChild(g); proj.appendChild(body);
  }
  function key(ev){
    if (ev.key === 'Escape'){ quit(); return; }
    if (ev.key === '+' || ev.key === '='){ ev.preventDefault(); setPs(ps + 0.1); return; }
    if (ev.key === '-' || ev.key === '_'){ ev.preventDefault(); setPs(ps - 0.1); return; }
    if (ev.key === '0'){ setPs(1); return; }
    if (phase === 'q' && (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'PageDown')){ ev.preventDefault(); next(); }
    else if (phase === 'c' && (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'PageDown')){ ev.preventDefault(); if (i < qs.length - 1){ i++; showC(); } else showAll(); }
    else if (phase === 'c' && (ev.key === 'ArrowLeft' || ev.key === 'PageUp')){ ev.preventDefault(); if (i > 0){ i--; showC(); } }
  }
  document.addEventListener('keydown', key);
  showQ();
}

/* ---------- démarrage ---------- */
function start(){
  locked = find(hashCls);
  cls = locked || find(store('classe'));
  if (locked) document.title = 'Automatismes ' + locked + ' – M. Pluchet';
  buildPicker(); if (cls) computeTags(); render();
}
fetch('data.json?t=' + Date.now(), {cache:'no-store'})
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){ D = d; }).catch(function(){})
  .then(start);
})();
</script>
