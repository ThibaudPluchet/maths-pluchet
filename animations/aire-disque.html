<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'aire du disque</title>
<style>
:root{--bg:#f6f4ee;--ink:#1c2333;--mut:#677085;--line:#d8d2c4;--card:#fff;--a:#2563c9;--a2:#d9482b;--a3:#1f9255;--a4:#8a4fd1;--a5:#e07a1f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:2px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
header h1{margin:0;font-size:28px}header .sub{color:var(--mut);font-size:17px}
main{max-width:1240px;margin:0 auto;padding:18px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input{font:inherit;font-size:19px}
button{padding:8px 14px;border-radius:10px;border:2px solid #c9c2b2;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}
button.on{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary{background:var(--a);border-color:var(--a);color:#fff}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number],input[type=time]{padding:7px 10px;border:2px solid #c9c2b2;border-radius:10px;background:#fff}
input[type=text],input[type=number]{width:110px;font-weight:700}
input[type=range]{accent-color:var(--a);width:220px}
svg{display:block;width:100%;height:auto;touch-action:none}
.msg{min-height:32px;font-size:22px;margin-top:8px;line-height:1.45}
.ok{color:var(--a3)}.ko{color:var(--a2)}.mut{color:var(--mut)}
.big{font-size:32px;font-weight:700}
.sep{width:18px}
</style>
<script>
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
function svgPt(S,e){const p=S.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(S.getScreenCTM().inverse());}
function say(t,c,id){const m=$(id||"msg");if(!m)return;m.className="msg "+(c||"");m.innerHTML=t;}
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const frn=v=>(Math.round(v*1000)/1000).toLocaleString("fr-FR",{maximumFractionDigits:3});
function tween(d,f,done){const t0=performance.now();(function g(n){let p=Math.min(1,(n-t0)/d);const e=p<.5?2*p*p:1-2*(1-p)*(1-p);f(e);if(p<1)requestAnimationFrame(g);else if(done)done();})(t0);}
</script>
</head>
<body>
<header><h1>L'aire du disque</h1><span class="sub">On découpe le disque en parts et on les réarrange : on obtient presque un rectangle.</span></header>
<main>
<div class="card">
 <div class="row">
  <label>Nombre de parts <input type="range" id="n" min="4" max="48" step="2" value="12"> <b id="nv"></b></label>
  <button class="primary" id="go">Réarranger les parts</button>
 </div>
</div>
<div class="card" style="padding:6px"><svg id="svg" viewBox="0 0 1160 470"></svg>
 <div id="f" style="font-size:26px;text-align:center;line-height:1.6;min-height:84px;margin-bottom:6px"></div></div>
<script>
const S=$("svg"),r=150,Cx=250,Cy=240,X0=520,TOP=150;let t=0,busy=false;
function draw(){
  const n=+$("n").value,al=2*Math.PI/n,c=2*r*Math.sin(al/2),hh=r*Math.cos(al/2);$("nv").textContent=n;
  const p=a=>[r*Math.cos(a),r*Math.sin(a)],a=p(-al/2),b=p(al/2),path=`M0,0 L${a[0]},${a[1]} A${r},${r} 0 0 1 ${b[0]},${b[1]} Z`;
  let h=`<circle cx="${Cx}" cy="${Cy}" r="${r}" fill="none" stroke="#c9c2b2" stroke-dasharray="5 5"/>`;
  for(let k=0;k<n;k++){
    const s0=[Cx,Cy],a0=(k+.5)*al,ev=k%2===0;
    const s1=ev?[X0+(k/2)*c,TOP]:[X0+c/2+((k-1)/2)*c,TOP+hh],a1=ev?Math.PI/2:-Math.PI/2;
    let da=a1-a0;da=Math.atan2(Math.sin(da),Math.cos(da));
    const x=s0[0]+(s1[0]-s0[0])*t,y=s0[1]+(s1[1]-s0[1])*t,ang=(a0+da*t)*180/Math.PI;
    h+=`<path d="${path}" transform="translate(${x},${y}) rotate(${ang})" fill="${ev?"#2563c9":"#e07a1f"}" fill-opacity=".8" stroke="#fff" stroke-width="1.5"/>`;
  }
  if(t>=1){const W=n/2*c,xr=X0-c/2;
    h+=`<line x1="${X0}" y1="${TOP+hh+34}" x2="${X0+(n/2)*c}" y2="${TOP+hh+34}" stroke="#d9482b" stroke-width="3"/><text x="${X0+W/2}" y="${TOP+hh+66}" text-anchor="middle" font-size="22" font-weight="700" fill="#d9482b">≈ moitié du périmètre = π × r</text>`;
    h+=`<line x1="${xr-10}" y1="${TOP}" x2="${xr-10}" y2="${TOP+hh}" stroke="#1f9255" stroke-width="3"/><text x="${xr-20}" y="${TOP+hh/2+8}" text-anchor="end" font-size="22" font-weight="700" fill="#1f9255">≈ r</text>`;}
  S.innerHTML=h;
  $("f").innerHTML=t>=1?`Le disque est devenu « presque » un rectangle de longueur <b style="color:#d9482b">π × r</b> et de largeur <b style="color:#1f9255">r</b>.<br>Aire du disque = <b>π × r × r = π × r²</b>`+(n<20?` <span class="mut" style="font-size:20px">— augmente le nombre de parts : ça ressemble de plus en plus à un rectangle !</span>`:""):`<span class="mut">Un disque de rayon r, découpé en ${n} parts égales.</span>`;
}
$("n").oninput=()=>{if(!busy)draw();};
$("go").onclick=()=>{if(busy)return;busy=true;const from=t,to=t>=1?0:1;$("go").textContent=to?"Reformer le disque":"Réarranger les parts";
  tween(2200,e=>{t=from+(to-from)*e;draw();},()=>{t=to;busy=false;draw();});
  $("go").textContent=to?"Reformer le disque":"Réarranger les parts";};
draw();
</script>

</main>
</body></html>
