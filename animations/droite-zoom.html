<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Droite graduée zoomable</title>
<style>
:root{--bg:#f6f4ee;--ink:#1c2333;--mut:#677085;--line:#d8d2c4;--card:#fff;--a:#2563c9;--a2:#d9482b;--a3:#1f9255;--a4:#8a4fd1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:2px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
header h1{margin:0;font-size:28px}header .sub{color:var(--mut);font-size:17px}
main{max-width:1240px;margin:0 auto;padding:18px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input{font:inherit;font-size:19px}
button{padding:9px 16px;border-radius:10px;border:2px solid #c9c2b2;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--a);border-color:var(--a);color:#fff}
input[type=text]{padding:8px 10px;border:2px solid #c9c2b2;border-radius:10px;width:120px;font-weight:700}
.msg{min-height:30px;font-size:22px;margin-top:10px}
.ko{color:var(--a2)}.mut{color:var(--mut)}
.seg{fill:transparent;cursor:pointer}
.seg:hover{fill:rgba(37,99,201,.12)}
#cmp{font-size:34px;font-weight:700;margin-top:8px;text-align:center}
svg{display:block;width:100%;height:auto}
</style></head>
<body>
<header><h1>Droite graduée zoomable</h1><span class="sub">Clique sur un intervalle pour zoomer : chaque zoom découpe l'intervalle en 10.</span></header>
<main>
<div class="card">
 <div class="row">
  <label>Nombre 1 <input type="text" id="n0" value="2,35" style="color:#2563c9"></label>
  <label>Nombre 2 <input type="text" id="n1" value="2,4" style="color:#d9482b"></label>
  <label>Nombre 3 <input type="text" id="n2" value="" style="color:#1f9255" placeholder="facultatif"></label>
  <button class="primary" id="go">Placer</button>
  <button id="auto">Zoomer vers le nombre 1</button>
  <button id="out">Dézoomer</button>
  <button id="reset">Tout dézoomer</button>
 </div>
 <div class="msg" id="msg"></div>
</div>
<div class="card"><svg id="svg" viewBox="0 0 1160 640"></svg>
 <div id="cmp"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const COLORS=["#2563c9","#d9482b","#1f9255"];
const X0=60,X1=1100,LEN=X1-X0, LY=[70,225,380,535];
let levels=[0], nums=[null,null,null];
const step=k=>1000/10**k;
function fmt(t){const ip=Math.floor(t/1000);let dp=String(t%1000).padStart(3,"0").replace(/0+$/,"");return dp?ip+","+dp:String(ip);}
function parse(s){
  s=s.trim().replace(".",",");
  if(!s) return null;
  if(!/^\d+(,\d{1,3})?$/.test(s)) return NaN;
  const [ip,dp=""]=s.split(",");
  const v=+ip*1000+ +(dp.padEnd(3,"0"));
  return v>10000?NaN:v;
}
function say(t,c){$("msg").className="msg "+(c||"");$("msg").textContent=t;}
function read(){
  let ok=true;
  for(let i=0;i<3;i++){
    const v=parse($("n"+i).value);
    if(Number.isNaN(v)){ok=false;nums[i]=null;}else nums[i]=v;
  }
  if(!ok) say("Écris des nombres entre 0 et 10, avec 3 décimales au maximum.","ko");
  else say("Clique sur un intervalle pour zoomer.","mut");
}
const xOf=(v,k)=>X0+(v-levels[k])/(10*step(k))*LEN;
function draw(){
  let h="";
  const n=levels.length;
  for(let k=0;k<n;k++){
    const y=LY[k], s=step(k), a=levels[k];
    if(k+1<n){
      const j=(levels[k+1]-a)/s, xa=X0+j*LEN/10, xb=xa+LEN/10;
      h+=`<polygon points="${xa},${y+8} ${xb},${y+8} ${X1},${LY[k+1]-30} ${X0},${LY[k+1]-30}" fill="rgba(138,79,209,.10)" stroke="rgba(138,79,209,.35)" stroke-dasharray="5 5"/>`;
      h+=`<rect x="${xa}" y="${y-10}" width="${LEN/10}" height="20" fill="rgba(138,79,209,.30)"/>`;
    }
    h+=`<line x1="${X0-25}" y1="${y}" x2="${X1+25}" y2="${y}" stroke="#1c2333" stroke-width="3"/>`;
    h+=`<polygon points="${X1+35},${y} ${X1+22},${y-7} ${X1+22},${y+7}" fill="#1c2333"/>`;
    for(let i=0;i<=10;i++){
      const x=X0+i*LEN/10, big=(i===0||i===10||i===5);
      h+=`<line x1="${x}" y1="${y-(big?16:11)}" x2="${x}" y2="${y+(big?16:11)}" stroke="#1c2333" stroke-width="${big?3:2}"/>`;
      h+=`<text x="${x}" y="${y+44}" text-anchor="middle" font-size="${k<2?22:20}" font-weight="${(i===0||i===10)?700:400}" fill="#1c2333">${fmt(a+i*s)}</text>`;
    }
    if(k<3) for(let i=0;i<10;i++) h+=`<rect class="seg" data-k="${k}" data-j="${i}" x="${X0+i*LEN/10}" y="${y-30}" width="${LEN/10}" height="58"><title>Zoomer entre ${fmt(a+i*s)} et ${fmt(a+(i+1)*s)}</title></rect>`;
    h+=`<text x="8" y="${y-26}" font-size="15" fill="#677085">pas : ${fmt(s)}</text>`;
    nums.forEach((v,i)=>{
      if(v===null||v<a||v>a+10*s) return;
      const x=xOf(v,k);
      h+=`<circle cx="${x}" cy="${y}" r="9" fill="${COLORS[i]}" stroke="#fff" stroke-width="2" pointer-events="none"/>`;
      h+=`<text x="${x}" y="${y-20-i*24}" text-anchor="middle" font-size="22" font-weight="700" fill="${COLORS[i]}" pointer-events="none">${fmt(v)}</text>`;
    });
  }
  $("svg").innerHTML=h;
  $("svg").querySelectorAll(".seg").forEach(r=>r.onclick=()=>zoom(+r.dataset.k,+r.dataset.j));
  const vs=nums.map((v,i)=>({v,i})).filter(o=>o.v!==null).sort((p,q)=>p.v-q.v);
  $("cmp").innerHTML=vs.length>1?vs.map((o,idx)=>(idx?` <span style="color:#1c2333">${o.v===vs[idx-1].v?"=":"&lt;"}</span> `:"")+`<span style="color:${COLORS[o.i]}">${fmt(o.v)}</span>`).join(""):"";
}
function zoom(k,j){levels=levels.slice(0,k+1);levels.push(levels[k]+j*step(k));draw();}
$("go").onclick=()=>{read();draw();};
$("out").onclick=()=>{if(levels.length>1)levels.pop();draw();};
$("reset").onclick=()=>{levels=[0];draw();};
$("auto").onclick=()=>{
  read();
  const v=nums[0];
  if(v===null){draw();return;}
  let k=levels.length-1;
  while(k>0&&(v<levels[k]||v>levels[k]+10*step(k))){levels.pop();k--;}
  if(v%step(k)===0){draw();say(`${fmt(v)} est sur une graduation : pas besoin de zoomer davantage !`,"");return;}
  if(k>=3){draw();return;}
  let j=Math.floor((v-levels[k])/step(k));if(j>9)j=9;
  zoom(k,j);
  say(`${fmt(v)} est entre ${fmt(levels[k+1])} et ${fmt(levels[k+1]+step(k))} : on zoome sur cet intervalle.`,"");
};
["n0","n1","n2"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click();}));
read();draw();
</script>
</body></html>
