<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Somme des angles d'un triangle</title>
<style>
:root{--bg:#f6f4ee;--ink:#1c2333;--mut:#677085;--line:#d8d2c4;--card:#fff;--a:#2563c9;--a2:#d9482b;--a3:#1f9255;--a4:#8a4fd1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:2px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
header h1{margin:0;font-size:28px}header .sub{color:var(--mut);font-size:17px}
main{max-width:1240px;margin:0 auto;padding:18px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-size:19px;padding:8px 14px;border-radius:10px;border:2px solid #c9c2b2;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--a);border-color:var(--a);color:#fff}
svg{display:block;width:100%;height:auto;touch-action:none}
.v{cursor:grab}
#sum{font-size:32px;font-weight:700;text-align:center;min-height:46px}
.mut{color:var(--mut)}
</style></head>
<body>
<header><h1>Somme des angles d'un triangle</h1><span class="sub">Déplace les sommets, puis découpe les trois angles et recolle-les.</span></header>
<main>
<div class="card"><div class="row">
 <button class="primary" id="cut">Découper et recoller les angles</button>
 <button id="rnd">Triangle au hasard</button>
 <label><input type="checkbox" id="mes" checked> Afficher les mesures</label>
 <span class="mut" style="margin-left:auto">Astuce : faites glisser les points A, B et C.</span>
</div></div>
<div class="card"><svg id="svg" viewBox="0 0 1160 660"></svg><div id="sum"></div></div>
</main>
<script>
const $=id=>document.getElementById(id), S=$("svg");
const COL=["#2563c9","#d9482b","#1f9255"], NAMES=["A","B","C"];
let P=[[300,380],[860,420],[520,90]], t=0, anim=null, drag=-1;
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;
const dir=(v,u)=>deg(Math.atan2(-(u[1]-v[1]),u[0]-v[0]));
const norm=a=>((a%360)+360)%360;
const pt=(v,r,a)=>[v[0]+r*Math.cos(rad(a)),v[1]-r*Math.sin(rad(a))];
function angles(){
  return [0,1,2].map(i=>{
    const v=P[i],u=P[(i+1)%3],w=P[(i+2)%3];
    let s=dir(v,u),e=dir(v,w),al=norm(e-s);
    if(al>180){s=e;al=360-al;}
    return {v,s,al};
  });
}
function sector(v,r,s,al){const p0=pt(v,r,s),p1=pt(v,r,s+al);return `M${v[0]},${v[1]} L${p0[0]},${p0[1]} A${r},${r} 0 0 0 ${p1[0]},${p1[1]} Z`;}
function rounded(A){const a=Math.round(A[0].al),b=Math.round(A[1].al);return [a,b,180-a-b];}
function draw(){
  const A=angles(), R=rounded(A);
  const sides=[0,1,2].map(i=>Math.hypot(P[i][0]-P[(i+1)%3][0],P[i][1]-P[(i+1)%3][1]));
  const r=Math.max(28,Math.min(80,Math.min(...sides)*.35));
  const Q=[580,600], ease=t<.5?2*t*t:1-2*(1-t)*(1-t);
  let h=`<polygon points="${P.map(p=>p.join(",")).join(" ")}" fill="#fbfaf6" stroke="#1c2333" stroke-width="3"/>`;
  if(t>0){
    h+=`<line x1="${Q[0]-300}" y1="${Q[1]}" x2="${Q[0]+300}" y2="${Q[1]}" stroke="#1c2333" stroke-width="3" opacity="${ease}"/>`;
    h+=`<circle cx="${Q[0]}" cy="${Q[1]}" r="5" fill="#1c2333" opacity="${ease}"/>`;
  }
  let start=0;
  A.forEach((o,i)=>{
    if(t>0) h+=`<path d="${sector(o.v,r,o.s,o.al)}" fill="${COL[i]}" opacity=".18"/>`;
    const tgt=start; start+=o.al;
    let rot=norm(tgt-o.s); if(rot>180)rot-=360;
    const tx=o.v[0]+(Q[0]-o.v[0])*ease, ty=o.v[1]+(Q[1]-o.v[1])*ease;
    h+=`<g transform="translate(${tx},${ty}) rotate(${-rot*ease}) translate(${-o.v[0]},${-o.v[1]})"><path d="${sector(o.v,r,o.s,o.al)}" fill="${COL[i]}" opacity=".75" stroke="#fff" stroke-width="2"/>`;
    if($("mes").checked){const m=pt(o.v,r+(t>0?26:30),o.s+o.al/2);h+=`<text x="${m[0]}" y="${m[1]+8}" text-anchor="middle" font-size="24" font-weight="700" fill="${COL[i]}" transform="rotate(${rot*ease},${m[0]},${m[1]})">${R[i]}°</text>`;}
    h+=`</g>`;
  });
  P.forEach((p,i)=>{
    const c=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3], d=Math.hypot(p[0]-c[0],p[1]-c[1])||1;
    h+=`<circle class="v" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="14" fill="${COL[i]}" stroke="#fff" stroke-width="3"/>`;
    h+=`<text x="${p[0]+(p[0]-c[0])/d*34}" y="${p[1]+(p[1]-c[1])/d*34+10}" text-anchor="middle" font-size="30" font-weight="800" fill="#1c2333" pointer-events="none">${NAMES[i]}</text>`;
  });
  S.innerHTML=h;
  const m=$("mes").checked;
  $("sum").innerHTML=m?`<span style="color:${COL[0]}">${R[0]}°</span> + <span style="color:${COL[1]}">${R[1]}°</span> + <span style="color:${COL[2]}">${R[2]}°</span> = 180°`+(t===1?` <span class="mut" style="font-weight:400;font-size:24px">: les trois angles forment un angle plat !</span>`:""):(t===1?"Les trois angles forment un angle plat : 180°.":"");
}
function go(to){
  cancelAnimationFrame(anim);const from=t,t0=performance.now();
  (function f(n){t=Math.min(1,(n-t0)/1600);t=from+(to-from)*t;draw();if(t!==to)anim=requestAnimationFrame(f);else{$("cut").textContent=to?"Remettre les angles en place":"Découper et recoller les angles";}})(t0);
}
$("cut").onclick=()=>go(t>.5?0:1);
$("mes").onchange=draw;
$("rnd").onclick=()=>{
  let ok=false;
  while(!ok){P=[[R(120,520),R(200,440)],[R(640,1040),R(200,440)],[R(250,900),R(40,200)]];const a=angles();ok=a.every(o=>o.al>14);}
  t=0;$("cut").textContent="Découper et recoller les angles";draw();
};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a));
function svgPt(e){const p=S.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(S.getScreenCTM().inverse());}
S.addEventListener("pointerdown",e=>{const c=e.target.closest(".v");if(!c)return;drag=+c.dataset.i;S.setPointerCapture(e.pointerId);if(t>0){cancelAnimationFrame(anim);t=0;$("cut").textContent="Découper et recoller les angles";}});
S.addEventListener("pointermove",e=>{if(drag<0)return;const p=svgPt(e);const old=P[drag].slice();P[drag]=[Math.max(30,Math.min(1130,p.x)),Math.max(30,Math.min(470,p.y))];if(angles().some(o=>o.al<4))P[drag]=old;draw();});
S.addEventListener("pointerup",()=>drag=-1);
draw();
</script>
</body></html>
