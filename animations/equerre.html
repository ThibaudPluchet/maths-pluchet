<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'équerre : perpendiculaires et parallèles</title>
<style>
:root{--bg:#f6f4ee;--ink:#1c2333;--mut:#677085;--line:#d8d2c4;--card:#fff;--a:#2563c9;--a2:#d9482b;--a3:#1f9255;--a4:#8a4fd1;--a5:#e07a1f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:2px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
header h1{margin:0;font-size:28px}header .sub{color:var(--mut);font-size:17px}
main{max-width:1240px;margin:0 auto;padding:18px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input{font:inherit;font-size:19px}
button{padding:8px 14px;border-radius:10px;border:2px solid #c9c2b2;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}
button.on{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary{background:var(--a);border-color:var(--a);color:#fff}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number],input[type=time]{padding:7px 10px;border:2px solid #c9c2b2;border-radius:10px;background:#fff}
input[type=text],input[type=number]{width:110px;font-weight:700}
input[type=range]{accent-color:var(--a);width:220px}
svg{display:block;width:100%;height:auto;touch-action:none}
.msg{min-height:32px;font-size:22px;margin-top:8px;line-height:1.45}
.ok{color:var(--a3)}.ko{color:var(--a2)}.mut{color:var(--mut)}
.big{font-size:32px;font-weight:700}
.sep{width:18px}
</style>
<script>
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
function svgPt(S,e){const p=S.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(S.getScreenCTM().inverse());}
function say(t,c,id){const m=$(id||"msg");if(!m)return;m.className="msg "+(c||"");m.innerHTML=t;}
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const frn=v=>(Math.round(v*1000)/1000).toLocaleString("fr-FR",{maximumFractionDigits:3});
function tween(d,f,done){const t0=performance.now();(function g(n){let p=Math.min(1,(n-t0)/d);const e=p<.5?2*p*p:1-2*(1-p)*(1-p);f(e);if(p<1)requestAnimationFrame(g);else if(done)done();})(t0);}
</script>
</head>
<body>
<header><h1>L'équerre : perpendiculaires et parallèles</h1><span class="sub">Fais glisser et pivoter l'équerre (poignée violette), puis trace. Ou regarde la méthode pas à pas.</span></header>
<main>
<div class="card">
 <div class="row">
  <button id="mP" class="on">Perpendiculaire à (d) passant par A</button><button id="mQ">Parallèle à (d) passant par A</button>
  <span class="sep"></span>
  <button id="demo" class="primary">Voir la méthode</button><button id="new">Nouvelle figure</button>
 </div>
 <div class="row" style="margin-top:10px">
  <span class="mut">Équerre :</span><button id="rl">⟲ 5°</button><button id="rr">⟳ 5°</button><button id="fl">Retourner</button>
  <span id="ruc" class="row" style="display:none"><span class="mut">&nbsp;Règle :</span><button id="rrl">⟲ 5°</button><button id="rrr">⟳ 5°</button></span>
 </div>
 <div class="row" style="margin-top:10px">
  <button id="t1">✏️ Tracer le long du grand côté</button><button id="t2">✏️ Tracer le long du petit côté</button><button id="clr">Effacer les tracés</button>
 </div>
 <div class="msg" id="msg"></div>
</div>
<div class="card" style="padding:6px"><svg id="svg" viewBox="0 0 1160 660"></svg></div>
<script>
const S=$("svg"), D2R=Math.PI/180, L1=330, L2=210, RL=280, RW=56;
let mode="perp", d={p:[580,300],a:-12}, A=[0,0], eq, ru, lines=[], drag=null, off=null, busy=false;
const dot=(u,v)=>u[0]*v[0]+u[1]*v[1], sub=(u,v)=>[u[0]-v[0],u[1]-v[1]], add=(u,v,k)=>[u[0]+k*v[0],u[1]+k*v[1]];
const angOf=v=>Math.atan2(v[1],v[0])/D2R, nrm=a=>{a=((a%360)+360)%360;return a>180?a-360:a;};
function dirOf(t,lx,ly){const c=Math.cos(t.rot*D2R),s=Math.sin(t.rot*D2R),y=t.f*ly;return [c*lx-s*y,s*lx+c*y];}
const ddir=()=>[Math.cos(d.a*D2R),Math.sin(d.a*D2R)];
const foot=P=>{const u=ddir();return add(d.p,u,dot(sub(P,d.p),u));};
function draw(){
  const ud=ddir();let h="";
  for(let x=0;x<=1160;x+=40)h+=`<line x1="${x}" y1="0" x2="${x}" y2="660" stroke="#f0ece2"/>`;
  for(let y=0;y<=660;y+=40)h+=`<line x1="0" y1="${y}" x2="1160" y2="${y}" stroke="#f0ece2"/>`;
  const P1=add(d.p,ud,-2000),P2=add(d.p,ud,2000);
  h+=`<line x1="${P1[0]}" y1="${P1[1]}" x2="${P2[0]}" y2="${P2[1]}" stroke="#1c2333" stroke-width="3"/>`;
  const lab=add(d.p,ud,-470);h+=`<text x="${lab[0]}" y="${lab[1]-14}" font-size="26" font-weight="700">(d)</text>`;
  lines.forEach(l=>{const a=add(l.p,l.u,-2000),b=add(l.p,l.u,2000);h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${l.ok?"#1f9255":"#d9482b"}" stroke-width="3"/>`;});
  h+=`<path d="M${A[0]-9},${A[1]-9}L${A[0]+9},${A[1]+9}M${A[0]-9},${A[1]+9}L${A[0]+9},${A[1]-9}" stroke="#2563c9" stroke-width="3.5"/><text x="${A[0]+12}" y="${A[1]-12}" font-size="28" font-weight="800" fill="#2563c9">A</text>`;
  if(ru.on){
    let g=`<g transform="translate(${ru.x},${ru.y}) rotate(${ru.rot}) scale(1,${ru.f})"><rect class="rub" x="${-RL}" y="0" width="${2*RL}" height="${RW}" rx="4" fill="rgba(190,222,255,.72)" stroke="#2c5aa0" stroke-width="2" style="cursor:move"/>`;
    for(let i=-RL+10;i<=RL-10;i+=10)g+=`<line x1="${i}" y1="0" x2="${i}" y2="${(i+RL)%50===0?16:8}" stroke="#2c5aa0" stroke-width="1.3" pointer-events="none"/>`;
    g+=`<circle class="ruh" cx="${RL-26}" cy="${RW/2+6}" r="12" fill="#8a4fd1" style="cursor:grab"/></g>`;h+=g;
  }
  let g=`<g transform="translate(${eq.x},${eq.y}) rotate(${eq.rot}) scale(1,${eq.f})">`;
  g+=`<path class="eqb" d="M0,0 L${L1},0 L0,${-L2} Z M30,-28 L${L1-82},-28 L30,${-L2+52} Z" fill-rule="evenodd" fill="rgba(255,226,140,.78)" stroke="#a07800" stroke-width="2" style="cursor:move"/>`;
  for(let i=10;i<L1-30;i+=10)g+=`<line x1="${i}" y1="0" x2="${i}" y2="${i%50===0?-12:-6}" stroke="#7a5c00" stroke-width="1.2" pointer-events="none"/>`;
  for(let i=10;i<L2-40;i+=10)g+=`<line x1="0" y1="${-i}" x2="${i%50===0?12:6}" y2="${-i}" stroke="#7a5c00" stroke-width="1.2" pointer-events="none"/>`;
  g+=`<path d="M0,-16 L16,-16 L16,0" fill="none" stroke="#7a5c00" stroke-width="2" pointer-events="none"/>`;
  g+=`<circle class="eqh" cx="${L1-48}" cy="-11" r="10" fill="#8a4fd1" style="cursor:grab"/></g>`;
  h+=g;S.innerHTML=h;
}
function snapLine(t,refs,legs){
  for(const r of refs)for(const leg of legs){
    const u=dirOf(t,...leg),da=nrm(angOf(r.u)-angOf(u));let k=null;
    if(Math.abs(da)<4)k=da;else if(Math.abs(nrm(da-180))<4)k=nrm(da-180);
    if(k===null)continue;
    t.rot+=k;
    const n=[-r.u[1],r.u[0]],dist=dot(sub([t.x,t.y],r.p),n);
    if(Math.abs(dist)<14){t.x-=dist*n[0];t.y-=dist*n[1];
      if(t===eq){const s=dot(sub(A,[t.x,t.y]),r.u);if(Math.abs(s)<14){t.x+=s*r.u[0];t.y+=s*r.u[1];}}}
    return;
  }
}
function snapEq(){const refs=[{p:d.p,u:ddir()}];if(ru.on)refs.unshift({p:[ru.x,ru.y],u:dirOf(ru,1,0)});snapLine(eq,refs,[[1,0],[0,-1]]);}
function snapRu(){const V=[eq.x,eq.y];snapLine(ru,[{p:V,u:dirOf(eq,0,-1)},{p:V,u:dirOf(eq,1,0)},{p:d.p,u:ddir()}],[[1,0]]);}
function trace(leg){
  const u=dirOf(eq,...leg),p=[eq.x,eq.y],ud=ddir(),n=[-u[1],u[0]];
  const cross=Math.abs(u[0]*ud[1]-u[1]*ud[0]),dv=Math.abs(dot(u,ud)),distA=Math.abs(dot(sub(A,p),n));
  const goodDir=mode==="perp"?dv<.03:cross<.03, ok=goodDir&&distA<5;
  lines.push({p,u,ok});draw();
  if(ok)say(mode==="perp"?"✓ Bravo : ta droite est perpendiculaire à (d) et passe par A.":"✓ Bravo : ta droite est parallèle à (d) et passe par A.","ok");
  else if(!goodDir&&distA<5)say(mode==="perp"?"✗ Ta droite passe par A mais n'est pas perpendiculaire à (d) : un côté de l'angle droit doit être posé <b>le long de (d)</b>.":"✗ Ta droite passe par A mais n'est pas parallèle à (d) : l'équerre a dû tourner en glissant le long de la règle.","ko");
  else if(goodDir)say(mode==="perp"?"✗ Ta droite est bien perpendiculaire à (d), mais elle ne passe pas par A : fais glisser l'équerre le long de (d).":"✗ Ta droite est bien parallèle à (d), mais elle ne passe pas par A : fais glisser l'équerre le long de la règle jusqu'à A.","ko");
  else say("✗ Ta droite ne passe pas par A et n'a pas la bonne direction.","ko");
}
function moveTo(t,tg,dur,done){const s={x:t.x,y:t.y,rot:t.rot},dr=nrm(tg.rot-t.rot);if(tg.f!==undefined)t.f=tg.f;tween(dur,e=>{t.x=s.x+(tg.x-s.x)*e;t.y=s.y+(tg.y-s.y)*e;t.rot=s.rot+dr*e;draw();},done);}
function legChoice(rot,toward){const c=Math.cos(rot*D2R),s=Math.sin(rot*D2R);return dot([s,-c],toward)>0?1:-1;}
function demo(){
  if(busy)return;busy=true;lines=[];
  const ud=ddir(),H=foot(A),toA=sub(A,H),rot=d.a,f=legChoice(rot,toA);
  if(mode==="perp"){
    ru.on=false;const V0=add(H,ud,-170);
    say("1. On pose un côté de l'angle droit <b>le long de la droite (d)</b>.");
    moveTo(eq,{x:V0[0],y:V0[1],rot,f},1300,()=>setTimeout(()=>{
      say("2. On fait <b>glisser</b> l'équerre le long de (d) jusqu'à ce que l'autre côté de l'angle droit touche le point A.");
      moveTo(eq,{x:H[0],y:H[1],rot},1300,()=>setTimeout(()=>{
        trace([0,-1]);say("3. On trace le long de ce côté : la droite est <b>perpendiculaire à (d)</b> et passe par A. On code l'angle droit !","ok");busy=false;},500));},700));
  }else{
    const V0=add(H,ud,-120);
    say("1. On pose un côté de l'angle droit <b>le long de la droite (d)</b>.");
    moveTo(eq,{x:V0[0],y:V0[1],rot,f},1300,()=>setTimeout(()=>{
      const c=Math.cos(rot*D2R),s=Math.sin(rot*D2R),u2=[s*f,-c*f],rr=angOf(u2),cr=Math.cos(rr*D2R),sr=Math.sin(rr*D2R);
      const rf=dot([-sr,cr],[-ud[0],-ud[1]])>0?1:-1,C=add(V0,u2,150);
      if(!ru.on){ru.on=true;ru.x=C[0]-u2[0]*300;ru.y=C[1]-u2[1]*300;ru.rot=rr;ru.f=rf;}
      say("2. On place la <b>règle</b> contre l'autre côté de l'angle droit.");
      moveTo(ru,{x:C[0],y:C[1],rot:rr,f:rf},1300,()=>setTimeout(()=>{
        const sl=dot(sub(A,V0),u2),V1=add(V0,u2,sl);
        say("3. On tient la règle et on fait <b>glisser l'équerre le long de la règle</b> jusqu'au point A.");
        moveTo(eq,{x:V1[0],y:V1[1],rot},1500,()=>setTimeout(()=>{
          trace([1,0]);say("4. On trace le long du côté qui était sur (d) : la droite est <b>parallèle à (d)</b> et passe par A.","ok");busy=false;},500));},700));},700));
  }
}
function newFig(){
  d.a=R(-35,35);d.p=[580,R(270,330)];
  const ud=ddir(),H=add(d.p,ud,R(-140,140)),n=[ud[1],-ud[0]],side=Math.random()<.3?-1:1,h=mode==="perp"?R(90,170):R(110,200);
  A=add(H,n,side*h);
  eq={x:810,y:615,rot:0,f:1};ru={x:300,y:595,rot:0,f:1,on:mode==="para"};lines=[];
  $("ruc").style.display=mode==="para"?"flex":"none";
  say(mode==="perp"?"Trace la perpendiculaire à (d) passant par A.":"Trace la parallèle à (d) passant par A (avec l'équerre et la règle).","mut");draw();
}
S.addEventListener("pointerdown",e=>{
  if(busy)return;const p=svgPt(S,e),t=e.target;
  if(t.closest(".eqh"))drag="eqrot";else if(t.closest(".eqb")){drag="eq";off=[p.x-eq.x,p.y-eq.y];}
  else if(t.closest(".ruh"))drag="rurot";else if(t.closest(".rub")){drag="ru";off=[p.x-ru.x,p.y-ru.y];}else return;
  S.setPointerCapture(e.pointerId);
});
S.addEventListener("pointermove",e=>{
  if(!drag)return;const p=svgPt(S,e);
  if(drag==="eq"){eq.x=p.x-off[0];eq.y=p.y-off[1];snapEq();}
  if(drag==="eqrot"){eq.rot=angOf([p.x-eq.x,p.y-eq.y])-Math.atan2(-11*eq.f,L1-48)/D2R;snapEq();}
  if(drag==="ru"){ru.x=p.x-off[0];ru.y=p.y-off[1];snapRu();}
  if(drag==="rurot"){ru.rot=angOf([p.x-ru.x,p.y-ru.y])-Math.atan2((RW/2+6)*ru.f,RL-26)/D2R;snapRu();}
  draw();
});
S.addEventListener("pointerup",()=>drag=null);
$("rl").onclick=()=>{eq.rot-=5;draw();};$("rr").onclick=()=>{eq.rot+=5;draw();};$("fl").onclick=()=>{eq.f*=-1;draw();};
$("rrl").onclick=()=>{ru.rot-=5;draw();};$("rrr").onclick=()=>{ru.rot+=5;draw();};
$("t1").onclick=()=>trace([1,0]);$("t2").onclick=()=>trace([0,-1]);
$("clr").onclick=()=>{lines=[];draw();say("","");};
$("demo").onclick=demo;$("new").onclick=()=>{if(!busy)newFig();};
$("mP").onclick=()=>{if(busy)return;mode="perp";$("mP").classList.add("on");$("mQ").classList.remove("on");newFig();};
$("mQ").onclick=()=>{if(busy)return;mode="para";$("mQ").classList.add("on");$("mP").classList.remove("on");newFig();};
newFig();
</script>

</main>
</body></html>
