<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symétries axiale et centrale</title>
<style>
:root{--bg:#f6f4ee;--ink:#1c2333;--mut:#677085;--line:#d8d2c4;--card:#fff;--a:#2563c9;--a2:#d9482b;--a3:#1f9255;--a4:#8a4fd1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:2px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
header h1{margin:0;font-size:28px}header .sub{color:var(--mut);font-size:17px}
main{max-width:1240px;margin:0 auto;padding:18px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-size:19px;padding:8px 14px;border-radius:10px;border:2px solid #c9c2b2;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}
button.on{background:var(--ink);border-color:var(--ink);color:#fff}
label{font-size:18px}
svg{display:block;width:100%;height:auto;touch-action:none}
.dr{cursor:move}.hd{cursor:grab}
#info{font-size:21px;min-height:30px}
.mut{color:var(--mut)}
</style></head>
<body>
<header><h1>Symétries</h1><span class="sub">Déplace la figure, l'axe ou le centre : la figure symétrique suit en direct.</span></header>
<main>
<div class="card"><div class="row">
 <button id="mAx" class="on">Symétrie axiale</button><button id="mCe">Symétrie centrale</button>
 <span style="width:20px"></span>
 <label><input type="checkbox" id="cons" checked> Constructions</label>
 <label><input type="checkbox" id="snap" checked> Aimanter au quadrillage</label>
 <label><input type="checkbox" id="img" checked> Afficher l'image</label>
 <button id="shape" style="margin-left:auto">Changer de figure</button>
</div>
<div id="info" class="mut" style="margin-top:8px"></div></div>
<div class="card" style="padding:8px"><svg id="svg" viewBox="0 0 1160 680"></svg></div>
</main>
<script>
const $=id=>document.getElementById(id), S=$("svg"), G=40;
const SHAPES=[
 [[0,0],[0,-160],[80,-120],[0,-80]],
 [[0,0],[120,0],[120,-40],[40,-40],[40,-120],[0,-120]],
 [[0,0],[80,-40],[120,-160],[40,-120]],
 [[0,0],[160,0],[120,-80],[40,-80]]
];
let mode="ax", si=0, off=[240,480], H1=[640,80], H2=[640,600], C=[600,360], drag=null, d0=null;
const NM=["A","B","C","D","E","F"];
const pts=()=>SHAPES[si].map(([x,y])=>[x+off[0],y+off[1]]);
function img(p){
  if(mode==="ce")return [2*C[0]-p[0],2*C[1]-p[1]];
  const dx=H2[0]-H1[0],dy=H2[1]-H1[1],L=dx*dx+dy*dy||1,t=((p[0]-H1[0])*dx+(p[1]-H1[1])*dy)/L;
  const f=[H1[0]+t*dx,H1[1]+t*dy];return [2*f[0]-p[0],2*f[1]-p[1]];
}
function foot(p){const dx=H2[0]-H1[0],dy=H2[1]-H1[1],L=dx*dx+dy*dy||1,t=((p[0]-H1[0])*dx+(p[1]-H1[1])*dy)/L;return [H1[0]+t*dx,H1[1]+t*dy];}
function tick(a,b,n,col){
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;let h="";
  for(let k=0;k<n;k++){const o=(k-(n-1)/2)*6;h+=`<line x1="${m[0]+ux*o-nx*8}" y1="${m[1]+uy*o-ny*8}" x2="${m[0]+ux*o+nx*8}" y2="${m[1]+uy*o+ny*8}" stroke="${col}" stroke-width="2"/>`;}
  return h;
}
function draw(){
  let h="";
  for(let x=0;x<=1160;x+=G)h+=`<line x1="${x}" y1="0" x2="${x}" y2="680" stroke="#ebe6da"/>`;
  for(let y=0;y<=680;y+=G)h+=`<line x1="0" y1="${y}" x2="1160" y2="${y}" stroke="#ebe6da"/>`;
  const P=pts(), Q=P.map(img), showI=$("img").checked, cons=$("cons").checked&&showI;
  if(mode==="ax"){
    const dx=H2[0]-H1[0],dy=H2[1]-H1[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    h+=`<line x1="${H1[0]-ux*2000}" y1="${H1[1]-uy*2000}" x2="${H1[0]+ux*2000}" y2="${H1[1]+uy*2000}" stroke="#1f9255" stroke-width="3.5"/>`;
    h+=`<text x="${H2[0]+18}" y="${H2[1]-12}" font-size="24" font-weight="700" fill="#1f9255">(d)</text>`;
  }
  if(cons)P.forEach((p,i)=>{
    const q=Q[i], col="#8a4fd1", n=(i%3)+1;
    if(Math.hypot(p[0]-q[0],p[1]-q[1])<1)return;
    h+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${col}" stroke-width="1.6" stroke-dasharray="6 5"/>`;
    const m=mode==="ce"?C:foot(p);
    h+=tick(p,m,n,col)+tick(m,q,n,col);
    if(mode==="ax"){
      const dx=H2[0]-H1[0],dy=H2[1]-H1[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,vx=(p[0]-m[0]),vy=(p[1]-m[1]),VL=Math.hypot(vx,vy)||1,wx=vx/VL*12,wy=vy/VL*12;
      h+=`<polyline points="${m[0]+ux*12},${m[1]+uy*12} ${m[0]+ux*12+wx},${m[1]+uy*12+wy} ${m[0]+wx},${m[1]+wy}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
    }
  });
  h+=`<polygon class="dr" points="${P.map(p=>p.join(",")).join(" ")}" fill="#2563c9" fill-opacity=".35" stroke="#2563c9" stroke-width="3.5" stroke-linejoin="round"/>`;
  if(showI)h+=`<polygon points="${Q.map(p=>p.join(",")).join(" ")}" fill="#d9482b" fill-opacity=".3" stroke="#d9482b" stroke-width="3.5" stroke-linejoin="round" pointer-events="none"/>`;
  const cen=a=>[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];
  const lab=(a,col,suf)=>{const c=cen(a);return a.map((p,i)=>{const dx=p[0]-c[0],dy=p[1]-c[1],L=Math.hypot(dx,dy)||1;return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col}"/><text x="${p[0]+dx/L*24}" y="${p[1]+dy/L*24+8}" text-anchor="middle" font-size="22" font-weight="700" fill="${col}" pointer-events="none">${NM[i]}${suf}</text>`;}).join("");};
  h+=lab(P,"#2563c9","");if(showI)h+=lab(Q,"#d9482b","′");
  if(mode==="ax")[H1,H2].forEach((p,i)=>h+=`<circle class="hd" data-h="${i}" cx="${p[0]}" cy="${p[1]}" r="13" fill="#1f9255" stroke="#fff" stroke-width="3"/>`);
  else h+=`<circle class="hd" data-h="c" cx="${C[0]}" cy="${C[1]}" r="13" fill="#1c2333" stroke="#fff" stroke-width="3"/><text x="${C[0]+18}" y="${C[1]-14}" font-size="26" font-weight="800">O</text>`;
  S.innerHTML=h;
  $("info").innerHTML=mode==="ax"?"Symétrie axiale : la droite (d) est la <b>médiatrice</b> de chaque segment [AA′] (perpendiculaire, et coupe en son milieu). La figure est « retournée ».":"Symétrie centrale : O est le <b>milieu</b> de chaque segment [AA′]. C'est un demi-tour autour de O.";
}
const sn=v=>$("snap").checked?Math.round(v/G)*G:v;
function svgPt(e){const p=S.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(S.getScreenCTM().inverse());}
S.addEventListener("pointerdown",e=>{
  const p=svgPt(e),h=e.target.closest(".hd");
  if(h)drag=h.dataset.h;else if(e.target.closest(".dr")){drag="f";d0=[p.x-off[0],p.y-off[1]];}else return;
  S.setPointerCapture(e.pointerId);
});
S.addEventListener("pointermove",e=>{
  if(!drag)return;const p=svgPt(e);
  const x=Math.max(0,Math.min(1160,p.x)),y=Math.max(0,Math.min(680,p.y));
  if(drag==="f")off=[sn(x-d0[0]),sn(y-d0[1])];
  else if(drag==="c")C=[sn(x),sn(y)];
  else{const np=[sn(x),sn(y)],other=drag==="0"?H2:H1;if(Math.hypot(np[0]-other[0],np[1]-other[1])>20){if(drag==="0")H1=np;else H2=np;}}
  draw();
});
S.addEventListener("pointerup",()=>drag=null);
$("mAx").onclick=()=>{mode="ax";$("mAx").classList.add("on");$("mCe").classList.remove("on");draw();};
$("mCe").onclick=()=>{mode="ce";$("mCe").classList.add("on");$("mAx").classList.remove("on");draw();};
["cons","snap","img"].forEach(id=>$(id).onchange=draw);
$("shape").onclick=()=>{si=(si+1)%SHAPES.length;draw();};
draw();
</script>
</body></html>
