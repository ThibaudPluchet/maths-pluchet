<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animations – M. Pluchet</title>
<meta name="description" content="Animations interactives pour revoir et visualiser les notions de base.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f5bd3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b2333; --muted:#596277; --line:#e2ded3;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e8eefc; --gridc:#e9e5da;
  --g1:#2f5bd3; --g1s:#e8eefc; --g2:#b85c00; --g2s:#fbeedd; --g3:#7a3fb8; --g3s:#f1e8fb; --g4:#b3261e; --g4s:#fbe6e4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#13161d; --card:#1b1f28; --ink:#eaedf3; --muted:#a3abbc; --line:#2b313e;
    --accent:#86a4ff; --accent-ink:#0f1320; --soft:#222a3e; --gridc:#1a1e27;
    --g1:#8fa9ff; --g1s:#1f2840; --g2:#f0a050; --g2s:#33261a; --g3:#c49bf0; --g3s:#2a2238; --g4:#ff8a80; --g4s:#3a1f1d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
header.wrap{padding-top:22px;padding-bottom:12px}
.back{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:10px;font-size:15px}
.back:hover{text-decoration:underline}
h1{font:700 clamp(30px,7vw,42px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:15px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main.wrap{padding-top:18px;padding-bottom:56px;display:flex;flex-direction:column;gap:26px}
section h2{font:700 22px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px;color:var(--c)}
section h2 span{margin-right:8px}
section > p{color:var(--muted);margin:0 0 12px;font-size:15px}
.cards{display:grid;gap:10px}
@media (min-width:640px){ .cards{grid-template-columns:1fr 1fr} }
.card{display:flex;flex-direction:row;align-items:flex-start;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);
  border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);min-height:46px}
a.card:hover{border-color:var(--c)}
.card .body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
svg.art{width:56px;height:56px;flex:none;color:var(--c);fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
a.card:hover svg.art{transform:rotate(-6deg) scale(1.06)}
svg.art .f{fill:var(--cs)} svg.art .s{fill:currentColor;stroke:none}
svg.art text{fill:currentColor;stroke:none;font-family:"Bricolage Grotesque",Georgia,serif;font-weight:700;text-anchor:middle}
.card .t{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
a.card .t::after{content:"↗";color:var(--c);font-size:14px;margin-left:auto}
.card .d{color:var(--muted);font-size:15px}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;background:var(--cs);color:var(--c);border-radius:999px;padding:2px 9px;margin-top:4px}
.g1{--c:var(--g1);--cs:var(--g1s)} .g2{--c:var(--g2);--cs:var(--g2s)} .g3{--c:var(--g3);--cs:var(--g3s)} .g4{--c:var(--g4);--cs:var(--g4s)}
footer.wrap{color:var(--muted);font-size:14px;padding-top:18px;padding-bottom:40px;border-top:1px solid var(--line)}
@media (min-width:1000px){ .wrap{max-width:1200px} .cards{grid-template-columns:repeat(3,1fr)} }
#tabsat{display:none}
header.wrap .sitetabs{margin:0 0 18px}
@media (max-width:620px){header.wrap .sitetabs{position:sticky;top:0;z-index:6;margin:0 -16px 14px;border-radius:0;border-left:0;border-right:0}}
</style>
</head>
<body>
<header class="wrap">
  <a class="back" id="back" href="index.html">← Page d’accueil</a>
  <div id="tabsat"></div>
  <h1>Animations</h1>
  <p class="sub">Des animations à manipuler pour revoir et bien comprendre les notions de base. Elles s’ouvrent dans un nouvel onglet.</p>
</header>
<main class="wrap" id="main"></main>
<script src="stats.js"></script>
<footer class="wrap">Animations conçues pour la classe de M. Pluchet. Mesure d’audience anonyme, sans cookie (GoatCounter).</footer>
<script>
(function(){
var S = [
  {cls:'g1', ic:'🔢', titre:'Nombres et calcul', intro:'Décimaux, fractions, relatifs et priorités opératoires.', items:[
    {t:'Glisse-nombre', f:'glisse-nombre', d:'Multiplier ou diviser par 10, 100, 1 000 : les chiffres glissent, la virgule reste en place.', tag:'Décimaux · puissances de 10'},
    {t:'Droite graduée zoomable', f:'droite-zoom', d:'Zoomer entre deux graduations pour placer et comparer des nombres décimaux.', tag:'Comparer des décimaux'},
    {t:'Fractions en barres et en disques', f:'fractions', d:'Découper, colorier et comparer deux fractions. Quand sont-elles égales ?', tag:'Fractions'},
    {t:'Nombres relatifs', f:'relatifs', d:'Additionner et soustraire, sur la droite graduée ou avec des jetons + et −.', tag:'Relatifs'},
    {t:'Priorités opératoires', f:'priorites', d:'Clique sur l’opération à effectuer en premier, étape par étape.', tag:'Calcul'}
  ]},
  {cls:'g2', ic:'📊', titre:'Proportionnalité', intro:'Pourcentages, coefficient, passage à l’unité, graphique.', items:[
    {t:'Barre de pourcentage', f:'pourcentage', d:'Le pourcentage et la quantité avancent ensemble. Réductions et augmentations.', tag:'Pourcentages'},
    {t:'Tableau de proportionnalité', f:'proportionnalite', d:'Quatre façons de trouver une valeur manquante, et le graphique qui va avec.', tag:'Proportionnalité'}
  ]},
  {cls:'g3', ic:'📐', titre:'Géométrie et mesures', intro:'Angles, conversions, aires, périmètres et symétries.', items:[
    {t:'Somme des angles d’un triangle', f:'somme-angles', d:'Déplace les sommets, puis découpe les trois angles et recolle-les.', tag:'Angles'},
    {t:'Rapporteur virtuel', f:'rapporteur', d:'Centre, zéro sur un côté… et lis la bonne graduation !', tag:'Mesurer un angle'},
    {t:'Tableau de conversion', f:'conversions', d:'Longueurs, masses, contenances, aires et volumes : la virgule se déplace.', tag:'Conversions'},
    {t:'Aire et périmètre', f:'aire-perimetre', d:'Même aire mais périmètres différents… et inversement !', tag:'Aire · périmètre'},
    {t:'Symétries', f:'symetries', d:'Déplace la figure, l’axe ou le centre : la figure symétrique suit en direct.', tag:'Symétrie axiale et centrale'}
  ]}
];
var ART = {
  'glisse-nombre':'<rect class="f" x="6" y="20" width="52" height="24" rx="2"/><path d="M19 20v24M32 20v24M45 20v24" opacity=".4"/><text x="25.5" y="38" font-size="15">3</text><text x="38.5" y="38" font-size="15">4</text><path d="M32 44v10" stroke-width="3.5"/><path d="M50 12H14M20 7l-6 5 6 5"/>',
  'droite-zoom':'<path d="M6 18h52M6 46h52"/><path d="M10 14v8M54 14v8M10 42v8M54 42v8M32 15v6"/><path class="f" d="M32 18h6l16 28H10z" opacity=".6"/><circle class="s" cx="36" cy="46" r="3.5"/>',
  'fractions':'<circle class="f" cx="22" cy="32" r="15"/><path d="M22 17v30M22 32l13 7.5"/><path class="s" d="M22 32V17a15 15 0 0 1 13 22.5z"/><rect x="42" y="14" width="14" height="36" rx="1"/><path class="s" d="M42 32h14v18H42z"/>',
  'relatifs':'<path d="M4 40h56"/><path d="M12 36v8M22 36v8M32 34v12M42 36v8M52 36v8"/><path d="M32 26h18M45 21l5 5-5 5"/><path d="M50 16H22M27 11l-5 5 5 5"/>',
  'priorites':'<rect class="f" x="8" y="10" width="48" height="44" rx="4"/><text x="32" y="28" font-size="12">3+4×5</text><text x="32" y="46" font-size="12">= 23</text>',
  'pourcentage':'<rect x="6" y="14" width="52" height="12" rx="2"/><path class="s" d="M6 14h39v12H6z"/><rect x="6" y="38" width="52" height="12" rx="2"/><path class="f" d="M6 38h39v12H6z"/><path d="M45 8v48" stroke-dasharray="3 3"/>',
  'proportionnalite':'<path d="M8 56V8M8 56h50"/><path d="M8 56L52 14" stroke-dasharray="4 4"/><circle class="s" cx="19" cy="45.5" r="3"/><circle class="s" cx="30" cy="35" r="3"/><circle class="s" cx="45" cy="20.7" r="3"/>',
  'somme-angles':'<path class="f" d="M8 42L50 46 30 10z"/><path d="M8 56h48"/><path class="s" d="M32 56a10 10 0 0 1-10-10l10 10z" opacity=".7"/><path d="M22 56a10 10 0 0 1 20 0"/>',
  'rapporteur':'<path class="f" d="M6 46a26 26 0 0 1 52 0z"/><path d="M32 46l16-20M32 46H6" stroke-width="3"/><path d="M14 46a18 18 0 0 1 36 0" opacity=".5"/><circle class="s" cx="32" cy="46" r="2.5"/>',
  'conversions':'<rect class="f" x="4" y="22" width="56" height="22" rx="2"/><path d="M15 22v22M26 22v22M37 22v22M48 22v22" opacity=".4"/><text x="31" y="38" font-size="12">km m</text><path d="M24 54h16M35 49l5 5-5 5"/>',
  'aire-perimetre':'<rect class="f" x="10" y="14" width="44" height="30"/><path d="M21 14v30M32 14v30M43 14v30M10 24h44M10 34h44" opacity=".35"/><rect x="10" y="14" width="44" height="30" stroke-width="3.5"/>',
  'symetries':'<path d="M32 4v56" stroke-dasharray="4 4"/><path class="f" d="M26 46V14l-14 8 14 8"/><path d="M38 46V14l14 8-14 8"/>'
};
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
var main = document.getElementById('main');
S.forEach(function(s){
  var sec = el('section', s.cls), h = el('h2');
  h.appendChild(el('span', null, s.ic)); h.appendChild(document.createTextNode(s.titre));
  sec.appendChild(h); sec.appendChild(el('p', null, s.intro));
  var g = el('div', 'cards');
  s.items.forEach(function(it){
    var c = el('a', 'card');
    c.href = 'animations/' + it.f + '.html'; c.target = '_blank'; c.rel = 'noopener';
    c.onclick = function(){ if (window.stat) stat('animations · ' + it.t, it.t + ' (animations)', true); };
    if (ART[it.f]){ var a = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); a.setAttribute('class', 'art'); a.setAttribute('viewBox', '0 0 64 64'); a.setAttribute('aria-hidden', 'true'); a.innerHTML = ART[it.f]; c.appendChild(a); }
    var b = el('span', 'body');
    b.appendChild(el('span', 't', it.t)); b.appendChild(el('span', 'd', it.d));
    if (it.tag) b.appendChild(el('span', 'tag', it.tag));
    c.appendChild(b);
    g.appendChild(c);
  });
  sec.appendChild(g); main.appendChild(sec);
});
document.getElementById('back').href = 'index.html' + location.hash;
var cls = (location.hash.match(/^#([0-9a-zA-Z]+)\//) || [])[1];
if (window.stat) stat('/animations' + (cls ? '/' + cls : ''), 'Animations' + (cls ? ' ' + cls : ''));
})();
</script>
<script src="lib/sitetabs.js?v=4"></script>
<script>SiteTabs.mount(document.getElementById('tabsat'), 'animations');</script>
</body>
</html>
