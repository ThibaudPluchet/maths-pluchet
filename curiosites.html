<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curiosités – M. Pluchet</title>
<meta name="description" content="Vidéos, jeux, défis et films pour découvrir les mathématiques autrement.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f5bd3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b2333; --muted:#596277; --line:#e2ded3;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e8eefc; --gridc:#e9e5da;
  --g1:#2f5bd3; --g1s:#e8eefc; --g2:#b85c00; --g2s:#fbeedd; --g3:#7a3fb8; --g3s:#f1e8fb; --g4:#b3261e; --g4s:#fbe6e4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#13161d; --card:#1b1f28; --ink:#eaedf3; --muted:#a3abbc; --line:#2b313e;
    --accent:#86a4ff; --accent-ink:#0f1320; --soft:#222a3e; --gridc:#1a1e27;
    --g1:#8fa9ff; --g1s:#1f2840; --g2:#f0a050; --g2s:#33261a; --g3:#c49bf0; --g3s:#2a2238; --g4:#ff8a80; --g4s:#3a1f1d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
header.wrap{padding-top:22px;padding-bottom:12px}
.back{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:10px;font-size:15px}
.back:hover{text-decoration:underline}
h1{font:700 clamp(30px,7vw,42px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:15px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main.wrap{padding-top:18px;padding-bottom:56px;display:flex;flex-direction:column;gap:26px}
section h2{font:700 22px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px;color:var(--c)}
section h2 span{margin-right:8px}
section > p{color:var(--muted);margin:0 0 12px;font-size:15px}
.cards{display:grid;gap:10px}
@media (min-width:640px){ .cards{grid-template-columns:1fr 1fr} }
.card{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);
  border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);min-height:46px}
a.card:hover{border-color:var(--c)}
.card .t{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
a.card .t::after{content:"↗";color:var(--c);font-size:14px;margin-left:auto}
.card .d{color:var(--muted);font-size:15px}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;background:var(--cs);color:var(--c);border-radius:999px;padding:2px 9px;margin-top:4px}
.g1{--c:var(--g1);--cs:var(--g1s)} .g2{--c:var(--g2);--cs:var(--g2s)} .g3{--c:var(--g3);--cs:var(--g3s)} .g4{--c:var(--g4);--cs:var(--g4s)}
footer.wrap{color:var(--muted);font-size:14px;padding-top:18px;padding-bottom:40px;border-top:1px solid var(--line)}
@media (min-width:1000px){ .wrap{max-width:1100px} .cards{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<header class="wrap">
  <a class="back" id="back" href="index.html">← Page d’accueil</a>
  <h1>Curiosités</h1>
  <p class="sub">Des vidéos, des jeux et des films pour voir les maths autrement. Pour le plaisir, rien d’obligatoire&nbsp;!</p>
</header>
<main class="wrap" id="main"></main>
<script src="stats.js"></script>
<footer class="wrap">Ces liens mènent vers des sites extérieurs au collège. Mesure d’audience anonyme, sans cookie (GoatCounter).</footer>
<script>
(function(){
var S = [
  {cls:'g1', ic:'▶', titre:'Vidéos', intro:'Des chaînes et des séries qui racontent les maths avec humour ou de belles images.', items:[
    {t:'Micmaths', u:'https://www.youtube.com/@Micmaths', d:'Énigmes, tours de magie mathématiques et curiosités, par Mickaël Launay.', tag:'Pour commencer'},
    {t:'El Jj', u:'https://www.youtube.com/@ElJj', d:'Cartes, jeux, paradoxes : des sujets surprenants racontés avec beaucoup d’humour.'},
    {t:'Voyages au pays des maths', u:'https://leblob.fr/series/voyages-au-pays-des-maths', d:'Courts films d’animation d’une dizaine de minutes sur l’infini, le hasard, les formes…'},
    {t:'Dimensions', u:'https://www.dimensions-math.org/', d:'Un film en chapitres pour imaginer la 4e dimension. Commence par les premiers chapitres.'},
    {t:'Science Étonnante', u:'https://www.youtube.com/@ScienceEtonnante', d:'Quelques épisodes de maths sur le hasard et les paradoxes, pour les plus curieux.'},
    {t:'3Blue1Brown', u:'https://www.youtube.com/@3blue1brown', d:'Des animations magnifiques (en anglais, sous-titres français). Pour les plus motivés.', tag:'Plutôt en 3e'}
  ]},
  {cls:'g2', ic:'🎲', titre:'Jeux et défis', intro:'Pour chercher, calculer et réfléchir en s’amusant.', items:[
    {t:'Euclidea', u:'https://www.euclidea.xyz/', d:'Des puzzles de constructions à la règle et au compas, niveau après niveau.', tag:'Géométrie'},
    {t:'Mathador', u:'https://www.mathador.fr/', d:'Le jeu de calcul mental : atteindre un nombre cible avec cinq nombres.', tag:'Calcul mental'},
    {t:'Castor informatique', u:'https://castor-informatique.fr/', d:'Des défis de logique et d’algorithmique, sans avoir besoin de savoir programmer.', tag:'Algorithmique'},
    {t:'Algoréa', u:'https://algorea.org/', d:'Programmer pour résoudre des défis, du niveau débutant jusqu’aux plus difficiles.', tag:'Programmation'},
    {t:'Kangourou des mathématiques', u:'https://www.mathkang.org/', d:'Les énigmes du célèbre concours : idéales pour s’entraîner à chercher.'},
    {t:'Art avec Desmos', u:'https://www.desmos.com/art-2023?lang=fr', d:'Des dessins entièrement réalisés avec des équations. Étonnant !', tag:'Fonctions'}
  ]},
  {cls:'g4', ic:'🎬', titre:'À voir en film', intro:'Des histoires vraies de mathématiciennes et de mathématiciens.', items:[
    {t:'Les Figures de l’ombre', d:'Trois mathématiciennes de la NASA qui ont aidé à envoyer des astronautes dans l’espace.'},
    {t:'Imitation Game', d:'Alan Turing et le décodage des messages secrets pendant la Seconde Guerre mondiale.'},
    {t:'L’homme qui défiait l’infini', d:'Ramanujan, jeune prodige indien autodidacte devenu un grand mathématicien.'}
  ]}
];
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
var main = document.getElementById('main');
S.forEach(function(s){
  var sec = el('section', s.cls), h = el('h2');
  h.appendChild(el('span', null, s.ic)); h.appendChild(document.createTextNode(s.titre));
  sec.appendChild(h); sec.appendChild(el('p', null, s.intro));
  var g = el('div', 'cards');
  s.items.forEach(function(it){
    var c = el(it.u ? 'a' : 'div', 'card');
    if (it.u){ c.href = it.u; c.target = '_blank'; c.rel = 'noopener';
      c.onclick = function(){ if (window.stat) stat('curiosites · ' + it.t, it.t + ' (curiosités)', true); }; }
    c.appendChild(el('span', 't', it.t)); c.appendChild(el('span', 'd', it.d));
    if (it.tag) c.appendChild(el('span', 'tag', it.tag));
    g.appendChild(c);
  });
  sec.appendChild(g); main.appendChild(sec);
});
document.getElementById('back').href = 'index.html' + location.hash;
var cls = (location.hash.match(/^#([0-9a-zA-Z]+)\//) || [])[1];
if (window.stat) stat('/curiosites' + (cls ? '/' + cls : ''), 'Curiosités' + (cls ? ' ' + cls : ''));
})();
</script>
</body>
</html>
