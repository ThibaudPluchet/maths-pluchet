<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier de vacances 3e → 2de – M. Pluchet</title>
<meta name="description" content="Mission Seconde : les vidéos et exercices en ligne du cahier de vacances de 3e.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f5bd3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b2333; --muted:#596277; --line:#e2ded3;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e8eefc; --gridc:#e9e5da;
  --g1:#2f5bd3; --g1s:#e8eefc; --g2:#b85c00; --g2s:#fbeedd; --g3:#7a3fb8; --g3s:#f1e8fb; --g4:#b3261e; --g4s:#fbe6e4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#13161d; --card:#1b1f28; --ink:#eaedf3; --muted:#a3abbc; --line:#2b313e;
    --accent:#86a4ff; --accent-ink:#0f1320; --soft:#222a3e; --gridc:#1a1e27;
    --g1:#8fa9ff; --g1s:#1f2840; --g2:#f0a050; --g2s:#33261a; --g3:#c49bf0; --g3s:#2a2238; --g4:#ff8a80; --g4s:#3a1f1d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
header.wrap{padding-top:22px;padding-bottom:12px}
.back{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:10px;font-size:15px}
.back:hover{text-decoration:underline}
h1{font:700 clamp(30px,7vw,42px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:15px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main.wrap{padding-top:18px;padding-bottom:56px;display:flex;flex-direction:column;gap:26px}
section h2{font:700 22px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px;color:var(--c)}
section h2 span{margin-right:8px}
section > p{color:var(--muted);margin:0 0 12px;font-size:15px}
.cards{display:grid;gap:10px}
@media (min-width:640px){ .cards{grid-template-columns:1fr 1fr} }
.card{display:flex;flex-direction:row;align-items:flex-start;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);
  border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);min-height:46px}
a.card:hover{border-color:var(--c)}
.card .body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
svg.art{width:56px;height:56px;flex:none;color:var(--c);fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
a.card:hover svg.art{transform:rotate(-6deg) scale(1.06)}
svg.art .f{fill:var(--cs)} svg.art .s{fill:currentColor;stroke:none}
svg.art text{fill:currentColor;stroke:none;font-family:"Bricolage Grotesque",Georgia,serif;font-weight:700;text-anchor:middle}
.card .t{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
a.card .t::after{content:"↗";color:var(--c);font-size:14px;margin-left:auto}
.card .d{color:var(--muted);font-size:15px}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;background:var(--cs);color:var(--c);border-radius:999px;padding:2px 9px;margin-top:4px}
.g1{--c:var(--g1);--cs:var(--g1s)} .g2{--c:var(--g2);--cs:var(--g2s)} .g3{--c:var(--g3);--cs:var(--g3s)} .g4{--c:var(--g4);--cs:var(--g4s)}
footer.wrap{color:var(--muted);font-size:14px;padding-top:18px;padding-bottom:40px;border-top:1px solid var(--line)}
@media (min-width:1000px){ .wrap{max-width:1200px} .cards{grid-template-columns:repeat(3,1fr)} }
#tabsat{display:none}
header.wrap .sitetabs{margin:0 0 18px}
@media (max-width:620px){header.wrap .sitetabs{position:sticky;top:0;z-index:6;margin:0 -16px 14px;border-radius:0;border-left:0;border-right:0}}

.etape{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;scroll-margin-top:16px}
.etape.cible{border:2px solid var(--accent);box-shadow:0 0 0 5px var(--soft)}
.etape h2{color:var(--ink)}
.etape h2 .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--card);font-size:17px;margin-right:10px}
.etape .theme{color:var(--muted);font-size:15px;margin:0 0 10px}
.seance{margin-top:12px}
.seance h3{font:700 16px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;margin:0 0 6px}
.res{display:flex;flex-wrap:wrap;gap:8px}
.res a,.res span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-size:15px;font-weight:700;text-decoration:none;border:1px solid var(--line)}
.res a.video{background:var(--g4s);color:var(--g4);border-color:var(--g4s)}
.res a.exo{background:var(--g1s);color:var(--g1);border-color:var(--g1s)}
.res a.anim{background:var(--g3s);color:var(--g3);border-color:var(--g3s)}
.res a:hover{border-color:currentColor}
.res span.soon{color:var(--muted);font-weight:400;font-style:italic;background:transparent;border-style:dashed}
.bientot{color:var(--muted);font-style:italic;margin:4px 0 0}
</style>
</head>
<body>
<header class="wrap">
  <a class="back" id="back" href="index.html">← Page d’accueil</a>
  <h1>Mission Seconde</h1>
  <p class="sub">Cahier de vacances 3<sup>e</sup> → 2<sup>de</sup> : les vidéos et les exercices en ligne de chaque étape. Le QR code de ton cahier t’amène directement à la bonne étape.</p>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap">Vidéos d’Yvan Monka, partagées via Digiview. Bon été et bonne mission !</footer>
<script src="stats.js"></script>
<script>
(function(){
// ----- Contenu : une entrée par étape, une liste de ressources par séance -----
// type : "video" (Digiview), "exo" (exercices interactifs du site), "anim" (animation du site) ; pas de lien = « bientôt »
var E = [
 {n:1, lieu:"Cany", theme:"Fractions, priorités, puissances — un pas vers la 2de : les ensembles de nombres", seances:null},
 {n:2, lieu:"Veulettes", theme:"Racines carrées, notation scientifique — un pas vers la 2de : calculer avec les racines", seances:null},
 {n:3, lieu:"Fécamp", theme:"Développer, factoriser, identités remarquables", seances:null},
 {n:4, lieu:"Étretat", theme:"Le secret de l’Aiguille creuse : équations, inéquations et premiers intervalles", seances:[
   {t:"Séance 1 · Résoudre une équation", r:[
     {type:"video", t:"Vidéo : tester une solution", u:"https://ladigitale.dev/digiview/#/v/04b302f985c7ed2f"},
     {type:"video", t:"Vidéo : résoudre une équation", u:"https://ladigitale.dev/digiview/#/v/db1a724f21e11d4c"},
     {type:"anim", t:"Animation : la balance", u:"anim/GuZhDTkbrdWUhMUsBNaTHo.html#resoudre"},
     {type:"exo", t:"S’entraîner : tester un nombre", u:"exos/3e-s07.html#n10"},
     {type:"exo", t:"S’entraîner : résoudre", u:"exos/3e-s07.html#n11"},
     {type:"exo", t:"MathALÉA : tester un nombre", u:"https://coopmaths.fr/alea/?uuid=d8841&id=5N5C&i=1&numerique=1&v=eleve&es=211100110"},
     {type:"exo", t:"MathALÉA : résoudre", u:"https://coopmaths.fr/alea/?uuid=23bdc&id=3L13&n=5&d=10&s=true&s2=8&s3=false&s4=false&s5=1&i=1&cd=1&tip=0&uuid=5a02b&id=3L13-0&n=5&d=10&s=true&s2=4&i=1&cd=1&tip=0&uuid=b9e01&id=3L13-1&i=1&numerique=1&v=eleve&es=211100110"}]},
   {t:"Séance 2 · Mettre un problème en équation", r:[{t:"Vidéo bientôt disponible"}]},
   {t:"Séance 3 · Équations produit nul et x² = a", r:[
     {type:"video", t:"Vidéo : factoriser avec a² − b²", u:"https://ladigitale.dev/digiview/#/v/3dfeb282364e7ae4"},
     {type:"exo", t:"MathALÉA : équations produit et x² = a", u:"https://coopmaths.fr/alea/?numerique=1&uuid=ecf62&id=3L14&i=1&uuid=57f44&id=3L15-1&i=1&uuid=0f844&id=3L15-2&i=1&uuid=231d3&id=3L15&i=1&v=eleve"},
     {type:"exo", t:"MathALÉA : factoriser", u:"https://coopmaths.fr/alea/?numerique=1&uuid=be157&id=3L12-1&i=1&uuid=81fd2&id=3L12&i=1&uuid=7f0cf&id=3L11-16&i=1&v=eleve"},
     {t:"Vidéo produit nul bientôt disponible"}]},
   {t:"Séance 4 · Inéquations et intervalles", r:[{t:"Vidéo bientôt disponible"}]}
 ]},
 {n:5, lieu:"Le Havre", theme:"Fonctions linéaires et affines — un pas vers la 2de : le coefficient directeur", seances:null},
 {n:6, lieu:"Saint-Valery-en-Caux", theme:"Pythagore, Thalès, trigonométrie — un pas vers la 2de : les vecteurs", seances:null},
 {n:7, lieu:"Paluel", theme:"Pourcentages, statistiques, probabilités", seances:null},
 {n:8, lieu:"Rouen", theme:"Algorithmique : de Scratch à Python", seances:null}
];
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
var main = document.getElementById('main');
E.forEach(function(e){
  var sec = el('section', 'etape'); sec.id = 'etape' + e.n;
  var h = el('h2'); h.appendChild(el('span', 'num', String(e.n))); h.appendChild(document.createTextNode('Étape ' + e.n + ' · ' + e.lieu));
  sec.appendChild(h); sec.appendChild(el('p', 'theme', e.theme));
  if (!e.seances){ sec.appendChild(el('p', 'bientot', 'En préparation : les ressources arriveront avant l’été.')); }
  else e.seances.forEach(function(s){
    var d = el('div', 'seance'); d.appendChild(el('h3', null, s.t));
    var g = el('div', 'res');
    s.r.forEach(function(r){
      if (!r.u){ g.appendChild(el('span', 'soon', r.t)); return; }
      var a = el('a', r.type, (r.type === 'video' ? '▶ ' : r.type === 'exo' ? '✎ ' : '◆ ') + r.t);
      a.href = r.u; a.target = '_blank'; a.rel = 'noopener';
      a.onclick = function(){ if (window.stat) stat('vacances · ' + r.t, r.t + ' (cahier de vacances)', true); };
      g.appendChild(a);
    });
    d.appendChild(g); sec.appendChild(d);
  });
  main.appendChild(sec);
});
function cible(){
  var m = location.hash.match(/^#etape(\d)/);
  document.querySelectorAll('.etape').forEach(function(s){ s.classList.remove('cible'); });
  if (m){ var s = document.getElementById('etape' + m[1]); if (s){ s.classList.add('cible'); s.scrollIntoView(); } }
}
window.addEventListener('hashchange', cible); cible();
if (window.stat) stat('/cahier-vacances' + location.hash, 'Cahier de vacances ' + location.hash);
})();
</script>
</body>
</html>
