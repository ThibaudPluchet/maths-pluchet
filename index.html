<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths – M. Pluchet</title>
<meta name="description" content="Les documents de mathématiques distribués en classe, pour les élèves du collège Louis Bouilhet.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f5bd3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b2333; --muted:#596277; --line:#e2ded3;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e8eefc; --new:#d6336c;
  --g1:#2f5bd3; --g1s:#e8eefc; --g2:#b85c00; --g2s:#fbeedd; --g3:#7a3fb8; --g3s:#f1e8fb; --g4:#b3261e; --g4s:#fbe6e4; --g5:#0e7a6e; --g5s:#dcf3ef;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#13161d; --card:#1b1f28; --ink:#eaedf3; --muted:#a3abbc; --line:#2b313e;
    --accent:#86a4ff; --accent-ink:#0f1320; --soft:#222a3e; --new:#ff7aa5;
    --g1:#8fa9ff; --g1s:#1f2840; --g2:#f0a050; --g2s:#33261a; --g3:#c49bf0; --g3s:#2a2238; --g4:#ff8a80; --g4s:#3a1f1d; --g5:#5fd3c2; --g5s:#15302c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
header.wrap{padding-top:32px;padding-bottom:14px}
h1{font:700 clamp(30px,7vw,42px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:15px}
.picker{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.picker-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lvl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (min-width:600px){ .lvl + .lvl{margin-left:6px;padding-left:12px;border-left:1px solid var(--line)} }
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:10px 16px;font:700 16px "Atkinson Hyperlegible",sans-serif;cursor:pointer;min-height:44px;min-width:60px}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main.wrap{padding-top:22px;padding-bottom:56px;display:flex;flex-direction:column;gap:26px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 15px "Atkinson Hyperlegible",sans-serif;padding:9px 14px;border-radius:9px;cursor:pointer;min-height:42px}
.tabs button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}
.kicker{font:700 13px "Atkinson Hyperlegible",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.hero{background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:20px;box-shadow:0 6px 24px -14px var(--accent)}
.hero .seqname{color:var(--muted);font-size:15px;margin:0 0 4px}
.hero h2{font:700 clamp(22px,5vw,28px)/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 16px}
.code{font:700 13px "Atkinson Hyperlegible",sans-serif;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 7px;margin-right:8px;vertical-align:3px}
.groups{display:grid;gap:14px}
@media (min-width:640px){ .hero .groups{grid-template-columns:1fr 1fr} }
.grp h4{margin:0 0 6px;font:700 13px "Atkinson Hyperlegible",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--c)}
.links{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--cs);
  border:1px solid transparent;border-radius:10px;padding:10px 12px;min-height:46px;font-weight:700;font-size:16px}
.doc:hover{border-color:var(--c)}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .mt{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;font-weight:600}
.mrow .mt .ic{width:26px;height:26px;border-radius:7px;background:var(--c);color:var(--card);display:grid;place-items:center;font-size:13px;flex:none}
.mrow .chips{display:flex;gap:6px;flex:none}
.doc.chip{padding:6px 8px;min-width:50px;justify-content:center;font-weight:700}
@media (max-width:420px){.mrow .chips{gap:4px}.doc.chip{min-width:44px;padding:6px}.mrow{gap:8px}.mrow .mt{gap:8px}}
@media (max-width:340px){.mrow{flex-wrap:wrap}}
.doc.chip .t{flex:none}
.mrow.wide{align-items:flex-start}
.mrow.wide .mt{flex:none;width:72px;min-height:40px}
.mrow.wide .chips{flex:1 1 auto;flex-wrap:wrap}
.mrow.wide .doc.chip{min-height:40px}
.doc .ic{width:26px;height:26px;border-radius:7px;background:var(--c);color:var(--card);display:grid;place-items:center;font-size:13px;flex:none}
.doc .t{flex:1}
.doc .ext{color:var(--muted);font-size:13px;font-weight:400}
.badge{font:700 12px "Atkinson Hyperlegible",sans-serif;color:#fff;background:var(--new);border-radius:999px;padding:2px 8px}
.g1{--c:var(--g1);--cs:var(--g1s)} .g2{--c:var(--g2);--cs:var(--g2s)} .g3{--c:var(--g3);--cs:var(--g3s)} .g4{--c:var(--g4);--cs:var(--g4s)} .g5{--c:var(--g5);--cs:var(--g5s)}
details.seq{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.seq + details.seq{margin-top:10px}
details.seq > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px;min-height:52px}
details.seq > summary::-webkit-details-marker{display:none}
details.seq > summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
details.seq[open] > summary::after{transform:rotate(180deg)}
summary .sn{color:var(--muted);font-size:14px;white-space:nowrap}
summary .st{font:700 18px/1.2 "Bricolage Grotesque",system-ui,sans-serif}
summary .badge{margin-left:4px}
.notion{border-top:1px solid var(--line);padding:16px 18px}
.notion h3{font-size:17px;margin:0 0 12px}
.notion .groups{grid-template-columns:1fr}
@media (min-width:640px){ .notion .groups{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))} }
.dnbintro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--muted);font-size:15px}
.dnbintro p{margin:0}.dnbintro .dnbmore{margin-top:6px;font-size:14px}
.dnbseq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.dnbseq h3{margin:0 0 6px;font-size:17px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.dnbno{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dnbn{margin-left:auto;font-size:13px;font-weight:400;color:var(--muted)}
.dnbrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--line)}
.dnbinfo{display:flex;flex-direction:column;gap:2px;flex:1 1 260px;min-width:0}
.dnbsrc{font-size:13px;color:var(--muted)}
.dnbacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dnbbtn{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--ink);cursor:pointer}
.dnbbtn:hover{border-color:currentColor}
.dnbview{display:flex;flex-direction:column;gap:14px;scroll-margin-top:84px}
.dnbview > .dnbmore{margin:0;color:var(--muted);font-size:15px}
.seqbtn.sujbtn{grid-column:1/-1;flex-wrap:wrap;gap:12px 16px!important;padding:16px 18px;min-height:0;border:2px solid var(--accent);background:linear-gradient(120deg,var(--soft),var(--card) 75%);box-shadow:0 4px 14px rgba(47,91,211,.14)}
.seqbtn.sujbtn .tile{width:52px;height:52px;flex:0 0 52px;background:var(--accent);color:var(--accent-ink);border-radius:14px}
.seqbtn.sujbtn .tile svg{width:30px;height:30px}
.seqbtn.sujbtn .txt{flex:1 1 200px}
.seqbtn.sujbtn .sk{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--new)}
.seqbtn.sujbtn .st{font-size:20px!important}
.seqbtn.sujbtn .sd{font-size:14px;color:var(--muted)}
.seqbtn.sujbtn .go{margin-left:auto;align-self:center;font-weight:700;font-size:15px;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.seqbtn.sujbtn[aria-pressed="true"] .sk,.seqbtn.sujbtn[aria-pressed="true"] .sd{color:var(--accent-ink);opacity:.9}
.seqbtn.sujbtn[aria-pressed="true"] .go{background:var(--accent-ink);color:var(--accent)}
.seqbtn.sujbtn[aria-pressed="true"] .tile{background:var(--accent-ink);color:var(--accent)}
.dnbrow.first{border-top:0;padding-top:2px}
.dnbacts .doc{border:1px solid var(--line);border-radius:10px;padding:7px 12px;text-decoration:none}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.intro{color:var(--muted);margin:-8px 0 0;font-size:15px}
.rev-n{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.rev-n h3{font-size:16px;margin:0 0 10px}
.rev-n .links{flex-direction:row;flex-wrap:wrap}
.rev-n .doc{flex:1 1 220px}
footer.wrap{color:var(--muted);font-size:14px;padding-top:18px;padding-bottom:40px;border-top:1px solid var(--line)}

/* cahier quadrillé + bannière */
body{background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:22px 22px}
:root{--gridc:#e9e5da;--brick:#b5533c;--stone:#efe6d2;--slate:#3d4658;--win:#26324a;--water:#7fb2d6;--hill:#9cc58a;--hill2:#c3dcae;--tree:#5f9a55;--sky1:#dbeafb;--sky2:#f7f3e8;--axis:#d6336c;--sym:#2f5bd3}
@media (prefers-color-scheme: dark){:root{--gridc:#1a1e27;--brick:#9a4a37;--stone:#cfc5b1;--slate:#55607a;--win:#0e1422;--water:#2c5878;--hill:#3c5d38;--hill2:#2c4429;--tree:#2f5a2c;--sky1:#1b2640;--sky2:#151a24;--axis:#ff7aa5;--sym:#86a4ff}}
/* en-tête : le dessin du château sur toute la largeur, le titre posé dans le dessin, à gauche */
.headrow{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.banner{display:block;width:100%;height:clamp(170px,20vw,250px)}
.headrow .htxt{position:absolute;left:clamp(14px,3vw,30px);top:50%;transform:translateY(-58%);max-width:min(560px,56%);
  padding:12px 18px 12px 16px;border-radius:14px;background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.headrow h1{margin:0 0 4px}
.headrow .sub{margin:0}
/* téléphone : pas la place de poser le titre sans cacher le château : titre au-dessus, dessin en dessous */
@media (max-width:620px){
  .headrow{display:flex;flex-direction:column;border:0;border-radius:0;overflow:visible}
  .headrow .htxt{position:static;transform:none;max-width:none;padding:0 0 12px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .banner{height:150px;border-radius:16px;border:1px solid var(--line)}
}
.banner .gridline{stroke:var(--sym);stroke-opacity:.08;stroke-width:1}
.banner .sky1{stop-color:var(--sky1)} .banner .sky2{stop-color:var(--sky2)}
.banner .hill{fill:var(--hill)} .banner .hill2{fill:var(--hill2)} .banner .trees{fill:var(--tree)}
.banner .brick{fill:var(--brick)} .banner .stone{fill:var(--stone)} .banner .slate{fill:var(--slate)} .banner .win{fill:var(--win)}
.banner .stoneline{stroke:var(--stone);stroke-width:4}
.banner .water{fill:var(--water)} .banner .ripple{stroke:#fff;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:18 14}
.banner .axis{stroke:var(--axis);stroke-width:2;stroke-dasharray:10 6 2 6}
.banner .lbl{fill:var(--axis);font:700 14px "Atkinson Hyperlegible",sans-serif}
.banner .rightangle,.banner .hl,.banner .dim path{fill:none;stroke:var(--axis);stroke-width:2}
.banner .sym{fill:var(--sym);stroke:var(--sym);fill-opacity:.22;stroke-opacity:.22;font-family:"Bricolage Grotesque",Georgia,serif;font-style:italic}
.banner .sym text{stroke:none}
.banner .cap{fill:var(--ink);fill-opacity:.7;font:700 13px "Atkinson Hyperlegible",sans-serif}
.hero{position:relative;overflow:hidden}
.hero::after{content:"π";position:absolute;right:14px;top:-18px;font:italic 700 120px/1 "Bricolage Grotesque",Georgia,serif;color:var(--accent);opacity:.07;pointer-events:none}
.kicker::before{content:"✦ ";color:var(--accent)}
details.seq > summary .sn::before{content:"△ ";color:var(--accent)}
.empty::before{content:"📐";display:block;font-size:40px;margin-bottom:6px}
footer.wrap::before{content:"π ≈ 3,14159…   √2 ≈ 1,414…   a² + b² = c²";display:block;font:italic 15px "Bricolage Grotesque",Georgia,serif;color:var(--accent);opacity:.6;margin-bottom:8px;letter-spacing:.04em;white-space:pre-wrap}
.seqnav .kicker{margin-bottom:8px}
.seqlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.seqbtn{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;min-height:56px}
.seqbtn:hover{border-color:var(--accent)}
.seqbtn .sn{font-size:13px;color:var(--muted);font-weight:700}
.seqbtn .st{font:700 16px/1.2 "Bricolage Grotesque",system-ui,sans-serif}
.seqbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seqbtn[aria-pressed="true"] .sn{color:var(--accent-ink);opacity:.85}
/* petits dessins : onglets et séquences */
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:currentColor;stroke:none}
.tabs button{display:inline-flex;align-items:center;gap:7px}
.tabs .ico{width:19px;height:19px}
.tile{width:40px;height:40px;border-radius:11px;padding:8px;color:var(--ic,var(--accent));background:color-mix(in srgb,var(--ic,var(--accent)) 14%,transparent)}
.t-nb{--ic:#2f6fd6} .t-calc{--ic:#7b4fd0} .t-geo{--ic:#1d8a5a} .t-data{--ic:#d0661c}
@media (prefers-color-scheme:dark){ .t-nb{--ic:#7ea6ff} .t-calc{--ic:#b79bff} .t-geo{--ic:#5fd09a} .t-data{--ic:#ff9a5c} }
.seqbtn.withico{flex-direction:row;align-items:center;gap:11px}
.seqbtn .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.seqbtn[aria-pressed="true"] .tile{color:var(--accent-ink);background:rgba(255,255,255,.2)}
.seqhead.withico{display:flex;align-items:center;gap:14px}
.seqhead .tile{width:56px;height:56px;padding:11px;border-radius:15px}
.seqbtn .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--new)}
.seqview{display:flex;flex-direction:column;gap:14px;scroll-margin-top:84px}
.seqhead .seqname{color:var(--muted);font-size:15px;margin:0 0 2px;font-weight:700}
.seqhead h2{font:700 clamp(22px,5vw,28px)/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
.seqview .notion{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.seqview .notion.current{border:2px solid var(--accent);box-shadow:0 6px 24px -14px var(--accent);position:relative;overflow:hidden}
.seqview .notion.current::after{content:"π";position:absolute;right:14px;top:-18px;font:italic 700 120px/1 "Bricolage Grotesque",Georgia,serif;color:var(--accent);opacity:.07;pointer-events:none}
.seqview .notion h3{font-size:18px;margin:0 0 14px}
@media (min-width:640px){ .seqview .notion .groups{grid-template-columns:1fr 1fr} }
.tabs .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--new);margin-left:6px;vertical-align:2px}
.evcard .evkind{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px}
.evcard.common{border-left:5px solid var(--accent)}
.evcard .evns{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 14px}
.evcard .evns span{font-size:13px;background:var(--soft);color:var(--ink);border-radius:999px;padding:3px 10px}
.evcard .evns b{color:var(--accent);margin-right:4px}
.dmcard{border-left:5px solid var(--hi,#d6336c)}
.dmcard .dmres{margin:0 0 14px;line-height:1.45}
.dmcard .dmtip{margin:12px 0 0;font-size:14px;color:var(--muted);background:var(--soft);border-radius:10px;padding:9px 12px}
/* évaluation à venir */
.upcard{border:2px solid var(--hi,#d6336c);background:linear-gradient(135deg,color-mix(in srgb,var(--hi,#d6336c) 9%,var(--card)),var(--card))}
.upcard .evkind{color:var(--hi,#d6336c)}
.upcard .when{display:inline-block;font-weight:700;font-size:13px;color:#fff;background:var(--hi,#d6336c);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:2px}
.upcard .blanc{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--accent-ink);background:var(--accent);border-radius:14px;padding:12px 16px;margin:4px 0 14px;font-weight:700}
.upcard .blanc .ic{font-size:26px}
.upcard .blanc small{display:block;font-weight:400;opacity:.9}
.upbanner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--hi,#d6336c);border-radius:14px;padding:10px 14px;margin:0 0 14px;background:var(--card)}
.upbanner b{color:var(--hi,#d6336c)}
.upbanner{cursor:pointer;transition:box-shadow .15s,transform .15s}
.upbanner:hover{box-shadow:0 6px 18px -10px var(--hi,#d6336c);transform:translateY(-1px)}
.upbanner:focus-visible{outline:3px solid var(--hi,#d6336c);outline-offset:2px}
.seqview h2.cat{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 0}
.upbanner button{font:700 15px inherit;font-family:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--hi,#d6336c);color:#fff;cursor:pointer}
/* grand écran : on exploite la largeur */
@media (min-width:1000px){
  .wrap{max-width:1200px}
  .seqview{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .seqview > .seqhead, .seqview > .intro, .seqview > .notion.current{grid-column:1/-1}
  .seqview > .upcard, .seqview > h2.cat{grid-column:1/-1}
  .seqview .notion.upcard .groups{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .seqview .notion.upcard .groups .pn{grid-column:1/-1}
  .seqview .notion.upcard .groups .pn .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .seqview .notion.current .groups{grid-template-columns:repeat(4,1fr)}
  .seqview .notion:not(.current) .groups{grid-template-columns:1fr 1fr}
  .seqlist{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pill.allpill{font-weight:700}
.profnote{flex-basis:100%;margin:0 0 2px;padding:8px 12px;border-radius:10px;background:#fff4d6;color:#6b4a00;font-size:14px;border:1px solid #f0d27a}
@media (prefers-color-scheme:dark){ .profnote{background:#3a2f12;color:#f3d98b;border-color:#6b5a26} }
</style>
</head>
<body>
<header class="wrap">
  <div class="headrow">
  <div class="htxt">
  <h1>Mathématiques</h1>

<footer class="wrap">Les documents apparaissent ici au fur et à mesure qu'ils sont distribués en classe. Vidéos : Yvan Monka. · Mesure d’audience anonyme, sans cookie (GoatCounter).</footer>
<script>
function start(D){
  var picker = document.getElementById('picker'), main = document.getElementById('main');
  var GROUPS = [
    {key:'comprendre', title:'Comprendre', cls:'g1', types:['activite','cours','video']},
    {key:'entrainer', title:'S’entraîner', cls:'g2', types:['exercices','correction-exo','exo']},
    {key:'reviser', title:'Réviser', cls:'g3', types:['revision','carte']},
    {key:'visualiser', title:'Visualiser', cls:'g5', types:['anim']},
    {key:'evaluer', title:'Évaluation', cls:'g4', types:['evaluation','correction']}
  ];
  var ICON = {dm:'🎨', blanc:'📝', exo:'🎮', anim:'✨', cours:'📘', activite:'💡', video:'▶', exercices:'✏️', alea:'💻', revision:'📝', carte:'🧠', evaluation:'📄', correction:'✅', 'correction-exo':'✔️'};
  function store(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function levelOf(c){ if (D.prof && D.classes[c]) return c; for (var l in D.classes) if (D.classes[l].indexOf(c) > -1) return l; }
  function find(c){ c = (c || '').toLowerCase(); for (var l in D.classes) for (var i = 0; i < D.classes[l].length; i++) if (D.classes[l][i].toLowerCase() === c) return D.classes[l][i]; return ''; }
  // Adresse de classe (#3eE) : la classe est fixée et le choix des classes est masqué (accès élèves).
  // Adresse sans # : choix des classes affiché (accès enseignant).
  var hashParts = decodeURIComponent(location.hash.slice(1)).split('/');
  var locked = find(hashParts[0]);
  var current = locked || find(store('classe'));
  if (locked){ picker.parentNode.hidden = true; document.title = 'Maths ' + locked + ' – M. Pluchet'; }
  if (D.prof){
    document.title = 'Maths – accès enseignant';
    var pn = el('p', 'profnote', 'Accès enseignant : tous les documents de la page enseignant, que les cases soient cochées ou non. « Toutes les 4e / 3e » montre tout le niveau ; une classe montre ses propres sujets d’évaluation.');
    picker.insertBefore(pn, picker.firstChild);   // dans la colonne du site (même largeur que le reste)
  }
  // Adresse de la page (avec la classe) gardée pour le bouton « Retour » des exerciseurs
  try { localStorage.setItem('mp:retour', location.href); } catch(e){}
  window.addEventListener('hashchange', function(){ location.reload(); });
  var view = 'cours', seen = null, firstVisit = false, seqSel = null, dnbSel = null;
  // ?vue=evals : ouvre directement l'onglet Évaluations (bouton « Retour » des exerciseurs d'évaluation)
  if (/[?&]vue=evals\b/.test(location.search)){ view = 'evals'; try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){} }

  Object.keys(D.classes).forEach(function(l){
    if (!D.classes[l].length) return;
    var g = el('div','lvl'); g.setAttribute('role','group'); g.setAttribute('aria-label','Classes de ' + l);
    // accès enseignant : « Toutes les 4e » / « Toutes les 3e » montre tout le niveau, toutes classes confondues
    (D.prof ? [l] : []).concat(D.classes[l]).forEach(function(c){
      var b = el('button','pill' + (c === l ? ' allpill' : ''), c === l ? 'Toutes les ' + l : c); b.dataset.c = c;
      b.onclick = function(){ current = c; store('classe', c); seqSel = null; dnbSel = null; view = 'cours'; loadSeen(); render(); };
      g.appendChild(b);
    });
    picker.appendChild(g);
  });

  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  // « Toutes les 4e » (accès enseignant) : current vaut le niveau lui-même
  function allMode(){ return !!(D.prof && D.classes[current]); }
  function mine(list){ return allMode() ? list : list.filter(function(x){ return x.cls.indexOf(current) > -1; }); }
  // date d'une évaluation à venir pour la classe choisie (toutes classes : la plus proche)
  function dOf(e){ if (!allMode()) return e.dates[current]; var t = todayIso(), v = Object.keys(e.dates).map(function(k){ return e.dates[k]; }).filter(function(x){ return x >= t; }).sort(); return v[0]; }

  // « Nouveau » : tout ce qui n'était pas là à la dernière visite de cette classe sur cet appareil
  function loadSeen(){
    var raw = store('vu:' + current);
    firstVisit = raw === null;
    try { seen = raw ? JSON.parse(raw) : {}; } catch(e){ seen = {}; }
  }
  function isNew(it){ return !firstVisit && !seen[it.href]; }
  function saveSeen(all){ var s = {}; all.forEach(function(it){ s[it.href] = 1; }); store('vu:' + current, JSON.stringify(s)); }

  function link(it){
    var a = el('a','doc'); a.target = '_blank'; a.rel = 'noopener';
    // PDF : ouverts dans la visionneuse du site (certains navigateurs du collège n'affichent pas les PDF)
    if (it.enc) a.href = 'voir.html?e=' + encodeURIComponent(it.enc) + '&t=' + encodeURIComponent(it.label) + '#k=' + KEY;
    else a.href = /\.pdf$/i.test(it.href) ? 'voir.html?v=3&f=' + encodeURIComponent(it.href) + '&t=' + encodeURIComponent(it.label) : it.href;
    a.appendChild(el('span','ic', ICON[it.type] || '•'));
    a.appendChild(el('span','t', it.label));
    if (isNew(it)) a.appendChild(el('span','badge','Nouveau'));
    else if (it.type === 'video' || it.type === 'alea' || it.type === 'anim' || it.type === 'exo' || it.type === 'blanc') a.appendChild(el('span','ext','↗'));
    return a;
  }
  function groups(items){
    var box = el('div','groups');
    GROUPS.forEach(function(g){
      var list = items.filter(function(it){ return g.types.indexOf(it.type) > -1; })
        .sort(function(a,b){ return g.types.indexOf(a.type) - g.types.indexOf(b.type); });
      if (!list.length) return;
      var d = el('div','grp ' + g.cls); d.appendChild(el('h4', null, g.title));
      var ls = el('div','links'); list.forEach(function(it){ ls.appendChild(link(it)); }); d.appendChild(ls);
      box.appendChild(d);
    });
    return box;
  }

  // Statistiques : une visite par classe affichée, un événement par document ouvert
  var counted = null;
  main.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('a.doc'); if (!a || !window.stat) return;
    var art = a.closest('article'), code = art && art.querySelector('.code');
    var lab = (a.querySelector('.t') || a).textContent.trim();
    stat((levelOf(current) || '') + ' ' + (code ? code.textContent : '') + ' · ' + lab, lab + ' (' + current + ')', true);
  });
  function render(){
    if (window.stat && counted !== current){ counted = current; stat(current ? '/' + current : '/', current ? 'Classe ' + current : 'Accueil sans classe'); }
    [].forEach.call(picker.querySelectorAll('.pill'), function(b){ b.setAttribute('aria-pressed', b.dataset.c === current); });
    main.innerHTML = '';
    if (!current){ main.appendChild(el('div','empty','Choisis ta classe ci-dessus pour voir tes documents.')); return; }
    var lv = levelOf(current);
    // séquences et notions de la classe, de la plus récente à la plus ancienne
    var full = (D.niveaux[lv] || []).map(function(s){
      var ns = mine(s.notions).map(function(n){ return {num:n.num, titre:n.titre, ns:n.ns, items:mine(n.items)}; });
      return {num:s.num, titre:s.titre, notions:ns.reverse()};
    }).filter(function(s){ return s.notions.length; }).reverse();
    // évaluations (de notion ou communes à plusieurs notions) : rassemblées dans l'onglet « Évaluations », de la plus récente à la plus ancienne
    var evals = [];
    full.forEach(function(s){ s.notions.forEach(function(n){
      var its = n.items.filter(isEval);
      if (its.length) evals.push({num:n.num, titre:n.titre, ns:n.ns, seq:s, items:its});
    }); });
    var seqs = full.map(function(s){
      var ns = s.notions.map(function(n){ return {num:n.num, titre:n.titre, items:n.items.filter(function(it){ return !isEval(it); })}; })
        .filter(function(n){ return typeof n.num === 'number' && n.items.length; });
      return {num:s.num, titre:s.titre, notions:ns};
    }).filter(function(s){ return s.notions.length; });
    var all = []; full.forEach(function(s){ s.notions.forEach(function(n){ all = all.concat(n.items); }); });
    // DM donnés à la classe (onglet « DM »), du plus récent au plus ancien
    var dkey = function(d){ return allMode() ? Object.keys(d.dates).map(function(k){ return d.dates[k]; }).sort().pop() || '' : d.dates[current] || ''; };
    var dms = (D.dm || []).filter(function(d){ return allMode() ? d.lv === lv : d.cls.indexOf(current) > -1; })
      .sort(function(a, b){ return dkey(a) < dkey(b) ? 1 : -1; });
    dms.forEach(function(d){ all.push({href: d.href}); if (d.anim) all.push({href: d.anim}); });
    if (!full.length && !dms.length){ main.appendChild(el('div','empty','Aucun document pour la ' + current + ' pour le moment.')); return; }

    var up = upcoming(lv);
    var tabs = el('div','tabs'); tabs.setAttribute('role','group');
    var tlist = [['cours','Mes cours'],['evals','Évaluations']].concat(dms.length ? [['dm','DM']] : []).concat((D.dnb && D.dnb.parts && D.dnb.parts.length) ? [['brevet','Exercices DNB']] : []).concat([['auto', lv === '3e' ? 'Automatismes DNB' : 'Automatismes'], ['curio','Curiosités']]);
    if (!tlist.some(function(t){ return t[0] === view; })) view = 'cours';
    tlist.forEach(function(t){
      var b = el('button'); b.appendChild(icon(t[0])); b.appendChild(document.createTextNode(t[1])); b.setAttribute('aria-pressed', view === t[0]);
      if (t[0] === 'evals' && (up.length || evals.some(function(e){ return e.items.some(isNew); }))) b.appendChild(el('span','tdot'));
      if (t[0] === 'dm' && dms.some(function(d){ return isNew(d); })) b.appendChild(el('span','tdot'));
      b.onclick = t[0] === 'auto' || t[0] === 'curio' ? function(){ location.href = (t[0] === 'auto' ? 'auto.html' : 'curiosites.html') + location.hash; } : function(){ view = t[0]; render(); }; tabs.appendChild(b);

    // Sujets complets et corrigés complets : 3e (et vue enseignant) ; en 4e, élèves : seules les parties déjà au programme
    var sujets = (lv === '3e' || D.prof) ? (B.sujets || []) : [], SK = 'Sujets complets';
    if (!mine.length && !sujets.length){ main.appendChild(el('div','empty','Pas encore d’exercice de brevet pour la ' + current + ' : ils arrivent quand les notions sont faites en classe.')); return; }
    var titles = (B.seqs || {})[lv] || {}, seen = {};
    try { seen = JSON.parse(localStorage.getItem('mp:dnbvu') || '{}'); } catch(e){}
    // Séquences de même nom (« Fonctions (1) », « Fonctions (2) »…) regroupées en un seul bloc, comme dans Mes cours
    var bySeq = {}, groups = [], byKey = {}, last = 0;
    mine.forEach(function(p){ (bySeq[p[sk]] = bySeq[p[sk]] || []).push(p); });
    Object.keys(bySeq).map(Number).sort(function(a, b){ return (a || 99) - (b || 99); }).forEach(function(s){
      var k = s ? domainOf(titles[s] || ('Séquence ' + s)) : 'Algorithmique';
      if (!byKey[k]){ byKey[k] = {key:k, nums:[], n:0}; groups.push(byKey[k]); }
      byKey[k].nums.push(s); byKey[k].n += bySeq[s].length;
      if (s > last) last = s;
    });
    if (sujets.length){ byKey[SK] = {key:SK, nums:[], n:sujets.length, sujets:true}; groups.unshift(byKey[SK]); }
    var curKey = last ? domainOf(titles[last] || ('Séquence ' + last)) : groups[groups.length > 1 && sujets.length ? 1 : 0].key;
    if (!byKey[dnbSel]) dnbSel = curKey;
    function nums(g){ if (g.sujets) return 'Brevet ' + sujets[0].an; var n = g.nums.filter(Boolean); return n.length ? (n.length > 1 ? 'Séquences ' : 'Séquence ') + n.join(' et ') : 'Scratch'; }
    function count(n, g){ return n + (g && g.sujets ? ' sujet' : ' exercice') + (n > 1 ? 's' : ''); }
    function row(p, title, src, first){
      var row = el('div','dnbrow' + (first ? ' first' : '')), info = el('div','dnbinfo');
      info.appendChild(el('b', null, title));
      info.appendChild(el('span','dnbsrc', src));
      row.appendChild(info);
      var acts = el('div','dnbacts');
      acts.appendChild(link({type:'evaluation', label:p.c.indexOf('complet') > -1 ? 'Sujet' : 'Énoncé', href:p.e}));
      var showC = function(){ var c = link({type:'correction', label:'Corrigé', href:p.c}); acts.replaceChild(c, btn); };
      var btn = el('button','dnbbtn','J’ai cherché : voir le corrigé'); btn.type = 'button';
      btn.onclick = function(){ seen[p.id] = 1; try { localStorage.setItem('mp:dnbvu', JSON.stringify(seen)); } catch(e){} showC(); };
      acts.appendChild(btn);
      if (seen[p.id]) showC();
      row.appendChild(acts);
      return row;
    }

    var nav = el('nav','seqnav'); nav.setAttribute('aria-label','Séquences');
    nav.appendChild(el('p','kicker','Choisis une séquence'));
    var list = el('div','seqlist');
    groups.forEach(function(g){
      var b = el('button','seqbtn withico' + (g.sujets ? ' sujbtn' : '')); b.type = 'button';
      b.setAttribute('aria-pressed', g.key === dnbSel);
      if (g.sujets){
        b.appendChild(icon('brevet','tile'));
        var t2 = el('span','txt');
        t2.appendChild(el('span','sk','Entraînement complet'));
        t2.appendChild(el('span','st','Sujets complets du brevet ' + sujets[0].an));
        t2.appendChild(el('span','sd', sujets.length + ' sujets entiers, comme le jour de l’épreuve, avec leurs corrigés complets'));
        b.appendChild(t2); b.appendChild(el('span','go','Voir les sujets →'));
        b.onclick = function(){ dnbSel = g.key; render(); var t = document.getElementById('dnb-list'); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); };
        list.appendChild(b); return;
      }
      b.appendChild(seqIcon(g.key));
      var tx = el('span','txt');
      tx.appendChild(el('span','sn', nums(g) + ' · ' + count(g.n, g)));
      tx.appendChild(el('span','st', g.key)); b.appendChild(tx);
      b.onclick = function(){ dnbSel = g.key; render(); var t = document.getElementById('dnb-list'); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); };
      list.appendChild(b);
    });
    nav.appendChild(list); main.appendChild(nav);

    var g = byKey[dnbSel];
    var sec = el('section','dnbview'); sec.id = 'dnb-list';
    var hd = el('div','seqhead withico');
    hd.appendChild(g.sujets ? icon('brevet','tile') : seqIcon(g.key));
    var hx = el('div'); hx.appendChild(el('p','seqname', nums(g) + ' · ' + count(g.n, g))); hx.appendChild(el('h2', null, g.key)); hd.appendChild(hx);
    sec.appendChild(hd);
    if (g.sujets){
      sec.appendChild(el('p','dnbmore','Le sujet entier, comme le jour de l’épreuve (2 h, 100 points). Il peut contenir des notions pas encore vues en classe : passe ces questions.'));
      var sb = el('section','dnbseq');
      sujets.forEach(function(p, i){ sb.appendChild(row(p, 'Brevet ' + p.src, 'Sujet officiel complet · corrigé complet rédigé', !i)); });
      sec.appendChild(sb);
    }
    g.nums.forEach(function(s){
      var box = el('section','dnbseq');
      if (g.nums.length > 1){
        var h = el('h3'); h.appendChild(el('span','dnbno', 'Séquence ' + s)); h.appendChild(document.createTextNode(titles[s] || ''));
        h.appendChild(el('span','dnbn', count(bySeq[s].length)));
        box.appendChild(h);
      }
      bySeq[s].forEach(function(p, i){
        box.appendChild(row(p, p.titre, 'Brevet ' + p.src + ' · ' + p.theme, !i && g.nums.length < 2));
      });
      sec.appendChild(box);
    });
    main.appendChild(sec);
  }

  if (current) loadSeen();
  render();
}
// Les données sont rechargées à chaque visite (pas de cache) pour que les liens correspondent toujours aux fichiers en ligne
// Adresse secrète de classe (#4e3/<clé>) : la clé déchiffre les corrections réservées à cette classe (enc/*.bin)
var KEY = (decodeURIComponent(location.hash.slice(1)).split('/')[1] || '').replace(/[^A-Za-z0-9_-]/g, '');
function b64u(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function hexOf(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
function addSecret(D){
  if (!KEY || !window.crypto || !crypto.subtle) return D;
  var raw;
  try { raw = b64u(KEY); } catch(e){ return D; }
  if (raw.length !== 16) return D;
  return crypto.subtle.importKey('raw', raw, {name:'HMAC', hash:'SHA-256'}, false, ['sign'])
    .then(function(hk){ return crypto.subtle.sign('HMAC', hk, new TextEncoder().encode('manifest')); })
    .then(function(sig){ return fetch('enc/' + hexOf(sig).slice(0, 20) + '.bin?t=' + Date.now(), {cache:'no-store'}); })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(function(buf){
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function(k){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:new Uint8Array(buf, 0, 12)}, k, new Uint8Array(buf, 12));
      });
    })
    .then(function(plain){
      var c = find0(D, decodeURIComponent(location.hash.slice(1)).split('/')[0]);
      var got = JSON.parse(new TextDecoder().decode(plain));
      // adresse enseignant (#prof/<clé>) : données complètes, tous les documents de la page enseignant
      if (!Array.isArray(got)) { got.prof = true;
        // les exercices interactifs ajoutés depuis la dernière synchro (data.json public) sont repris tout de suite ; plus de liens MathALÉA
        Object.keys(got.niveaux || {}).forEach(function(lv){ (got.niveaux[lv] || []).forEach(function(s){ s.notions.forEach(function(n){
          n.items = n.items.filter(function(it){ return it.type !== 'alea'; });
          (D.niveaux[lv] || []).forEach(function(s2){ s2.notions.forEach(function(n2){ if (n2.num !== n.num) return;
            n2.items.forEach(function(it){ if (it.type === 'exo' && !n.items.some(function(o){ return o.href === it.href; })){
              var k = n.items.map(function(o){ return o.type; }).indexOf('anim'), v = n.items.map(function(o){ return o.type; }).indexOf('video'), at = k > -1 ? k : v > -1 ? v : n.items.length;
              n.items.splice(at, 0, it); } }); }); });
        }); }); });
        // sujets complets du brevet ajoutés depuis la dernière synchro : repris du data.json public
        if (D.dnb && D.dnb.sujets && got.dnb && !got.dnb.sujets) got.dnb.sujets = D.dnb.sujets;
        return got; }
      got.forEach(function(it){
        (D.niveaux[it.lv] || []).forEach(function(s){ s.notions.forEach(function(n){
          if (n.num === it.num) n.items.push({type:it.type, label:it.label, href:it.e, enc:it.e, cls:[c]});
        }); });
      });
      return D;
    })
    .catch(function(){ return D; });
}
function find0(D, c){ c = (c || '').toLowerCase(); for (var l in D.classes) for (var i = 0; i < D.classes[l].length; i++) if (D.classes[l][i].toLowerCase() === c) return D.classes[l][i]; return ''; }
fetch('data.json?t=' + Date.now(), {cache: 'no-store'})
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(addSecret)
  .then(start)
  .catch(function(){ document.getElementById('main').innerHTML = '<div class="empty">Impossible de charger les documents. Vérifie ta connexion puis recharge la page.</div>'; });

</script>
