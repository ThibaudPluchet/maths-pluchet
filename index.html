<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths – M. Pluchet</title>
<meta name="description" content="Les documents de mathématiques distribués en classe, pour les élèves de 4e et de 3e du collège Louis Bouilhet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1d2433; --muted:#5d6577; --line:#e4e0d6;
  --accent:#2f5bd3; --accent-ink:#ffffff; --soft:#e9eefc;
  --act:#0f8a6a; --cours:#2f5bd3; --exo:#b85c00; --eval:#b3261e; --carte:#7a3fb8; --rev:#00788c; --video:#c2185b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171e; --card:#1c2029; --ink:#e9ecf2; --muted:#a2aabb; --line:#2c3240;
    --accent:#7c9cff; --accent-ink:#0f1320; --soft:#232a3d;
    --act:#4fd1a8; --cours:#8fa9ff; --exo:#f0a050; --eval:#ff8a80; --carte:#c49bf0; --rev:#5ccfe0; --video:#f48fb1; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.wrap{padding-top:40px;padding-bottom:20px}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 6px}
.sub{color:var(--muted);margin:0}
.picker{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
.picker-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.picker-label{font-size:13px;color:var(--muted);margin-right:4px;width:100%}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:8px 16px;font:600 15px Inter,sans-serif;cursor:pointer;min-width:64px}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
main.wrap{padding-top:24px;padding-bottom:60px}
.seq{margin:0 0 28px}
.seq h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 10px}
.seq h2 span{color:var(--muted);font:500 14px Inter,sans-serif;margin-right:6px}
.notion{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.notion h3{font-size:17px;margin:0 0 12px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.code{font:600 12px Inter,sans-serif;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 7px}
.new{font:600 12px Inter,sans-serif;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 7px}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.doc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500;background:var(--bg)}
.doc:hover{border-color:currentColor}
.doc i{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}
.doc.video i{border-radius:50%}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
footer.wrap{color:var(--muted);font-size:13px;padding-top:20px;padding-bottom:40px;border-top:1px solid var(--line)}
@media (min-width:600px){ .picker-label{width:auto} }
</style>
</head>
<body>
<header class="wrap">
  <h1>Mathématiques</h1>
  <p class="sub">M. Pluchet · Collège Louis Bouilhet · Les documents distribués en classe</p>
</header>
<nav class="picker"><div class="wrap picker-row" id="picker"><span class="picker-label">Ma classe :</span></div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap">Les documents apparaissent ici au fur et à mesure qu'ils sont distribués en classe. Les vidéos sont celles d'Yvan Monka.</footer>
<script src="data.js"></script>
<script>
(function(){
  var D = window.SITE_DATA, picker = document.getElementById('picker'), main = document.getElementById('main');
  var COLORS = {activite:'--act',cours:'--cours',exercices:'--exo',evaluation:'--eval','evaluation-pap':'--eval',carte:'--carte',revision:'--rev',video:'--video'};
  function getSaved(){ try{ return localStorage.getItem('classe'); }catch(e){ return null; } }
  function save(c){ try{ localStorage.setItem('classe', c); }catch(e){} }
  function levelOf(c){ for (var l in D.classes) if (D.classes[l].indexOf(c) > -1) return l; }
  function find(c){ c = (c || '').toLowerCase(); for (var l in D.classes) for (var i = 0; i < D.classes[l].length; i++) if (D.classes[l][i].toLowerCase() === c) return D.classes[l][i]; return ''; }
  var current = find(decodeURIComponent(location.hash.slice(1))) || find(getSaved());

  Object.keys(D.classes).forEach(function(l){
    if (!D.classes[l].length) return;
    if (picker.querySelector('.pill')) { var s = document.createElement('span'); s.className = 'sep'; picker.appendChild(s); }
    D.classes[l].forEach(function(c){
      var b = document.createElement('button'); b.className = 'pill'; b.textContent = c;
      b.onclick = function(){ current = c; save(c); history.replaceState(null, '', '#' + encodeURIComponent(c)); render(); };
      b.dataset.c = c; picker.appendChild(b);
    });
  });

  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function render(){
    [].forEach.call(picker.querySelectorAll('.pill'), function(b){ b.setAttribute('aria-pressed', b.dataset.c === current); });
    main.innerHTML = '';
    if (!current){ main.appendChild(el('div','empty','Choisis ta classe ci-dessus pour voir tes documents.')); return; }
    var seqs = D.niveaux[levelOf(current)] || [], shown = 0, lastNotion = null, blocks = [];
    seqs.forEach(function(seq){
      var notions = seq.notions.filter(function(n){ return n.cls.indexOf(current) > -1; }).reverse();
      if (!notions.length) return;
      var sec = el('section','seq'), h = el('h2');
      h.appendChild(el('span', null, 'Séquence ' + seq.num)); h.appendChild(document.createTextNode(seq.titre));
      sec.appendChild(h);
      var isNewest = true;
      notions.forEach(function(n){
        var card = el('article','notion'), h3 = el('h3');
        h3.appendChild(el('span','code','N' + n.num)); h3.appendChild(document.createTextNode(n.titre));
        card.appendChild(h3);
        var docs = el('div','docs');
        n.items.forEach(function(it){
          if (it.cls.indexOf(current) < 0) return;
          var a = el('a','doc' + (it.type === 'video' ? ' video' : '')); a.href = it.href; a.target = '_blank'; a.rel = 'noopener';
          var dot = el('i'); dot.style.setProperty('--c', 'var(' + COLORS[it.type] + ')'); a.style.color = 'var(' + COLORS[it.type] + ')';
          a.appendChild(dot); var t = el('span', null, it.label); t.style.color = 'var(--ink)'; a.appendChild(t);
          docs.appendChild(a);
        });
        card.appendChild(docs); sec.appendChild(card); if (!lastNotion || isNewest) lastNotion = h3; isNewest = false; shown++;
      });
      blocks.push(sec);
    });
    if (!shown){ main.appendChild(el('div','empty','Aucun document pour la ' + current + ' pour le moment.')); return; }
    lastNotion.appendChild(el('span','new','En cours'));
    blocks.reverse().forEach(function(b){ main.appendChild(b); });
  }
  render();
})();
</script>
</body>
</html>
